<section class="instructor-evaluations-page">
  <div class="instructor-evaluations-page__container">

    <app-instructor-evaluation-header />

    <app-evaluation-support
      (contactSupport)="onContactSupport()"
    />

    <app-evaluation-tabs
      [activeTab]="activeTab"
      [pendingCount]="pendingCount"
      [completedCount]="completedCount"
      (tabChange)="onTabChange($event)"
    />

    <main class="instructor-evaluations-page__content">

      <app-pending-evaluations
        *ngIf="activeTab === 'pending'"
        [meetings]="pendingMeetings"
        [loading]="loadingPending"
        (evaluate)="onEvaluate($event)"
      />

      <app-completed-evaluations
        *ngIf="activeTab === 'completed'"
        [evaluations]="completedEvaluations"
        [loading]="loadingCompleted"
        (viewEvaluation)="onViewCompletedEvaluation($event)"
      />

    </main>

  </div>
</section>

<app-evaluate-instructor-modal
  [show]="showEvaluationModal"
  [meeting]="selectedMeeting"
  (submitEvaluation)="onSubmitEvaluation($event)"
  (close)="closeEvaluationModal()">
</app-evaluate-instructor-modal>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  [showButtons]="modal.showButtons ?? false"
  (confirmAction)="modal.confirm?.()"
  (close)="modal.close()">
</app-modal>
