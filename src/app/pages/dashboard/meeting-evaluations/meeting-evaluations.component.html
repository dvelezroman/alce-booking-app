<h2 class="title stage">Clases Evaluadas</h2>

<section class="meeting-evaluations-section">

  <!-- FILTERS -->
  <div class="filters-wrapper">
    <app-meeting-evaluations-filters
      mode="evaluations"
      (filtersSubmitted)="onFiltersSubmitted($event)">
    </app-meeting-evaluations-filters>
  </div>

  <!-- RESULTS -->
  <div class="results-wrapper">

    <!-- SORT BAR -->
    <div class="sort-bar">
      <button
        class="sort-btn"
        [class.active]="sortBy === 'createdAt'"
        (click)="changeSort('createdAt')"
      >
        Fecha
        <span *ngIf="sortBy === 'createdAt'">
          {{ sortOrder === 'asc' ? '↑' : '↓' }}
        </span>
      </button>

      <button
        class="sort-btn"
        [class.active]="sortBy === 'rating'"
        (click)="changeSort('rating')"
      >
        Rating
        <span *ngIf="sortBy === 'rating'">
          {{ sortOrder === 'asc' ? '↑' : '↓' }}
        </span>
      </button>
    </div>

    <app-meeting-evaluations-table
      [evaluations]="evaluations"
      [searchAttempted]="searchAttempted"
      [showInstructor]="showInstructorColumn"
      [showStudent]="showStudentColumn"
      (evaluationSelected)="onEvaluationSelected($event)"
      (acceptanceToggled)="onAcceptanceToggled($event)">
    </app-meeting-evaluations-table>

  </div>

</section>

<!-- MODALES -->
 
<app-meeting-evaluation-detail-modal
  [evaluation]="selectedEvaluation"
  [show]="showEvaluationModal"
  (close)="closeEvaluationModal()">
</app-meeting-evaluation-detail-modal>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  [showButtons]="modal.showButtons ?? false"
  (confirmAction)="modal.confirm?.()"
  (close)="modal.close()">
</app-modal>
