<main class="meeting-evaluations-page">
  <div class="meeting-evaluations-page__container">

    <section class="meeting-evaluations-page__block">
      <app-meeting-evaluations-header
        (createRequested)="openCreateEvaluationModal()">
      </app-meeting-evaluations-header>
    </section>

    <section class="meeting-evaluations-page__summary">
      <app-meeting-evaluations-summary
        [totalEvaluations]="totalEvaluations"
        [averageRating]="averageRating"
        [acceptedEvaluations]="acceptedEvaluations"
        [acceptedPercentage]="acceptedPercentage"
        [evaluationsWithObservation]="evaluationsWithObservation"
        [observationPercentage]="observationPercentage"
        [rejectedEvaluations]="rejectedEvaluations"
        [rejectedPercentage]="rejectedPercentage">
      </app-meeting-evaluations-summary>
    </section>

    <section class="meeting-evaluations-page__block">
      <app-meeting-evaluations-filters
        [sortBy]="sortBy"
        [sortOrder]="sortOrder"

        [filteredStudents]="filteredStudents"
        [filteredInstructors]="filteredInstructors"

        [showStudentDropdown]="showStudentDropdown"
        [showInstructorDropdown]="showInstructorDropdown"

        (studentInputChange)="onStudentSearchChange($event)"
        (studentSelected)="onStudentSelected($event)"
        (studentDropdownHidden)="hideStudentDropdown()"

        (instructorInputChange)="onInstructorSearchChange($event)"
        (instructorSelected)="onInstructorSelected($event)"
        (instructorDropdownHidden)="hideInstructorDropdown()"

        (filtersSubmitted)="onFiltersSubmitted($event)"
        (sortRequested)="changeSort($event)">
      </app-meeting-evaluations-filters>
    </section>

    <section
      class="meeting-evaluations-page__results"
      [class.meeting-evaluations-page__results--detail-open]="
        showEvaluationModal && selectedEvaluation
      ">

      <div class="meeting-evaluations-page__table-card">
        <app-meeting-evaluations-table
          [evaluations]="pagedEvaluations"
          [isLoading]="isLoading"
          [showInstructorColumn]="showInstructorColumn"
          [showStudentColumn]="showStudentColumn"
          [updatingEvaluationId]="updatingEvaluationId"
          (evaluationSelected)="onEvaluationSelected($event)"
          (acceptanceToggled)="onAcceptanceToggled($event)">
        </app-meeting-evaluations-table>

        <app-meeting-evaluations-pagination
          [page]="page"
          [totalPages]="totalPages"
          [total]="total"
          [limit]="limit"
          [limitOptions]="limitOptions"
          [canPrev]="canPrev"
          [canNext]="canNext"
          [paginationLabel]="paginationLabel"
          (pageChange)="onPageChange($event)"
          (previousRequested)="onPrev()"
          (nextRequested)="onNext()"
          (limitChange)="onLimitChange($event)">
        </app-meeting-evaluations-pagination>
      </div>

      <aside
        *ngIf="showEvaluationModal && selectedEvaluation"
        class="meeting-evaluations-page__detail">
        <app-meeting-evaluation-detail-panel
          [evaluation]="selectedEvaluation"
          (closeRequested)="closeEvaluationModal()">
        </app-meeting-evaluation-detail-panel>
      </aside>

    </section>

  </div>
</main>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  [showButtons]="modal.showButtons ?? false"
  (confirmAction)="modal.confirm?.()"
  (close)="modal.close()">
</app-modal>
