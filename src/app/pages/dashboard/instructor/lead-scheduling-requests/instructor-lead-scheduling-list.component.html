<section class="instructor-scheduling-page">
  <div class="instructor-scheduling-page__container">

    <!-- =========================
         HEADER
    ========================== -->

    <app-instructor-scheduling-request-header
      [loading]="loading"
      (refreshRequested)="load()">
    </app-instructor-scheduling-request-header>

    <!-- =========================
         FILTROS
    ========================== -->

    <app-instructor-scheduling-request-filters
      [searchName]="searchName"
      [dateFrom]="dateFrom"
      [dateTo]="dateTo"
      [sessionTodayOnly]="sessionTodayOnly"
      [filterStatus]="statusFilter"
      [filterKind]="kindFilter"
      [loading]="loading"
      [hasActiveFilters]="hasActiveFilters"
      (searchNameChange)="searchName = $event"
      (dateFromChange)="dateFrom = $event"
      (dateToChange)="dateTo = $event"
      (sessionTodayOnlyChange)="sessionTodayOnly = $event"
      (filterStatusChange)="statusFilter = $event"
      (filterKindChange)="kindFilter = $event"
      (clientFiltersChange)="onClientFiltersChange()"
      (serverFiltersChange)="onServerFiltersChange()"
      (dateRangeChange)="onDateRangeChange()"
      (sessionTodayToggle)="toggleSessionToday()"
      (clearFiltersRequested)="clearFilters()">
    </app-instructor-scheduling-request-filters>

    <!-- =========================
         ERROR
    ========================== -->

    <div *ngIf="error && !loading" class="instructor-scheduling-page__error">
      <span class="instructor-scheduling-page__error-icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 7.5v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <circle cx="12" cy="16.5" r="1" fill="currentColor" />
        </svg>
      </span>

      <span>{{ error }}</span>
    </div>

    <!-- =========================
         RESUMEN
    ========================== -->

    <app-instructor-scheduling-request-summary
      [total]="filteredItems.length"
      [rangeLabel]="rangeLabel"
      [pageSize]="pageSize"
      [pageSizeChoices]="pageSizeChoices"
      [loading]="loading"
      (pageSizeChange)="pageSize = $event; onPageSizeChange()">
    </app-instructor-scheduling-request-summary>

    <!-- =========================
         TABLA
    ========================== -->

    <div class="instructor-scheduling-page__list">
      <app-instructor-scheduling-request-list
        [items]="pagedItems"
        [loading]="loading"
        [kindText]="kindText.bind(this)"
        [statusText]="statusText.bind(this)"
        [slotText]="slotText.bind(this)"
        [notesPreview]="notesPreview.bind(this)">
      </app-instructor-scheduling-request-list>
    </div>

    <!-- =========================
         PAGINACIÓN
    ========================== -->

    <app-instructor-scheduling-request-pagination
      *ngIf="!loading && filteredItems.length > 0"
      [pageIndex]="pageIndex"
      [totalPages]="totalPages"
      [canPrev]="pageIndex > 0"
      [canNext]="pageIndex < totalPages - 1"
      (firstPage)="goFirst()"
      (previousPage)="goPrev()"
      (nextPage)="goNext()"
      (lastPage)="goLast()">
    </app-instructor-scheduling-request-pagination>

  </div>
</section>
