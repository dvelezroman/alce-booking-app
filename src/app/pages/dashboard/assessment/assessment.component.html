<section class="assessment-page">

  <!-- =========================
       HEADER
  ========================== -->
  <header class="assessment-page__header">

    <div class="assessment-page__heading">
      <h1 class="assessment-page__title">
        Evaluación del estudiante
      </h1>

      <p class="assessment-page__description">
        Registra y revisa las evaluaciones por tipo de competencia.
      </p>
    </div>


    <!-- PUNTAJE MÍNIMO -->
    <div class="minimum-score-card">

      <div
        class="minimum-score-card__icon"
        aria-hidden="true"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 3.5L14.6 8.77L20.42 9.62L16.21 13.72L17.2 19.52L12 16.78L6.8 19.52L7.79 13.72L3.58 9.62L9.4 8.77L12 3.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="minimum-score-card__content">

        <span class="minimum-score-card__label">
          Puntaje mínimo para aprobar
        </span>

        <strong class="minimum-score-card__value">
          {{ minPointsAssessment ?? '--' }} puntos
        </strong>

      </div>

    </div>

  </header>


  <!-- =========================
       CONTENIDO PRINCIPAL
  ========================== -->
  <div class="assessment-page__content">


    <!-- =========================
         COLUMNA IZQUIERDA
    ========================== -->
    <div class="assessment-page__main-column">


      <!-- ESTUDIANTE Y ETAPA ACTUAL -->
      <app-student-summary
        [selectedStudent]="selectedStudent"
        [currentStageId]="currentStageId"
        [instructorId]="instructorId"
        (studentSelected)="handleStudentSelected($event)"
      />


      <!-- EVALUACIONES REGISTRADAS -->
      <app-assessment-list
        [assessments]="assessments"
        [selectedStudent]="selectedStudent"
        [currentStageId]="currentStageId"
        [minPointsAssessment]="minPointsAssessment"
        [hasSearched]="hasSearched"
      />

    </div>


    <!-- =========================
         COLUMNA DERECHA
    ========================== -->
    <aside class="assessment-page__side-column">


      <!-- NUEVA EVALUACIÓN -->
      <app-assessment-form
        [selectedStudent]="selectedStudent"
        [currentStageId]="currentStageId"
        [instructorId]="instructorId"
        [minPointsAssessment]="minPointsAssessment"
        [blockedTypes]="blockedTypes"
        [resources]="transformedResources"
        (assessmentCreated)="handleAssessmentCreated($event)"
      />


      <!-- RECURSOS DE REFUERZO -->
      <app-assessment-resources
        [resources]="resources"
      />

    </aside>

  </div>


  <!-- =========================
       PROMOCIÓN DE ETAPA
  ========================== -->
  <div class="assessment-page__promotion">

    <app-stage-promotion-info
      [selectedStudent]="selectedStudent"
      [minPointsAssessment]="minPointsAssessment"
    />

  </div>


  <!-- =========================
       MODAL GLOBAL
  ========================== -->
  <app-modal
    [showModal]="modal.show"
    [message]="modal.message"
    [isError]="modal.isError"
    [isSuccess]="modal.isSuccess"
    [isInfo]="modal.isInfo"
    [showButtons]="modal.showButtons ?? false"
    (confirmAction)="modal.confirm && modal.confirm()"
    (close)="modal.close()"
  />

</section>
