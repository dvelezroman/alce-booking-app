<section class="platform-assign-page">

  <div class="platform-assign-page__container">

    <!-- =========================
         HEADER
    ========================== -->

    <app-platform-assessments-assign-header>
    </app-platform-assessments-assign-header>


    <!-- =========================
         TEMPLATE
    ========================== -->

    <app-platform-assessments-assign-template
      [templates]="templates"
      [templatesLoading]="templatesLoading"
      [templateSearch]="templateSearch"
      [selectedTemplateId]="selectedTemplateId"
      [selectedTemplate]="selectedTemplate"
      (templateSearchChange)="templateSearch = $event"
      (templateSelected)="onTemplateSelected($event)"
      (searchRequested)="loadTemplates()"
    >
    </app-platform-assessments-assign-template>


    <!-- =========================
         STUDENTS
    ========================== -->

    <app-platform-assessments-assign-students
      [idNumberSearch]="idNumberSearch"
      [studentIdSearch]="studentIdSearch"
      [selected]="selected"
      (idNumberSearchChange)="idNumberSearch = $event"
      (studentIdSearchChange)="studentIdSearch = $event"
      (addByIdNumberRequested)="addByIdNumber()"
      (addByStudentIdRequested)="addByStudentId()"
      (removeStudentRequested)="removeStudent($event)"
    >
    </app-platform-assessments-assign-students>


    <!-- =========================
         WINDOW
    ========================== -->

    <app-platform-assessments-assign-window
      [expiresLocal]="expiresLocal"
      [maxAttempts]="maxAttempts"
      [submitting]="submitting"
      (expiresLocalChange)="expiresLocal = $event"
      (maxAttemptsChange)="maxAttempts = $event"
      (submitRequested)="submit()"
    >
    </app-platform-assessments-assign-window>


    <!-- =========================
         RESULT
    ========================== -->

    @if (lastResult) {

      <app-platform-assessments-assign-result
        [result]="lastResult"
      >
      </app-platform-assessments-assign-result>

    }

  </div>


  <!-- =========================
       MODAL
  ========================== -->

  <app-modal
    [showModal]="modal.show"
    [message]="modal.message"
    [isError]="modal.isError"
    [isSuccess]="modal.isSuccess"
    [isInfo]="modal.isInfo"
    [showButtons]="modal.showButtons ?? false"
    (confirmAction)="modal.confirm?.()"
    (close)="modal.close()"
  >
  </app-modal>

</section>
