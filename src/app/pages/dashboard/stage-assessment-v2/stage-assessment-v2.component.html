<section class="stage-assessment-page">

  <div class="stage-assessment-page__container">

    <!-- =========================
         HEADER
    ========================== -->
    <app-stage-assessment-header>
    </app-stage-assessment-header>


    <!-- =========================
         STAGE / ACTIONS
    ========================== -->
    <app-stage-assessment-stage-selector
      [selectedStageId]="selectedStageId"
      [selectedStage]="selectedStage"
      [resourcesCount]="resourcesCount"
      [selectedStudentsCount]="selectedStudentsCount"
      [isRecalculating]="isRecalculating"
      (stageSelected)="onStageSelected($event)"
      (recalculateRequested)="confirmRecalculateProgress()"
      (assignRequested)="openCreateAssessmentPanel()"
    >
    </app-stage-assessment-stage-selector>


    <!-- =========================
         WORKSPACE
    ========================== -->
    <div
      class="stage-assessment-page__workspace"
      [class.stage-assessment-page__workspace--panel-open]="
        isCreatePanelOpen
      "
    >

      <!-- =========================
           MAIN CONTENT
      ========================== -->
      <main class="stage-assessment-page__main">

        <!-- =========================
             SUMMARY
        ========================== -->
        <app-stage-assessment-summary
          [hasStageSelected]="!!selectedStageId"
          [totalStudents]="stageProgressList.length"
          [averageProgress]="averageProgress"
          [activeAssessmentsCount]="activeAssessmentsCount"
          [resourcesCount]="resourcesCount"
          [stageEntryDate]="stageEntryDate"
        >
        </app-stage-assessment-summary>


        <!-- =========================
             STUDENTS
        ========================== -->
        <section class="stage-assessment-page__students">

          <!-- =========================
               LOADING SKELETON
          ========================== -->
          @if (isLoadingStudents) {

            <div class="student-list-skeleton">

              <!-- SKELETON HEADER -->

              <div class="student-list-skeleton__top">

                <div class="student-list-skeleton__heading">

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--title
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--subtitle
                    "
                  >
                  </div>

                </div>


                <div class="student-list-skeleton__filters">

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--search
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--limit
                    "
                  >
                  </div>

                </div>

              </div>


              <!-- SKELETON SELECTION BAR -->

              <div class="student-list-skeleton__selection">

                <div
                  class="
                    student-list-skeleton__block
                    student-list-skeleton__block--selection
                  "
                >
                </div>

                <div class="student-list-skeleton__selection-actions">

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--button
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--button
                    "
                  >
                  </div>

                </div>

              </div>


              <!-- SKELETON TABLE -->

              <div class="student-list-skeleton__table">

                <!-- TABLE HEADER -->

                <div class="student-list-skeleton__table-header">

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--checkbox
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--header
                    "
                  >
                  </div>

                  <div
                    class="
                      student-list-skeleton__block
                      student-list-skeleton__block--small
                    "
                  >
                  </div>

                </div>


                <!-- ROWS -->

                @for (
                  row of [1, 2, 3, 4, 5];
                  track row
                ) {

                  <div class="student-list-skeleton__row">

                    <!-- CHECKBOX -->

                    <div
                      class="
                        student-list-skeleton__block
                        student-list-skeleton__block--checkbox
                      "
                    >
                    </div>


                    <!-- STUDENT -->

                    <div class="student-list-skeleton__student">

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--avatar
                        "
                      >
                      </div>

                      <div class="student-list-skeleton__student-content">

                        <div
                          class="
                            student-list-skeleton__block
                            student-list-skeleton__block--name
                          "
                        >
                        </div>

                        <div
                          class="
                            student-list-skeleton__block
                            student-list-skeleton__block--email
                          "
                        >
                        </div>

                      </div>

                    </div>


                    <!-- ENTRY DATE -->

                    <div class="student-list-skeleton__column">

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--medium
                        "
                      >
                      </div>

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--tiny
                        "
                      >
                      </div>

                    </div>


                    <!-- PROGRESS -->

                    <div class="student-list-skeleton__column">

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--tiny
                        "
                      >
                      </div>

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--progress
                        "
                      >
                      </div>

                    </div>


                    <!-- ACTIVE ASSESSMENTS -->

                    <div class="student-list-skeleton__column">

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--medium
                        "
                      >
                      </div>

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--badge
                        "
                      >
                      </div>

                    </div>


                    <!-- ASSESSMENTS -->

                    <div class="student-list-skeleton__badges">

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--badge
                        "
                      >
                      </div>

                      <div
                        class="
                          student-list-skeleton__block
                          student-list-skeleton__block--badge
                        "
                      >
                      </div>

                    </div>


                    <!-- RESOURCE -->

                    <div
                      class="
                        student-list-skeleton__block
                        student-list-skeleton__block--resource
                      "
                    >
                    </div>


                    <!-- OPTIONS -->

                    <div
                      class="
                        student-list-skeleton__block
                        student-list-skeleton__block--menu
                      "
                    >
                    </div>

                  </div>

                }

              </div>

            </div>

          } @else {

            <!-- =========================
                 STUDENT LIST
            ========================== -->
            <app-stage-assessment-student-list
              [students]="pagedList"
              [totalStudents]="total"
              [selectedStudentIds]="selectedStudentIds"
              [resetSelection]="resetSelectionFlag"
              [searchTerm]="searchTerm"
              [limit]="limit"
              [limitOptions]="limitOptions"
              [hasStageSelected]="!!selectedStageId"
              (searchTermChange)="onSearchTermChange($event)"
              (limitChange)="onLimitChange($event)"
              (selectionChange)="onStudentSelection($event)"
              (selectAllRequested)="selectAllStudents()"
              (clearSelectionRequested)="clearStudentSelection()"
              (assignRequested)="openCreateAssessmentPanel()"
              (activeAssessmentDetailRequested)="
                onActiveAssessmentDetailRequested($event)
              "
            >
            </app-stage-assessment-student-list>

          }


          <!-- =========================
               PAGINATION
          ========================== -->
          @if (
            selectedStageId &&
            total > 0 &&
            !isLoadingStudents
          ) {

            <app-stage-assessment-pagination
              [page]="page"
              [totalPages]="totalPages"
              [startIndex]="startIndex"
              [endIndex]="endIndex"
              [total]="total"
              [canPrev]="canPrev"
              [canNext]="canNext"
              [paginationLabel]="paginationLabel"
              (pageChange)="onPageChange($event)"
              (previousRequested)="onPrev()"
              (nextRequested)="onNext()"
            >
            </app-stage-assessment-pagination>

          }

        </section>

      </main>


      <!-- =========================
           CREATE ASSESSMENT PANEL
      ========================== -->
      @if (isCreatePanelOpen) {

        <aside class="stage-assessment-page__create-panel">

          <app-stage-assessment-create-panel
            [stageId]="selectedStageId"
            [stage]="selectedStage"
            [studentIds]="selectedStudentIds"
            [resources]="resourcesList"
            (closeRequested)="closeCreateAssessmentPanel()"
            (cancelRequested)="closeCreateAssessmentPanel()"
            (createRequested)="onCreateAssessment($event)"
          >
          </app-stage-assessment-create-panel>

        </aside>

      }

    </div>

  </div>


  <!-- =========================
       ACTIVE ASSESSMENT MODAL
  ========================== -->
  @if (
    isAssessmentDetailModalOpen &&
    selectedAssessmentStudent
  ) {

    <app-stage-assessment-active-detail-modal
      [student]="selectedAssessmentStudent"
      [assessments]="
        selectedAssessmentStudent.activeAssessments || []
      "
      (closeRequested)="closeAssessmentDetailModal()"
    >
    </app-stage-assessment-active-detail-modal>

  }


  <!-- =========================
       NOTIFICATION /
       RECALCULATE CONFIRMATION
  ========================== -->
  <app-modal
    [showModal]="modal.show"
    [message]="modal.message"
    [isError]="modal.isError"
    [isSuccess]="modal.isSuccess"
    [isInfo]="modal.isInfo"
    [showButtons]="modal.showButtons ?? false"
    (confirmAction)="modal.confirm?.()"
    (close)="modal.close()"
  >
  </app-modal>

</section>
