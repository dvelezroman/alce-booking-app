<section class="reports-excel-page">
  <div class="reports-excel-page__container">

    <!-- HEADER -->
    <div class="reports-excel-page__header">
      <app-report-excel-header></app-report-excel-header>
    </div>

    <!-- CONTENT -->
    <div class="reports-excel-page__layout">

      <!-- LEFT SIDEBAR -->
      <aside class="reports-excel-page__sidebar">

        <div class="reports-excel-page__sidebar-types">
          <app-report-excel-type-selector
            [currentMode]="currentMode"
            (modeSelected)="onReportTypeSelected($event)">
          </app-report-excel-type-selector>
        </div>

        <div class="reports-excel-page__sidebar-info">
          <app-report-excel-info></app-report-excel-info>
        </div>

      </aside>

      <!-- MAIN -->
      <main class="reports-excel-page__main">

        <!-- SELECTED REPORT -->
        <div class="reports-excel-page__selected">
          <app-report-excel-selected-report
            [currentMode]="currentMode">
          </app-report-excel-selected-report>
        </div>

        <!-- FILTERS -->
        <div class="reports-excel-page__filters">
          <app-report-excel-filters
            [currentMode]="currentMode"
            [stages]="stages"
            [loading]="loading"
            (usersRequested)="handleUsersFilters($event)"
            (absentsRequested)="handleAbsentFilters($event)"
            (withoutMeetingsRequested)="handleWithoutMeetingsFilters($event)">
          </app-report-excel-filters>
        </div>

        <!-- SUMMARY -->
        <div class="reports-excel-page__summary">
          <app-report-excel-summary
            [currentMode]="currentMode">
          </app-report-excel-summary>
        </div>

      </main>

    </div>

  </div>
</section>
