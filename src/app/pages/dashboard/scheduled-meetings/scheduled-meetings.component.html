<main class="scheduled-meetings-page">

  <!-- HEADER A TODO EL ANCHO -->
  <app-scheduled-meetings-header
    [userData]="userData"
  ></app-scheduled-meetings-header>

  <!-- CONTENIDO DIVIDIDO -->
  <div class="scheduled-meetings-layout">

    <!-- COLUMNA PRINCIPAL -->
    <div class="scheduled-meetings-content">

      <app-scheduled-meetings-summary
        [meetings]="meetings"
      ></app-scheduled-meetings-summary>

      <app-scheduled-meetings-filters
        [searchTerm]="searchTerm"
        [selectedDateFilter]="selectedDateFilter"
        [selectedStatusFilter]="selectedStatusFilter"
        (searchTermChange)="onSearchTermChange($event)"
        (selectedDateFilterChange)="onDateFilterChange($event)"
        (selectedStatusFilterChange)="onStatusFilterChange($event)"
        (refreshMeetings)="onRefreshMeetings()"
      ></app-scheduled-meetings-filters>

      <app-scheduled-meetings-list
        [meetings]="paginatedMeetings"
        [isLoading]="isLoadingMeetings"
        [studentCity]="userData?.city"
        (viewDetails)="onViewMeetingDetails($event)"
        (openOptions)="onOpenMeetingOptions($event)"
        (deleteMeeting)="openDeleteModal($event)"
      ></app-scheduled-meetings-list>

      <app-scheduled-meetings-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        [totalItems]="filteredMeetings.length"
        [itemsPerPage]="itemsPerPage"
        (pageChange)="onPageChange($event)"
      ></app-scheduled-meetings-pagination>

    </div>

    <!-- COLUMNA DERECHA -->
    <aside class="scheduled-meetings-aside">

      <app-student-important-notices
        [userData]="userData"
        [isKidsRestrictionActive]="isKidsRestrictionActive"
        [minHoursRequired]="minHoursRequired"
        [shouldShowAssessmentBanner]="shouldShowAssessmentBanner"
        (viewAll)="goToNotifications()"
      ></app-student-important-notices>

    </aside>

  </div>

  <app-meeting-detail-modal
    [selectedMeeting]="selectedMeeting"
    [studentCity]="userData?.city"
    [isActive]="isMeetingDetailModalActive"
    (modalClose)="onCloseMeetingDetailModal()"
  ></app-meeting-detail-modal>

</main>

<app-modal
  [showModal]="modalConfig.show"
  [message]="modalConfig.message"
  [isError]="modalConfig.isError"
  [isSuccess]="modalConfig.isSuccess"
  [isInfo]="modalConfig.isInfo"
  [showButtons]="modalConfig.confirm !== undefined"
  (confirmAction)="
    modalConfig.confirm &&
    modalConfig.confirm()
  "
  (close)="modalConfig.close()"
>
</app-modal>
