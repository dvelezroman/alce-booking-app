<section class="lead-scheduling-page">

  <div class="lead-scheduling-page__container">

    <!-- =========================
         HEADER
    ========================== -->
    <app-admin-lead-scheduling-header
      [total]="total"
      [items]="items"
      [loading]="loading"
    >
    </app-admin-lead-scheduling-header>


    <!-- =========================
         FILTERS
    ========================== -->
    
    <app-admin-lead-scheduling-filters
      [filterKind]="filterKind"
      [filterStatus]="filterStatus"
      [loading]="loading"
      (kindChange)="onKindChange($event)"
      (statusChange)="onStatusChange($event)"
      (clearRequested)="clearFilters()"
      (refreshRequested)="refresh()"
    >
    </app-admin-lead-scheduling-filters>
   


    <!-- =========================
         ERROR
    ========================== -->
    @if (error) {
      <div
        class="lead-scheduling-page__error"
        role="alert"
      >

        <div class="lead-scheduling-page__error-icon">

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M12 8v5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="16.5"
              r="1"
              fill="currentColor"
            />
          </svg>

        </div>

        <span>
          {{ error }}
        </span>

      </div>
    }


    <!-- =========================
         RESULTS
    ========================== -->
    <div class="lead-scheduling-page__results">

      <!-- TABLE -->
      
      <app-admin-lead-scheduling-table
        [items]="items"
        [loading]="loading"
      >
      </app-admin-lead-scheduling-table>
     


      <!-- PAGINATION -->
      @if (!loading && total > 0) {

        
        <app-admin-lead-scheduling-pagination
          [currentPage]="currentPage"
          [totalPages]="totalPages"
          [totalItems]="total"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [rangeLabel]="rangeLabel"
          [canPrevPage]="canPrevPage"
          [canNextPage]="canNextPage"
          (pageChange)="changePage($event)"
          (pageSizeChange)="changePageSize($event)"
          (previousRequested)="prevPage()"
          (nextRequested)="nextPage()"
        >
        </app-admin-lead-scheduling-pagination>
       

      }

    </div>

  </div>

</section>
