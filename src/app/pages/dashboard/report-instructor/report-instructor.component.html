<section class="report-instructor-page">

  <div class="report-instructor-page__container">

    <!-- HEADER -->
    <app-report-instructor-header
      (exportRequested)="downloadInstructorHoursCsv()"
      (summaryRequested)="handleViewSummary()">
    </app-report-instructor-header>


    <!-- BODY -->
    <div class="report-instructor-page__layout">

      <!-- =========================
           LEFT
      ========================== -->

      <aside class="report-instructor-page__sidebar">

        <app-report-instructor-filters
          [filter]="filter"
          [filteredInstructors]="filteredInstructors"
          [showDropdown]="showDropdown"
          [isNameFieldInvalid]="isNameFieldInvalid"
          [showFromError]="showFromError"
          [showToError]="showToError"
          [isMainView]="activeView === 'main'"
          (instructorInputChange)="onInstructorInputChange()"
          (instructorSelected)="selectInstructor($event)"
          (dropdownHidden)="hideDropdown()"
          (searchRequested)="handleSearchRequested()">
        </app-report-instructor-filters>

      </aside>


      <!-- =========================
           RIGHT CONTENT
      ========================== -->

      <main class="report-instructor-page__main">

        <!-- VIEW SELECTOR -->
        <app-report-instructor-view-selector
          [activeView]="activeView"
          (mainRequested)="handleViewMeetings()"
          (summaryRequested)="handleViewSummary()"
          (summaryByDayRequested)="handleViewSummaryByDay()">
        </app-report-instructor-view-selector>


        <!-- =========================
             MAIN VIEW
        ========================== -->

        <ng-container *ngIf="activeView === 'main'">

          <div class="report-instructor-page__main-grid">

            <!-- CENTER -->
            <div class="report-instructor-page__content">

              <!-- CLASS DETAIL -->
              <app-report-instructor-class-detail
                [date]="currentDate"
                [instructors]="currentInstructors"
                [searchAttempted]="searchAttempted"
                [hasPreviousDate]="currentDateIndex > 0"
                [hasNextDate]="currentDateIndex < availableDates.length - 1"
                (previousDateRequested)="prevDate()"
                (nextDateRequested)="nextDate()"
                (instructorSelected)="selectInstructorDetail($event)">
              </app-report-instructor-class-detail>


              <!-- HOUR DETAIL -->
              <app-report-instructor-hour-detail
                *ngIf="selectedInstructorDetail"
                [instructor]="selectedInstructorDetail"
                (contentRequested)="showContent($event)">
              </app-report-instructor-hour-detail>

            </div>


            <!-- RIGHT -->
            <aside class="report-instructor-page__right">

              <app-report-instructor-detail
                [instructor]="selectedInstructorDetail"
                [selectedDate]="currentDate"
                (summaryRequested)="handleInstructorDetailSummary($event)"
                (closeRequested)="clearInstructorDetail()">
              </app-report-instructor-detail>


              <app-report-instructor-quick-actions
                (summaryRequested)="handleViewSummary()"
                (summaryByDayRequested)="handleViewSummaryByDay()"
                (exportRequested)="downloadInstructorHoursCsv()">
              </app-report-instructor-quick-actions>

            </aside>

          </div>

        </ng-container>


        <!-- =========================
             DAILY SUMMARY
        ========================== -->

        <app-report-instructor-daily-summary
          *ngIf="activeView === 'summary'"
          [summary]="attendanceSummary"
          [instructorName]="filter.instructorName"
          [from]="filter.from"
          [to]="filter.to">
        </app-report-instructor-daily-summary>


        <!-- =========================
             SUMMARY BY DAY
        ========================== -->

        <app-report-instructor-day-summary
          *ngIf="activeView === 'summaryByDay'"
          [summary]="attendanceSummary"
          [instructorName]="filter.instructorName"
          [from]="filter.from"
          [to]="filter.to">
        </app-report-instructor-day-summary>

      </main>

    </div>

  </div>


  <!-- MODAL EXISTENTE -->
  <app-modal
    [showModal]="modal.show"
    [message]="modal.message"
    [isError]="modal.isError"
    [isSuccess]="modal.isSuccess"
    [isInfo]="modal.isInfo"
    [isContentViewer]="!!modal.isContentViewer"
    [title]="modal.title || ''"
    (close)="modal.close()"
  ></app-modal>

</section>
