<section
  class="notifications-page"
  aria-labelledby="notifications-page-title"
>
  <app-inbox-header
    id="notifications-page-title"
    [unreadCount]="unreadNotificationsCount"
  />

  <!-- ACCIONES MOBILE -->
  <div class="notifications-page__mobile-actions">
    <button
      type="button"
      class="notifications-page__filter-button"
      [class.notifications-page__filter-button--active]="
        showMobileFilters
      "
      [attr.aria-expanded]="showMobileFilters"
      aria-controls="notifications-filters"
      (click)="toggleMobileFilters()"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M4 5h16"></path>
        <path d="M7 12h10"></path>
        <path d="M10 19h4"></path>
      </svg>

      <span>
        {{
          showMobileFilters
            ? 'Ocultar filtros'
            : 'Filtrar'
        }}
      </span>

      <svg
        class="notifications-page__filter-chevron"
        [class.notifications-page__filter-chevron--open]="
          showMobileFilters
        "
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="m6 9 6 6 6-6"></path>
      </svg>
    </button>
  </div>

  <!-- FILTROS -->
  <div
    id="notifications-filters"
    class="notifications-page__filters"
    [class.notifications-page__filters--open]="
      showMobileFilters
    "
  >
    <app-inbox-filters
      [filters]="filters"
      [readDays]="readDays"
      [disabled]="loading"
      (filtersChange)="onFiltersChange($event)"
      (readDaysChange)="onReadDaysChange($event)"
      (clearFilters)="onClearFilters()"
    />
  </div>

  <!-- CONTENIDO -->
  <div class="notifications-page__content">

    <!-- COLUMNA IZQUIERDA -->
    <main class="notifications-page__main">

      <!--
      <app-inbox-loading
        *ngIf="loading"
      />
      -->

      <app-inbox-error
        *ngIf="!loading && errorMsg"
        [message]="errorMsg"
        (retry)="onRetry()"
      />

      <app-inbox-empty
        *ngIf="showEmptyState"
        title="Tu bandeja está vacía"
        description="Cuando recibas avisos, recordatorios o actualizaciones, aparecerán aquí."
        illustration="empty-inbox"
      />

      <app-inbox-empty
        *ngIf="showNoResultsState"
        title="No encontramos notificaciones"
        description="Prueba cambiando o limpiando los filtros aplicados."
        illustration="no-results"
        actionLabel="Limpiar filtros"
        (action)="onClearFilters()"
      />

      <div
        *ngIf="loading"
        class="notifications-page__list-skeleton"
      >

        <!-- HEADER -->
        <div class="notifications-page__list-skeleton-header">
          <span class="notifications-page__list-skeleton-head notifications-page__list-skeleton-head--title"></span>
          <span class="notifications-page__list-skeleton-head"></span>
          <span class="notifications-page__list-skeleton-head"></span>
          <span class="notifications-page__list-skeleton-head"></span>
          <span class="notifications-page__list-skeleton-head"></span>
          <span class="notifications-page__list-skeleton-head notifications-page__list-skeleton-head--action"></span>
        </div>

        <!-- ROWS -->
        <div
          *ngFor="let item of [1, 2, 3, 4, 5, 6]"
          class="notifications-page__list-skeleton-row"
        >

          <div class="notifications-page__list-skeleton-notification">
            <span class="notifications-page__list-skeleton-circle"></span>

            <div class="notifications-page__list-skeleton-texts">
              <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--title"></span>
              <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--description"></span>
            </div>
          </div>

          <span class="notifications-page__list-skeleton-badge"></span>

          <div class="notifications-page__list-skeleton-sender">
            <span class="notifications-page__list-skeleton-avatar"></span>

            <div class="notifications-page__list-skeleton-texts">
              <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--name"></span>
              <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--email"></span>
            </div>
          </div>

          <div class="notifications-page__list-skeleton-texts">
            <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--date"></span>
            <span class="notifications-page__list-skeleton-line notifications-page__list-skeleton-line--time"></span>
          </div>

          <span class="notifications-page__list-skeleton-badge"></span>

          <span class="notifications-page__list-skeleton-action"></span>

        </div>

      </div>

      <!-- LISTA CON PAGINACIÓN INTERNA -->
      <app-notification-list
        *ngIf="
          !loading &&
          !errorMsg &&
          hasFilteredNotifications
        "
        [notifications]="filteredNotifications"
        (notificationSelected)="onRowClick($event)"
      >
        <app-inbox-pagination
          notification-list-pagination
          [currentPage]="page"
          [totalPages]="totalPages"
          [total]="total"
          [limit]="limit"
          [startIndex]="startIndex"
          [endIndex]="endIndex"
          [hasPreviousPage]="hasPreviousPage"
          [hasNextPage]="hasNextPage"
          (previousPage)="onPrev()"
          (nextPage)="onNext()"
          (pageChange)="onPageChange($event)"
          (limitChange)="onLimitChange($event)"
        />
      </app-notification-list>

    </main>

    <!-- COLUMNA DERECHA -->
    <aside
      class="notifications-page__aside"
      aria-label="Resumen de notificaciones"
    >
      <app-inbox-summary
        [total]="total"
        [unreadCount]="unreadNotificationsCount"
        [readCount]="readNotificationsCount"
        [todayCount]="todayNotificationsCount"
        [weekCount]="weekNotificationsCount"
      />

      <app-notification-types-summary
        [items]="notificationTypeSummary"
      />
    </aside>

  </div>
</section>
