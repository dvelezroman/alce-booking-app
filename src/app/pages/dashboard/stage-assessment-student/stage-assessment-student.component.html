<section class="assessment-page">
  <div class="assessment-page__container">

    <app-assessment-header />

    <app-assessment-summary
      [activeCount]="activeCount"
      [expiredCount]="expiredCount"
      [completedCount]="completedCount"
    />

    <div
      *ngIf="loading"
      class="assessment-page__loading"
      aria-live="polite"
    >
      <span class="assessment-page__spinner"></span>

      <p class="assessment-page__loading-text">
        Cargando evaluaciones...
      </p>
    </div>

    <ng-container *ngIf="!loading">

      <div class="assessment-page__sections">

        <app-assessment-section
          *ngIf="hasPending"
          sectionType="active"
          title="Evaluaciones activas"
          description="Tienes evaluaciones pendientes por completar."
          [count]="activeCount"
          [assessments]="pendingAssessments"
          [highlightId]="highlightId"
          (openAssessment)="onOpenAssessment($event)"
          (clearHighlight)="clearHighlight()"
        />

        <app-assessment-section
          *ngIf="hasExpired"
          sectionType="expired"
          title="Evaluaciones vencidas"
          description="Estas evaluaciones superaron la fecha límite."
          [count]="expiredCount"
          [assessments]="expiredAssessments"
          [highlightId]="highlightId"
          (clearHighlight)="clearHighlight()"
        />

        <app-assessment-section
          *ngIf="hasCompleted"
          sectionType="completed"
          title="Evaluaciones completadas"
          description="Has completado estas evaluaciones."
          [count]="completedCount"
          [assessments]="completedAssessments"
          [highlightId]="highlightId"
          (viewAssessment)="onViewAssessmentDetail($event)"
          (clearHighlight)="clearHighlight()"
        />

      </div>

      <div
        *ngIf="
          !hasPending &&
          !hasExpired &&
          !hasCompleted
        "
        class="assessment-page__empty"
      >
        <div class="assessment-page__empty-icon">
          <i class="fa-solid fa-clipboard-check"></i>
        </div>

        <div class="assessment-page__empty-content">
          <h2 class="assessment-page__empty-title">
            No tienes evaluaciones
          </h2>

          <p class="assessment-page__empty-description">
            Cuando te asignen una evaluación, podrás consultarla desde
            esta sección.
          </p>
        </div>
      </div>

    </ng-container>

    <app-assessment-support
      (contactSupport)="onContactSupport()"
    />

  </div>
</section>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  (close)="modal.show = false">
</app-modal>
