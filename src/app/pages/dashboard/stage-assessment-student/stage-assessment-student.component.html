<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  (close)="modal.show = false">
</app-modal>

<h2 class="title stage">Mis evaluaciones</h2>

<div class="page-wrapper">
  <section class="stage-assessment-student-section">

    <!-- ESTADO VACÍO -->
    <div class="empty-state" *ngIf="!hasActiveAssessments">
      <img src="assets/carpeta_vacia.png" alt="Sin evaluaciones" class="empty-img" />
      <p>No tienes evaluaciones asignadas.</p>
    </div>

    <!-- TEXTO DE CUANTAS PENDIENTES -->
    <p *ngIf="hasActiveAssessments" class="pending-count">
      Tienes <strong>{{ assessments.length }}</strong> evaluaciones pendientes.
    </p>

    <!-- LISTA DE CARDS -->
    <div *ngIf="hasActiveAssessments" class="cards-wrapper">
      <app-stage-assessment-card
        *ngFor="let a of assessments"
        [assessment]="a"
        (openAndFinish)="onOpenAndFinish($event)">
      </app-stage-assessment-card>
    </div>

  </section>
</div>
