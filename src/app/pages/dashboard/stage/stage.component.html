<section class="stages-page">

  <div class="stages-page__container">

    <!-- =========================
         HEADER
    ========================== -->

    <app-stages-header
      (createRequested)="openCreateModal()"
    >
    </app-stages-header>


    <!-- =========================
         SUMMARY
    ========================== -->

    <app-stages-summary
      [total]="stages.length"
    >
    </app-stages-summary>


    <!-- =========================
         CONTENT
    ========================== -->

    <section class="stages-page__content">

      <!-- FILTERS -->

      <app-stages-filters
        [searchTerm]="searchTerm"
        [limit]="limit"
        [limitOptions]="limitOptions"
        (searchChange)="onSearchChange($event)"
        (clearRequested)="clearSearch()"
        (limitChange)="onLimitChange($event)"
      >
      </app-stages-filters>


      <!-- TABLE -->

      <div class="stages-page__table">

        <app-stages-table
          [stages]="pagedStages"
          [startIndex]="startIndex"
          (editRequested)="openEditModal($event)"
          (deleteRequested)="openDeleteModal($event)"
        >
        </app-stages-table>

      </div>


      <!-- PAGINATION -->

      <app-stages-pagination
        [page]="page"
        [totalPages]="totalPages"
        [total]="total"
        [limit]="limit"
        [canPrev]="canPrev"
        [canNext]="canNext"
        [paginationLabel]="paginationLabel"
        (pageChange)="onPageChange($event)"
        (previousRequested)="onPrev()"
        (nextRequested)="onNext()"
      >
      </app-stages-pagination>

    </section>


    <!-- =========================
         INFO
    ========================== -->

    <aside class="stages-page__tip">

      <div class="stages-page__tip-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M12 10.5V16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="7.5"
            r="1"
            fill="currentColor"
          />
        </svg>

      </div>

      <div class="stages-page__tip-content">

        <strong>
          Consejo
        </strong>

        <p>
          Los stages son las etapas académicas que siguen
          los estudiantes para completar su formación.
        </p>

      </div>

    </aside>

  </div>


  <!-- =========================
       CREATE MODAL
  ========================== -->

  @if (isCreateModalOpen) {

    <!-- <app-stages-form-modal
      mode="create"
      [stage]="newStage"
      (saveRequested)="confirmCreateStage()"
      (closeRequested)="closeCreateModal()"
    >
    </app-stages-form-modal> -->

  }


  <!-- =========================
       EDIT MODAL
  ========================== -->

  @if (
    isEditModalOpen &&
    selectedStage
  ) {

    <!-- <app-stages-form-modal
      mode="edit"
      [stage]="selectedStage"
      (saveRequested)="confirmUpdateStage()"
      (closeRequested)="closeEditModal()"
    >
    </app-stages-form-modal> -->

  }


  <!-- =========================
       GLOBAL MODAL
  ========================== -->

  <app-modal
    [showModal]="modal.show"
    [message]="modal.message"
    [isError]="modal.isError"
    [isSuccess]="modal.isSuccess"
    [isInfo]="modal.isInfo"
    [showButtons]="modal.showButtons ?? false"
    (confirmAction)="modal.confirm?.()"
    (close)="modal.close()"
  >
  </app-modal>

</section>
