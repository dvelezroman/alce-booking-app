<div class="student-history-page">
  <main class="student-history-page__container">

    <app-student-history-header />

    <section class="student-history-page__layout">

      <div class="student-history-page__main">

        <section class="student-history-page__block">
          <div class="student-history-page__step-header">
            <span class="student-history-page__step-number">
              1
            </span>

            <div>
              <h2>Seleccionar estudiante</h2>
              <p>
                Busca y selecciona el estudiante para generar su historial completo.
              </p>
            </div>
          </div>

          <app-student-history-student-selector
            [searchTerm]="searchTerm"
            [filteredUsers]="filteredUsers"
            [showDropdown]="showDropdown"
            (searchChange)="onSearchChange($event)"
            (studentSelected)="selectUser($event)"
            (dropdownHidden)="hideDropdown()"
          />

          @if (selectedStudent) {
            <app-student-history-selected-student
              [student]="selectedStudent"
            />
          }
        </section>

        <section class="student-history-page__block">
          <div class="student-history-page__step-header">
            <span class="student-history-page__step-number">
              2
            </span>

            <div>
              <h2>Generar reporte</h2>
              <p>
                Haz clic en el botón para iniciar la generación del historial del estudiante.
              </p>
            </div>
          </div>

          <app-student-history-generate-report
            [student]="selectedStudent"
            [loading]="loading"
            (generateRequested)="generateReport()"
          />
        </section>

        <section class="student-history-page__block">
          <div class="student-history-page__step-header">
            <span class="student-history-page__step-number">
              3
            </span>

            <div>
              <h2>Estado del reporte</h2>
            </div>
          </div>

          <app-student-history-report-status
            [jobId]="jobId"
            [status]="status"
            [loading]="loading"
            [progress]="progress"
            [reportReady]="reportReady"
            [error]="error"
            [serverError]="serverError"
            (downloadRequested)="downloadReport()"
          />
        </section>

      </div>

      <aside class="student-history-page__sidebar">

        <app-student-history-quick-guide />

        <app-student-history-recent-reports />

        <app-student-history-important-info />

      </aside>

    </section>

  </main>
</div>
