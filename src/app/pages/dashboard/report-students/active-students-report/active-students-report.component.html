<div class="active-students-page">

  <main class="active-students-page__container">

    <!-- =========================
         HEADER
    ========================== -->

    <app-active-students-header />


    <!-- =========================
         PAGE LAYOUT
    ========================== -->

    <section class="active-students-page__layout">


      <!-- =========================
           MAIN CONTENT
      ========================== -->

      <div class="active-students-page__main">


        <!-- =========================
             FILTERS
        ========================== -->

        <app-active-students-filters
          [stages]="stages"
          [stageId]="stageId"
          [noClasses]="noClasses"
          [loading]="loading"
          (stageIdChange)="stageId = $event"
          (noClassesChange)="noClasses = $event"
          (generateRequested)="generateReport()"
        />


        <!-- =========================
             REPORT STATUS
        ========================== -->

        <app-active-students-status
          [jobId]="jobId"
          [status]="status"
          [rowCount]="rowCount"
          [fileName]="fileName"
          [loading]="loading"
          [downloading]="downloading"
          [reportReady]="reportReady"
          [progress]="progress"
          [error]="error"
          [serverError]="serverError"
          (downloadRequested)="downloadReport()"
        />


        <!-- =========================
             RECENT REPORTS
        ========================== -->

        <app-active-students-recent-reports
          [reports]="pagedRecentReports"
          [page]="page"
          [totalPages]="totalPages"
          [total]="total"
          [startIndex]="startIndex"
          [endIndex]="endIndex"
          [limit]="limit"
          [limitOptions]="limitOptions"
          [canPrev]="canPrev"
          [canNext]="canNext"
          [paginationLabel]="paginationLabel"
          (pageChange)="onPageChange($event)"
          (previousRequested)="onPrev()"
          (nextRequested)="onNext()"
          (limitChange)="onLimitChange($event)"
        />

      </div>


      <!-- =========================
           SIDEBAR
      ========================== -->

      <aside class="active-students-page__sidebar">

        <app-active-students-how-it-works />

        <app-active-students-important-info />

        <app-active-students-status-legend />

      </aside>

    </section>

  </main>

</div>
