<div class="container">

  <!-- HEADER -->
  <h2 class="announcements-title">
    Anuncios
  </h2>

  <!-- CREATE CARD -->
  <div class="settings-card announcements-card">

    <div class="settings-header">
      <h3>Crear anuncio</h3>
      <p>Configura y previsualiza los anuncios</p>
    </div>

    <!-- GRID -->
    <div class="form-grid">

      <!-- MEDIA -->
      <div class="media-section">

        <h4 class="form-title">Anuncio</h4>

        <!-- TOGGLE -->
        <div class="media-type-toggle">

          <button
            type="button"
            class="media-type-btn"
            [class.active]="formMediaType === 'image'"
            (click)="formMediaType = 'image'"
          >
            <i class="fas fa-image"></i>
            Imagen
          </button>

          <button
            type="button"
            class="media-type-btn"
            [class.active]="formMediaType === 'video'"
            (click)="formMediaType = 'video'"
          >
            <i class="fas fa-video"></i>
            Video
          </button>

        </div>

        <!-- COMPONENTE -->
        <app-media-upload
          [media]="formMedia"
          [type]="formMediaType"
          (mediaChange)="formMedia = $event"
        />

      </div>

      <!-- FORM -->
      <app-announcement-form
        [title]="formTitle"
        [type]="formType"
        [role]="formRole"
        [classification]="formClassification"
        [city]="formCity"
        [isActive]="formIsActive"

        (titleChange)="formTitle = $event"
        (typeChange)="formType = $event"
        (roleChange)="formRole = $event"
        (classificationChange)="formClassification = $event"
        (cityChange)="formCity = $event"
        (isActiveChange)="formIsActive = $event"
      />

    </div>

    <!-- ACTIONS + PREVIEW -->
    <div class="actions-preview-card">

      <!-- LEFT -->
      <div class="actions-preview-card__left">

        <h4 class="preview-title">Botones de Acción</h4>

        <app-actions-builder
          [actions]="formActions"
          (add)="addAction($event)"
          (update)="updateAction($event)"
          (remove)="removeAction($event)"
          (error)="showError($event)"
        />

      </div>

      <!-- RIGHT -->
      <div class="actions-preview-card__right">

        <h4 class="preview-title">Vista Previa</h4>

        <div class="preview-wrapper">
          <app-preview-card
            [title]="formTitle || 'Untitled Announcement'"
            [type]="formType || ''"
            [media]="formMedia"
            [role]="formRole"
            [studentClassification]="formClassification"
            [city]="formCity"
            [isActive]="formIsActive"
            [actions]="formActions"
          />
        </div>

      </div>

    </div>

    <!-- BUTTON -->
    <div class="button-row">
      <button class="button is-primary" (click)="submitAnnouncement()">
        Crear Anuncio
      </button>
    </div>

  </div>

  <!-- LIST -->
  <div class="announcements-list-card">

    <div class="announcements-list-header">
      <h3>Lista de Anuncios</h3>
      <p>Anuncios creados recientemente</p>
    </div>

    <app-announcements-list
      [announcements]="announcements"
      [filterTab]="filterTab"
      (filterChange)="filterTab = $event"
      (toggle)="toggleAnnouncement($event)"
      (delete)="deleteAnnouncement($event)"
    />

  </div>

</div>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  [isInfo]="modal.isInfo"
  [title]="modal.title || ''"
  [showButtons]="modal.showButtons || false"
  (close)="modal.close()"
></app-modal>
