<div class="login-wrapper">

  <div class="login-card">

    <div class="login-brand">
      ALCE COLLEGE
    </div>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-subtitle">
      Acceso al sistema académico institucional
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="field">
        <div class="floating">
          <input
            type="text"
            formControlName="email"
            placeholder=" "
            [ngClass]="{ 'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }">
          <label>Usuario o Email</label>
        </div>

        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
          Ingrese un email válido
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <div class="floating">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            formControlName="password"
            placeholder=" "
            [ngClass]="{ 'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }">

          <label>Contraseña</label>

          <div class="toggle-password" (click)="togglePasswordVisibility()">
            <i [ngClass]="passwordVisible ? 'fa fa-eye' : 'fa fa-eye-slash'"></i>
          </div>
        </div>

        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Se requiere contraseña
        </div>

        <div class="forgot-password">
          <a [routerLink]="['/forgot-password']">
            ¿Olvidaste tu contraseña?
          </a>
        </div>
      </div>

      <button class="btn-login">
        Iniciar sesión
      </button>

    </form>

  </div>

</div>

<app-student-suspension-modal
  *ngIf="showSuspensionModal && suspensionInfo"
  [suspensionInfo]="suspensionInfo"
  (close)="closeSuspensionModal()">
</app-student-suspension-modal>

<app-modal
  [showModal]="modal.show"
  [message]="modal.message"
  [isError]="modal.isError"
  [isSuccess]="modal.isSuccess"
  (close)="modal.close()">
</app-modal>
