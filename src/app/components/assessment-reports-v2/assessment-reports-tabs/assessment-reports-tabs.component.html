<nav
  class="assessment-tabs"
  aria-label="Tipos de reportes de evaluaciones"
>

  <button
    type="button"
    class="assessment-tabs__item"
    [class.assessment-tabs__item--active]="
      activeTab === 'instructor'
    "
    (click)="selectTab('instructor')"
  >
    <span class="assessment-tabs__icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="9"
          cy="8"
          r="3"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M3.8 18c.6-3 2.6-4.7 5.2-4.7s4.6 1.7 5.2 4.7"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="M16 7h4M18 5v4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="assessment-tabs__text">
      <strong>
        Evaluaciones de instructores
      </strong>

      <small>
        Evaluaciones registradas manualmente
      </small>
    </span>
  </button>


  <button
    type="button"
    class="assessment-tabs__item"
    [class.assessment-tabs__item--active]="
      activeTab === 'platform'
    "
    (click)="selectTab('platform')"
  >
    <span class="assessment-tabs__icon">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <rect
          x="4"
          y="5"
          width="16"
          height="14"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M8 9h8M8 13h5M8 16h7"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="assessment-tabs__text">
      <strong>
        Evaluaciones de plataforma
      </strong>

      <small>
        Resultados sincronizados por S2S
      </small>
    </span>
  </button>

</nav>
