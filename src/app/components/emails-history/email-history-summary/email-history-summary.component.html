<section class="history-summary">

  <div class="history-summary__item">

    <span
      class="history-summary__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2.5"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="m4 7 8 6 8-6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div class="history-summary__content">
      <span>
        Total de emails
      </span>

      <strong>
        {{ total }}
      </strong>
    </div>

  </div>


  <span
    class="history-summary__divider"
    aria-hidden="true"
  >
  </span>


  <div class="history-summary__range">

    <span>
      Mostrando
    </span>

    <strong>
      {{ startIndex }} - {{ endIndex }}
      de {{ total }}
    </strong>

  </div>

</section>
