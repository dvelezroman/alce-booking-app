<section class="lead-scheduling-filters">

  <div class="lead-scheduling-filters__fields">

    <div class="lead-scheduling-filters__field">
      <label
        for="filterKind"
        class="lead-scheduling-filters__label"
      >
        Tipo de solicitud
      </label>

      <div class="lead-scheduling-filters__select-wrapper">
        <select
          id="filterKind"
          class="lead-scheduling-filters__select"
          [ngModel]="filterKind"
          [disabled]="loading"
          (ngModelChange)="onKindChange($event)"
        >
          <option value="">
            Todos
          </option>

          @for (option of kindOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="lead-scheduling-filters__field">
      <label
        for="filterStatus"
        class="lead-scheduling-filters__label"
      >
        Estado
      </label>

      <div class="lead-scheduling-filters__select-wrapper">
        <select
          id="filterStatus"
          class="lead-scheduling-filters__select"
          [ngModel]="filterStatus"
          [disabled]="loading"
          (ngModelChange)="onStatusChange($event)"
        >
          <option value="">
            Todos
          </option>

          @for (option of statusOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="lead-scheduling-filters__field">
      <label
        for="filterSortBy"
        class="lead-scheduling-filters__label"
      >
        Ordenar por
      </label>

      <div class="lead-scheduling-filters__select-wrapper">
        <select
          id="filterSortBy"
          class="lead-scheduling-filters__select"
          [ngModel]="sortBy"
          [disabled]="loading"
          (ngModelChange)="onSortByChange($event)"
        >
          @for (option of sortByOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="lead-scheduling-filters__field">
      <label
        for="filterDateField"
        class="lead-scheduling-filters__label"
      >
        Rango aplica a
      </label>

      <div class="lead-scheduling-filters__select-wrapper">
        <select
          id="filterDateField"
          class="lead-scheduling-filters__select"
          [ngModel]="dateField"
          [disabled]="loading"
          (ngModelChange)="onDateFieldChange($event)"
        >
          @for (option of dateFieldOptions; track option.value) {
            <option [value]="option.value">
              {{ option.label }}
            </option>
          }
        </select>
      </div>
    </div>

    <div class="lead-scheduling-filters__field">
      <label
        for="filterDateFrom"
        class="lead-scheduling-filters__label"
      >
        Desde
      </label>

      <input
        id="filterDateFrom"
        type="date"
        class="lead-scheduling-filters__date"
        [ngModel]="dateFrom"
        [disabled]="loading"
        (ngModelChange)="onDateFromChange($event)"
      />
    </div>

    <div class="lead-scheduling-filters__field">
      <label
        for="filterDateTo"
        class="lead-scheduling-filters__label"
      >
        Hasta
      </label>

      <input
        id="filterDateTo"
        type="date"
        class="lead-scheduling-filters__date"
        [ngModel]="dateTo"
        [disabled]="loading"
        (ngModelChange)="onDateToChange($event)"
      />
    </div>

  </div>

  <div class="lead-scheduling-filters__actions">

    <button
      type="button"
      class="
        lead-scheduling-filters__button
        lead-scheduling-filters__button--secondary
      "
      [disabled]="loading"
      (click)="onClear()"
    >
      <span>
        Limpiar filtros
      </span>
    </button>

    <button
      type="button"
      class="
        lead-scheduling-filters__button
        lead-scheduling-filters__button--primary
      "
      [disabled]="loading"
      (click)="onRefresh()"
    >
      <span>
        {{ loading ? 'Actualizando...' : 'Actualizar' }}
      </span>
    </button>

  </div>

</section>
