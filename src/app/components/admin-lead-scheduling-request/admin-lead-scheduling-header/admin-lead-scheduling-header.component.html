<header class="lead-scheduling-header">

  <div class="lead-scheduling-header__main">

    <!-- =========================
         TEXT
    ========================== -->
    <div class="lead-scheduling-header__text">

      <h1 class="lead-scheduling-header__title">
        Solicitudes de horario
      </h1>

      <p class="lead-scheduling-header__description">
        Administra las solicitudes de clases demo y exámenes de ubicación.
      </p>

    </div>

  </div>


  <!-- =========================
       PENDING SUMMARY
  ========================== -->
  <aside class="lead-scheduling-header__summary">

    <div class="lead-scheduling-header__summary-icon">

      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 11v5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="8"
          r=".9"
          fill="currentColor"
        />
      </svg>

    </div>


    <div class="lead-scheduling-header__summary-content">

      <span class="lead-scheduling-header__summary-label">
        Solicitudes pendientes
      </span>

      @if (loading) {

        <span class="lead-scheduling-header__summary-value lead-scheduling-header__summary-value--loading">
          —
        </span>

      } @else {

        <strong class="lead-scheduling-header__summary-value">
          {{ pendingCount }}
        </strong>

      }

      <span class="lead-scheduling-header__summary-meta">
        {{ totalLabel }}
      </span>

    </div>

  </aside>

</header>
