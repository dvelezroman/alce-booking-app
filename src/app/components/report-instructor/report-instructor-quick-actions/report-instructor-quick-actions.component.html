<section class="report-instructor-actions">

  <header class="report-instructor-actions__header">

    <div class="report-instructor-actions__heading">

      <span
        class="report-instructor-actions__heading-icon"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M12 3v18M3 12h18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <div>

        <h2>
          Acciones rápidas
        </h2>

        <p>
          Consulta otras vistas o exporta la información.
        </p>

      </div>

    </div>

  </header>


  <div class="report-instructor-actions__list">

    <!-- DAILY SUMMARY -->
    <button
      type="button"
      class="report-instructor-actions__item"
      (click)="onSummary()">

      <span
        class="
          report-instructor-actions__icon
          report-instructor-actions__icon--summary
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M4 19V9M10 19V5M16 19v-7M22 19V3"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-instructor-actions__content">

        <strong>
          Resumen diario
        </strong>

        <small>
          Consulta el total de clases por día.
        </small>

      </span>

      <span
        class="report-instructor-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- SUMMARY BY DAY -->
    <button
      type="button"
      class="report-instructor-actions__item"
      (click)="onSummaryByDay()">

      <span
        class="
          report-instructor-actions__icon
          report-instructor-actions__icon--day
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <rect
            x="4"
            y="5"
            width="16"
            height="15"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"/>

          <path
            d="M8 3v4M16 3v4M4 9h16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-instructor-actions__content">

        <strong>
          Resumen por día
        </strong>

        <small>
          Revisa las horas registradas por fecha.
        </small>

      </span>

      <span
        class="report-instructor-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- EXPORT -->
    <button
      type="button"
      class="report-instructor-actions__item"
      (click)="onExport()">

      <span
        class="
          report-instructor-actions__icon
          report-instructor-actions__icon--export
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

      <span class="report-instructor-actions__content">

        <strong>
          Exportar CSV
        </strong>

        <small>
          Descarga el reporte del rango seleccionado.
        </small>

      </span>

      <span
        class="report-instructor-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>

  </div>

</section>
