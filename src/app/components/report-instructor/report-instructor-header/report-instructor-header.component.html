<header class="report-instructor-header">

  <div class="report-instructor-header__main">

    <div
      class="report-instructor-header__icon"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none">

        <circle
          cx="12"
          cy="7"
          r="4"
          stroke="currentColor"
          stroke-width="1.7"/>

        <path
          d="M4 21v-2a8 8 0 0 1 16 0v2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"/>

      </svg>

    </div>

    <div class="report-instructor-header__content">

      <h1>
        Reportes del instructor
      </h1>

      <p>
        Consulta y analiza la asistencia y actividades por instructor.
      </p>

    </div>

  </div>


  <div class="report-instructor-header__actions">

    <button
      type="button"
      class="
        report-instructor-header__button
        report-instructor-header__button--secondary
      "
      (click)="onExport()">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true">

        <path
          d="M12 3v12M7.5 10.5 12 15l4.5-4.5M5 20h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

      </svg>

      <span>
        Exportar CSV
      </span>

    </button>


    <button
      type="button"
      class="
        report-instructor-header__button
        report-instructor-header__button--primary
      "
      (click)="onSummary()">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true">

        <path
          d="M4 19V9M10 19V5M16 19v-7M22 19V3"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"/>

      </svg>

      <span>
        Resumen diario
      </span>

    </button>

  </div>

</header>
