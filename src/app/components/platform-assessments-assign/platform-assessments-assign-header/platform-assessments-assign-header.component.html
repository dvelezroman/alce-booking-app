<header class="assign-header">

  <!-- =========================
       TOP
  ========================== -->

  <div class="assign-header__top">

    <!-- INFORMATION -->
    <div class="assign-header__information">

      <span
        class="assign-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <rect
            x="5"
            y="4"
            width="14"
            height="17"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9 4V3h6v1"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M9 9h6M9 13h6M9 17h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>


      <div class="assign-header__content">

        <h1 class="assign-header__title">
          Asignar examen plataforma
        </h1>

        <p class="assign-header__description">
          Asigna un template de Assessments a estudiantes ALCE.
          Ellos reciben notificación con enlace; no se muestran
          códigos de acceso aquí.
        </p>

      </div>

    </div>


    <!-- HELP -->
    <button
      type="button"
      class="assign-header__help"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M9.8 9.4a2.4 2.4 0 0 1 4.6.9c0 1.7-2.4 2-2.4 3.6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="16.8"
          r=".8"
          fill="currentColor"
        />
      </svg>

      <span>
        Ayuda
      </span>
    </button>

  </div>


  <!-- =========================
       BACK
  ========================== -->

  <div class="assign-header__navigation">

    <a
      routerLink="/dashboard/platform-assessments-list"
      class="assign-header__back"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M19 12H5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="m10 7-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>
        Volver al listado
      </span>
    </a>

  </div>

</header>
