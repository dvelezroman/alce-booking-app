<div class="countdown-banner" *ngIf="showBanner">

  <!-- =====================================================
       HEADER
  ====================================================== -->
  <div class="countdown-banner__header">

    <div class="countdown-banner__heading">

      <div class="countdown-banner__main-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M7 4.5h10A2.5 2.5 0 0 1 19.5 7v12A2.5 2.5 0 0 1 17 21.5H7A2.5 2.5 0 0 1 4.5 19V7A2.5 2.5 0 0 1 7 4.5Z"
            stroke="currentColor"
            stroke-width="1.6"
          />

          <path
            d="M9 4.5V3.8A1.8 1.8 0 0 1 10.8 2h2.4A1.8 1.8 0 0 1 15 3.8v.7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />

          <path
            d="M8.5 10.5l1.5 1.5 2.5-2.7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M14.5 11h2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />

          <path
            d="M8.5 15.5l1.5 1.5 2.5-2.7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M14.5 16h2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>

        <span class="countdown-banner__main-icon-check">
          ✓
        </span>
      </div>


      <div class="countdown-banner__heading-copy">
        <h3 class="countdown-banner__title">
          Evaluaciones pendientes
        </h3>

        <p class="countdown-banner__subtitle">
          Tienes
          {{ countdowns.length }}
          evaluación{{ countdowns.length > 1 ? 'es' : '' }}
          pendiente{{ countdowns.length > 1 ? 's' : '' }}
        </p>
      </div>

    </div>


    <div class="countdown-banner__actions">

      <!-- AYUDA -->
      <button
        type="button"
        class="countdown-banner__help"
        (click)="goToHelp()"
        aria-label="Ver guía"
      >
        <span class="countdown-banner__help-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M9 7.5v9l7-4.5-7-4.5Z"
              fill="currentColor"
            />
          </svg>
        </span>

        <span class="countdown-banner__help-text">
          Ver guía
        </span>
      </button>


      <!-- CERRAR -->
      <button
        type="button"
        class="countdown-banner__close"
        aria-label="Cerrar"
        (click)="closeBanner()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M6 6l12 12M18 6 6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </div>

  </div>


  <!-- =====================================================
       LISTA
  ====================================================== -->
  <div class="countdown-banner__list">

    <div
      class="countdown-banner__item"
      *ngFor="let c of countdowns"
      [class.countdown-banner__item--urgent]="c.isUrgent"
    >

      <!-- EVALUACIÓN -->
      <button
        type="button"
        class="countdown-banner__assessment"
        (click)="goToAssessmentPage()"
      >

        <span class="countdown-banner__assessment-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />

            <path
              d="M14 3.5V8h4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />

            <path
              d="M9 12h6M9 15h4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>


        <span class="countdown-banner__assessment-copy">

          <strong class="countdown-banner__assessment-name">
            {{ c.description }}
          </strong>

          <span class="countdown-banner__assessment-status">
            Evaluación pendiente
          </span>

        </span>

      </button>


      <!-- DIVISOR -->
      <span
        class="countdown-banner__divider"
        aria-hidden="true"
      ></span>


      <!-- COUNTDOWN -->
      <div
        class="countdown-banner__timer"
        [class.countdown-banner__timer--urgent]="c.isUrgent"
      >

        <span class="countdown-banner__timer-label">
          Tiempo restante
        </span>


        <!-- CUANDO QUEDAN DÍAS -->
        <div
          class="countdown-banner__timer-days"
          *ngIf="c.days > 0"
        >
          <strong>
            {{ c.days }}
          </strong>

          <span>
            día{{ c.days > 1 ? 's' : '' }}
          </span>
        </div>


        <!-- HH : MM : SS -->
        <div class="countdown-banner__timer-blocks">

          <div class="countdown-banner__time-unit">
            <strong>
              {{ c.hours }}
            </strong>

            <span>
              Horas
            </span>
          </div>


          <span class="countdown-banner__separator">
            :
          </span>


          <div class="countdown-banner__time-unit">
            <strong>
              {{ c.minutes }}
            </strong>

            <span>
              Minutos
            </span>
          </div>


          <span class="countdown-banner__separator">
            :
          </span>


          <div
            class="
              countdown-banner__time-unit
              countdown-banner__time-unit--seconds
            "
          >
            <strong>
              {{ c.seconds }}
            </strong>

            <span>
              Segundos
            </span>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
