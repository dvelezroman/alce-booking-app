<section class="evaluation-banner">

  <div class="content">
    <div class="text">
      <h3>¡Tienes clases por calificar!</h3>

      <p>
        Tienes
        <strong>{{ count }}</strong>
        clase{{ count > 1 ? 's' : '' }}
        pendiente{{ count > 1 ? 's' : '' }} de evaluación.
      </p>
    </div>

    <button class="action-btn" (click)="onClick()">
      Calificar ahora
    </button>
  </div>

</section>
