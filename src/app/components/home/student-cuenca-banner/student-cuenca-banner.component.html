<div class="modal-backdrop" *ngIf="show">

  <div class="modal-container">

    <!-- Botón cerrar -->
    <button class="close-btn" (click)="closeModal()">✕</button>

    <div class="content-wrapper">

      <!-- Panel izquierdo (info) -->
      <div class="info-panel">
        <h2 class="title">Nueva sede Cuenca</h2>

        <p class="address-title"> Dirección</p>
        <p class="address-text">
          Ave 27 de Febrero 270, Cuenca
        </p>

        <p class="description">
          Visítanos en nuestra nueva sede en Cuenca. Estamos listos para atenderte
          con todas las comodidades y espacios adecuados para tus clases.
        </p>

        <button class="maps-btn" (click)="openMaps()">
          Ver en Google Maps
        </button>
      </div>

      <!-- Panel derecho (imagen) -->
      <div class="image-panel">
        <img src="assets/imagen_direccion.jpeg" alt="Local Cuenca" />
      </div>

    </div>
  </div>
</div>
