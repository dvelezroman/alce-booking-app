<div
  class="announcement-backdrop"
  *ngIf="show"
>
  <div class="announcement-card animate-in">

    <!-- CERRAR -->
    <button
      type="button"
      class="announcement-close-x"
      aria-label="Cerrar"
      (click)="closeOnly()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M6 6l12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>


    <!-- ICONO -->
    <div class="announcement-icon-wrapper">
      <div class="announcement-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="5"
            y="4"
            width="14"
            height="16"
            rx="2.5"
            stroke="currentColor"
            stroke-width="1.6"
          />

          <path
            d="M9 4.5V3.8C9 2.8 9.8 2 10.8 2h2.4C14.2 2 15 2.8 15 3.8v.7"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />

          <path
            d="M8.5 9.5l1.3 1.3 2.3-2.4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M13.5 10h2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />

          <path
            d="M8.5 14.5l1.3 1.3 2.3-2.4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M13.5 15h2"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>


    <!-- CONTENIDO -->
    <div class="announcement-content">

      <span class="announcement-eyebrow">
        Evaluación pendiente
      </span>

      <h2 class="announcement-title">
        Tienes
        <strong>{{ count }}</strong>
        evaluación{{ count > 1 ? 'es' : '' }}
        pendiente{{ count > 1 ? 's' : '' }}
      </h2>

      <p class="announcement-subtitle">
        Tienes evaluaciones activas que todavía debes completar.
        Revisa la fecha límite para no quedarte sin tiempo.
      </p>

    </div>


    <!-- INFO -->
    <div class="announcement-info">

      <span class="announcement-info__icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="8"
            stroke="currentColor"
            stroke-width="1.6"
          />

          <path
            d="M12 8v4l2.5 1.5"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <span>
        Recuerda que el tiempo para completar cada evaluación es limitado.
      </span>

    </div>


    <!-- ACCIONES -->
    <div class="announcement-actions">

      <button
        type="button"
        class="announcement-help-btn"
        (click)="goToHelp()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="8"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9.8 9.3a2.4 2.4 0 0 1 4.5 1.2c0 1.6-2.3 1.9-2.3 3"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="16.6"
            r=".8"
            fill="currentColor"
          />
        </svg>

        ¿Cómo funciona?
      </button>


      <button
        type="button"
        class="announcement-primary-btn"
        (click)="close()"
      >
        <span>
          Ir a mis evaluaciones
        </span>

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 12h13M14 7l5 5-5 5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

    </div>

  </div>
</div>
