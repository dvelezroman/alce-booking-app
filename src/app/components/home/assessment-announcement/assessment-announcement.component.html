<div class="announcement-backdrop" *ngIf="show">
  <div class="announcement-card animate-in">

    <button class="announcement-close-x" (click)="closeOnly()">×</button>

    <h2 class="title">
      ¡Tienes {{ count }} evaluación{{ count > 1 ? 'es' : '' }} pendiente{{ count > 1 ? 's' : '' }}!
    </h2>

    <p class="subtitle">
      Recuerda que tienes tiempo limitado para completarlas.
    </p>

    <div class="actions-row">
      <button class="help-btn" (click)="goToHelp()">
        ¿Dudas?
      </button>

      <button class="close-btn" (click)="close()">
        Entendido
      </button>
    </div>

  </div>
</div>
