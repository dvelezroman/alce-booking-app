<div class="banner-backdrop">
  <div class="banner-modal">

    <!-- Botón cerrar -->
    <button class="close-btn" (click)="closeBanner()">✕</button>

    <!-- Imagen del banner -->
    <img src="assets/imagen-banner-student.jpeg" alt="Banner estudiante" class="banner-img" />

    <!-- Contenido -->
    <div class="banner-content">

      <div class="buttons">
        <button *ngIf="videoUrl" class="btn video" (click)="goToVideo()">
            <span class="icon">
            <!-- Ícono oficial de YouTube (SVG) -->
            <svg height="18" viewBox="0 0 24 24" fill="white">
                <path d="M23.5 6.2s-.2-1.7-.9-2.5c-.8-.9-1.7-.9-2.1-1C17.5 2.3 12 2.3 12 2.3h-.1s-5.5 0-8.5.4c-.4.1-1.3.1-2.1 1-.7.8-.9 2.5-.9 2.5S0 8.1 0 10v1.9c0 1.9.2 3.8.2 3.8s.2 1.7.9 2.5c.8.9 1.9.9 2.4 1 1.8.2 7.5.4 7.5.4s5.5 0 8.5-.4c.4-.1 1.3-.1 2.1-1 .7-.8.9-2.5.9-2.5s.2-1.9.2-3.8V10c0-1.9-.2-3.8-.2-3.8zM9.8 14.8V8.5l6.3 3.1-6.3 3.2z"/>
            </svg>
            </span>
            Ver video
        </button>

        <button class="btn info" (click)="goToWhatsapp()">
            <span class="icon">
            <!-- Ícono oficial de WhatsApp (SVG) -->
            <svg height="19" viewBox="0 0 32 32" fill="white">
                <path d="M16 .4C7.5.4.6 7.3.6 15.8c0 2.8.8 5.5 2.3 7.9L0 32l8.6-2.8c2.3 1.3 4.9 2 7.6 2 8.5 0 15.4-6.9 15.4-15.4C31.6 7.3 24.5.4 16 .4zm0 27.9c-2.4 0-4.7-.7-6.7-2l-.5-.3-5.1 1.7 1.7-5-.3-.5c-1.3-2-2-4.3-2-6.7C3.1 8.6 8.9 2.8 16 2.8s12.9 5.8 12.9 12.9c-.1 7-5.9 12.6-12.9 12.6zm7.3-9.4c-.4-.2-2.4-1.2-2.8-1.3-.4-.2-.7-.2-1 .2-.3.4-1.1 1.3-1.3 1.6-.2.3-.5.3-.9.1-.4-.2-1.7-.6-3.3-2-1.2-1.1-2-2.4-2.2-2.8-.2-.4 0-.6.2-.8.2-.2.4-.5.6-.7.2-.2.3-.4.5-.6.2-.2.3-.4.4-.6.1-.2.1-.4 0-.6-.1-.2-1-2.4-1.4-3.2-.4-.7-.8-.6-1.1-.6h-.9c-.3 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.3 3.3 1.4 3.6c.2.3 2.6 4 6.3 5.7.9.4 1.6.6 2.1.8.9.3 1.7.3 2.3.2.7-.1 2.4-1 2.7-1.9.3-.9.3-1.7.2-1.9-.2-.1-.5-.3-.9-.5z"/>
            </svg>
            </span>
            Más información
        </button>
        </div>
    </div>

  </div>
</div>
