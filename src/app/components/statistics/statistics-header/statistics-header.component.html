<header class="statistics-header">

  <div class="statistics-header__main">

    <div
      class="statistics-header__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="4"
          y="4"
          width="16"
          height="16"
          rx="2.2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M7.5 15.5 11 12l2.4 2.3 3.8-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="statistics-header__content">
      <h1 class="statistics-header__title">
        Estadísticas de evaluaciones
      </h1>

      <p class="statistics-header__description">
        Analiza el desempeño de los instructores según las evaluaciones recibidas.
      </p>
    </div>

  </div>

  <div class="statistics-header__actions">

    <button
      type="button"
      class="statistics-header__export"
      (click)="onExport()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 3v11"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="m8 10 4 4 4-4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M5 17v2h14v-2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>
        Exportar informe
      </span>
    </button>

  </div>

</header>
