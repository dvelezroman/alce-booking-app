<header
  class="assessment-header"
  aria-labelledby="assessment-page-title"
>

  <div class="assessment-header__content">
    <div class="assessment-header__information">
      <span
        class="assessment-header__icon"
        aria-hidden="true"
      >
        <i class="fa-solid fa-clipboard-check"></i>
      </span>

      <div class="assessment-header__text">
        <h1
          id="assessment-page-title"
          class="assessment-header__title"
        >
          Evaluaciones
        </h1>

        <p class="assessment-header__description">
          Consulta el estado de tus evaluaciones por etapa.
        </p>
      </div>
    </div>

    <div
      class="assessment-header__illustration"
      aria-hidden="true"
    >
      <svg
        class="assessment-header__illustration-svg"
        viewBox="0 0 320 210"
        xmlns="http://www.w3.org/2000/svg"
        role="presentation"
      >
        <defs>
          <linearGradient
            id="assessment-board-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#9b7af7"
            />

            <stop
              offset="100%"
              stop-color="#6540dc"
            />
          </linearGradient>

          <linearGradient
            id="assessment-paper-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#ffffff"
            />

            <stop
              offset="100%"
              stop-color="#f3efff"
            />
          </linearGradient>

          <linearGradient
            id="assessment-cap-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#8c67ee"
            />

            <stop
              offset="100%"
              stop-color="#5530cc"
            />
          </linearGradient>

          <linearGradient
            id="assessment-tassel-gradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#ffc95f"
            />

            <stop
              offset="100%"
              stop-color="#f29c25"
            />
          </linearGradient>

          <filter
            id="assessment-shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="180%"
          >
            <feDropShadow
              dx="0"
              dy="9"
              stdDeviation="7"
              flood-color="#5031b7"
              flood-opacity="0.18"
            />
          </filter>

          <filter
            id="assessment-soft-shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="180%"
          >
            <feDropShadow
              dx="0"
              dy="5"
              stdDeviation="5"
              flood-color="#5031b7"
              flood-opacity="0.14"
            />
          </filter>
        </defs>

        <!-- Fondo decorativo -->

        <ellipse
          cx="172"
          cy="181"
          rx="120"
          ry="18"
          fill="#7650df"
          opacity="0.08"
        />

        <circle
          cx="257"
          cy="108"
          r="49"
          fill="#8e6bec"
          opacity="0.08"
        />

        <circle
          cx="75"
          cy="86"
          r="4"
          fill="#9d82f2"
          opacity="0.4"
        />

        <circle
          cx="57"
          cy="119"
          r="2.5"
          fill="#a990f5"
          opacity="0.55"
        />

        <circle
          cx="284"
          cy="56"
          r="3"
          fill="#987af0"
          opacity="0.38"
        />

        <path
          d="M67 146C53 140 48 129 52 119"
          fill="none"
          stroke="#9b7cf1"
          stroke-width="2"
          stroke-linecap="round"
          stroke-dasharray="2 8"
          opacity="0.35"
        />

        <!-- Tabla -->

        <g filter="url(#assessment-shadow)">
          <rect
            x="95"
            y="27"
            width="130"
            height="151"
            rx="14"
            fill="url(#assessment-board-gradient)"
          />

          <rect
            x="106"
            y="40"
            width="108"
            height="124"
            rx="9"
            fill="url(#assessment-paper-gradient)"
          />

          <rect
            x="138"

            width="45"
            height="25"
            rx="10"
            fill="#7954e5"
          />

          <circle
            cx="160.5"
            cy="20"
            r="7"
            fill="#8b68ed"
          />

          <circle
            cx="160.5"
            cy="20"
            r="2.8"
            fill="#f7f4ff"
          />

          <!-- Check 1 -->

          <rect
            x="119"
            y="57"
            width="24"
            height="24"
            rx="5"
            fill="#7753e4"
          />

          <path
            d="M125 68.5L130 73L138 63.5"
            fill="none"
            stroke="#ffffff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <rect
            x="153"

            rx="2.5"

          />

          <rect

            fill="#e6e1f4"
          />

          <!-- Check 2 -->

          <rect
            x="119"
            y="91"
            width="24"
            height="24"
            rx="5"
            fill="#7753e4"
          />

          <path
            d="M125 102.5L130 107L138 97.5"
            fill="none"
            stroke="#ffffff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <rect
            x="153"
            y="95"
            width="43"
            height="5"
            rx="2.5"
            fill="#d9d2ef"
          />

          <rect
            x="153"
            y="105"
            width="35"
            height="4"
            rx="2"
            fill="#e6e1f4"
          />

          <!-- Check 3 -->

          <rect
            x="119"
            y="125"
            width="24"
            height="24"
            rx="5"
            fill="#7753e4"
          />

          <path
            d="M125 136.5L130 141L138 131.5"
            fill="none"
            stroke="#ffffff"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <rect
            x="153"
            y="129"
            width="43"
            height="5"
            rx="2.5"
            fill="#d9d2ef"
          />

          <rect
            x="153"
            y="139"
            width="27"
            height="4"
            rx="2"
            fill="#e6e1f4"
          />
        </g>

        <!-- Birrete -->

        <g filter="url(#assessment-soft-shadow)">
          <path
            d="M190 139L242 119L294 139L242 160L190 139Z"
            fill="url(#assessment-cap-gradient)"
          />

          <path
            d="M211 147V166C228 178 255 179 274 166V147L242 160L211 147Z"
            fill="#6741d8"
          />

          <path
            d="M294 139V166"
            fill="none"
            stroke="#4f2bbd"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M294 164C300 168 300 178 294 183C288 178 288 168 294 164Z"
            fill="url(#assessment-tassel-gradient)"
          />
        </g>
      </svg>
    </div>
  </div>
</header>
