<section
  class="assessment-support"
  aria-labelledby="assessment-support-title"
>
  <div class="assessment-support__information">
    <span
      class="assessment-support__icon"
      aria-hidden="true"
    >
      <i class="fa-solid fa-info"></i>
    </span>

    <div class="assessment-support__content">
      <h2
        id="assessment-support-title"
        class="assessment-support__title"
      >
        ¿Tienes dudas?
      </h2>

      <p class="assessment-support__description">
        Si necesitas ayuda con alguna evaluación, contacta a tu
        instructor o al soporte académico.
      </p>
    </div>
  </div>

  <button
    type="button"
    class="assessment-support__button"
    (click)="onContactSupport()"
  >
    <i
      class="fa-solid fa-headset"
      aria-hidden="true"
    ></i>

    <span>
      Contactar soporte
    </span>
  </button>
</section>
