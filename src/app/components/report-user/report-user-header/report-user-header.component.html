<header class="report-user-header">

  <!-- INFORMATION -->
  <div class="report-user-header__information">

    <span
      class="report-user-header__icon"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none">

        <path
          d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M9 12h6M9 15.5h6M9 19h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"/>

      </svg>

    </span>


    <div class="report-user-header__content">

      <h1 class="report-user-header__title">
        Reporte de usuarios
      </h1>

      <p class="report-user-header__description">
        Consulta y analiza la información de los usuarios del sistema.
      </p>

    </div>

  </div>


  <!-- ACTIONS -->
  <div class="report-user-header__actions">

    <!-- GENERATE -->
    <button
      type="button"
      class="
        report-user-header__button
        report-user-header__button--generate
      "
      (click)="onExport()">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true">

        <path
          d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M9 12h6M9 15.5h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"/>

      </svg>

      <span>
         Exportar Excel
      </span>

    </button>

  </div>

</header>
