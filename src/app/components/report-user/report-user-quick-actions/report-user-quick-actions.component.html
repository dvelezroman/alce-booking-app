<section class="report-user-quick-actions">

  <!-- HEADER -->
  <header class="report-user-quick-actions__header">

    <div class="report-user-quick-actions__heading">

      <span
        class="report-user-quick-actions__heading-icon"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="M12 3v6M12 15v6M3 12h6M15 12h6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"/>

          <circle
            cx="12"
            cy="12"
            r="2.4"
            stroke="currentColor"
            stroke-width="1.7"/>

        </svg>

      </span>

      <div>
        <h3>
          Acciones rápidas
        </h3>

        <p>
          Consultas frecuentes
        </p>
      </div>

    </div>

  </header>


  <!-- ACTIONS -->
  <div class="report-user-quick-actions__list">

    <!-- STAGES -->
    <button
      type="button"
      class="report-user-quick-actions__item"
      (click)="onStages()">

      <span
        class="
          report-user-quick-actions__icon
          report-user-quick-actions__icon--stages
        ">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true">

          <path
            d="M5 7h14M5 12h14M5 17h9"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-user-quick-actions__content">

        <strong>
          Historial de stages
        </strong>

        <small>
          Consulta cambios de etapa
        </small>

      </span>

      <span
        class="report-user-quick-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- COMMENTS -->
    <button
      type="button"
      class="report-user-quick-actions__item"
      (click)="onComments()">

      <span
        class="
          report-user-quick-actions__icon
          report-user-quick-actions__icon--comments
        ">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true">

          <path
            d="M5 5.5h14v10H11l-4.5 3v-3H5v-10Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"/>

          <path
            d="M8.5 9.5h7M8.5 12.8h5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-user-quick-actions__content">

        <strong>
          Comentarios
        </strong>

        <small>
          Revisar usuarios con comentarios
        </small>

      </span>

      <span
        class="report-user-quick-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- ALERTS -->
    <button
      type="button"
      class="report-user-quick-actions__item"
      (click)="onAlerts()">

      <span
        class="
          report-user-quick-actions__icon
          report-user-quick-actions__icon--alerts
        ">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true">

          <path
            d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

          <path
            d="M10 20h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-user-quick-actions__content">

        <strong>
          Alertas
        </strong>

        <small>
          Consultar usuarios con alertas
        </small>

      </span>

      <span
        class="report-user-quick-actions__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>

  </div>

</section>
