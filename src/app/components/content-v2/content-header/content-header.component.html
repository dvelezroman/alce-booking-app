<header class="content-header">

  <!-- =========================
       INFORMATION
  ========================== -->

  <div class="content-header__information">

    <div class="content-header__title-row">

      <span
        class="content-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4.5 5.5h5.7c1.1 0 1.8.3 2.3.9.5-.6 1.2-.9 2.3-.9h4.7v13h-4.7c-1.2 0-1.9.3-2.3 1-.4-.7-1.1-1-2.3-1H4.5v-13Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M12.5 6.4v13"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M7.2 9h2.2M7.2 12h2.2M15.6 9h2.2"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </span>


      <h1 class="content-header__title">
        Contenido de estudio
      </h1>

    </div>


    <p class="content-header__description">
      Crea, busca y administra los contenidos por stage y unidad.
    </p>

  </div>


  <!-- =========================
       ACTION
  ========================== -->

  <div class="content-header__actions">

    <button
      type="button"
      class="content-header__create"
      (click)="onCreate()"
    >

      <span
        class="content-header__create-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Nuevo contenido
      </span>

    </button>

  </div>

</header>
