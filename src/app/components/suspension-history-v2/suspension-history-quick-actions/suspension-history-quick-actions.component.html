<section class="quick-actions">

  <header class="quick-actions__header">

    <span
      class="quick-actions__header-icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M5 7.5h14M5 12h14M5 16.5h14"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <circle
          cx="8"
          cy="7.5"
          r="1.5"
          fill="#fff"
          stroke="currentColor"
          stroke-width="1.5"
        />

        <circle
          cx="15"
          cy="12"
          r="1.5"
          fill="#fff"
          stroke="currentColor"
          stroke-width="1.5"
        />

        <circle
          cx="10"
          cy="16.5"
          r="1.5"
          fill="#fff"
          stroke="currentColor"
          stroke-width="1.5"
        />
      </svg>
    </span>

    <div>
      <h2>Acciones rápidas</h2>

      <p>
        Accesos frecuentes del historial.
      </p>
    </div>

  </header>


  <div class="quick-actions__list">

    <button
      type="button"
      class="quick-actions__item"
      (click)="onExport()"
    >
      <span class="quick-actions__item-icon quick-actions__item-icon--green">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 4v10m0 0 4-4m-4 4-4-4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M5 18v1.2A1.8 1.8 0 0 0 6.8 21h10.4A1.8 1.8 0 0 0 19 19.2V18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="quick-actions__item-content">
        <strong>Exportar historial</strong>

        <small>
          Descarga los registros disponibles.
        </small>
      </span>

      <span class="quick-actions__arrow">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>


    <button
      type="button"
      class="quick-actions__item"
      (click)="onRefresh()"
    >
      <span class="quick-actions__item-icon quick-actions__item-icon--purple">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M20 7v5h-5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M18.4 8.2A7.5 7.5 0 1 0 19 15"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="quick-actions__item-content">
        <strong>Actualizar información</strong>

        <small>
          Vuelve a consultar el historial.
        </small>
      </span>

      <span class="quick-actions__arrow">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>


    <button
      type="button"
      class="quick-actions__item"
      (click)="onClearFilters()"
    >
      <span class="quick-actions__item-icon quick-actions__item-icon--blue">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 5h16l-6.5 7.2V18l-3 1.5v-7.3L4 5Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="m16.5 15.5 4 4M20.5 15.5l-4 4"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="quick-actions__item-content">
        <strong>Limpiar filtros</strong>

        <small>
          Restablece la búsqueda actual.
        </small>
      </span>

      <span class="quick-actions__arrow">
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>

  </div>

</section>
