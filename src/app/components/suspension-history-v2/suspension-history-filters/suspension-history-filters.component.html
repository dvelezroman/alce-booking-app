<section class="history-filters">

  <!-- HEADER -->
  <header class="history-filters__header">

    <span
      class="history-filters__header-icon"
      aria-hidden="true"
    >
      <svg
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M4 5h16l-6.5 7.2V18l-3 1.5v-7.3L4 5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div>
      <h2>
        Filtros de búsqueda
      </h2>

      <p>
        Filtra el historial de licencias según los criterios que necesites.
      </p>
    </div>

  </header>


  <!-- FILTERS -->
  <div class="history-filters__content">

    <!-- STUDENT -->
    <div class="history-filters__field">

      <label for="studentId">
        Estudiante
      </label>

      <div class="history-filters__control">

        <span
          class="history-filters__control-icon"
          aria-hidden="true"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="m16 16 4 4"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <input
          id="studentId"
          type="number"
          [(ngModel)]="studentId"
          placeholder="Buscar por ID del estudiante..."
        />

      </div>

    </div>


    <!-- STAGE -->
    <div class="history-filters__field">

      <label for="stageId">
        Stage (etapa)
      </label>

      <div
        class="
          history-filters__control
          history-filters__control--select
        "
      >

        <select
          id="stageId"
          [(ngModel)]="stageId"
        >
          <option [ngValue]="null">
            Todos los stages
          </option>

          <option [ngValue]="1">
            Stage 1
          </option>

          <option [ngValue]="2">
            Stage 2
          </option>

          <option [ngValue]="3">
            Stage 3
          </option>

          <option [ngValue]="4">
            Stage 4
          </option>

          <option [ngValue]="5">
            Stage 5
          </option>

          <option [ngValue]="6">
            Stage 6
          </option>

          <option [ngValue]="7">
            Stage 7
          </option>

          <option [ngValue]="8">
            Stage 8
          </option>

          <option [ngValue]="9">
            Stage 9
          </option>

          <option [ngValue]="10">
            Stage 10
          </option>

          <option [ngValue]="11">
            Stage 11
          </option>

          <option [ngValue]="12">
            Stage 12
          </option>
        </select>

      </div>

    </div>


    <!-- ACTIONS -->
    <div class="history-filters__actions">

      <button
        type="button"
        class="
          history-filters__button
          history-filters__button--clear
        "
        (click)="clearFilters()"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M4 12a8 8 0 1 0 2.34-5.66"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M4 5v5h5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>
          Limpiar filtros
        </span>
      </button>


      <button
        type="button"
        class="
          history-filters__button
          history-filters__button--search
        "
        (click)="search()"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m16 16 4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span>
          Buscar
        </span>
      </button>

    </div>

  </div>

</section>
