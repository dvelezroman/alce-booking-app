<section
  class="platform-empty"
  [class.platform-empty--error]="hasError"
>

  <div
    class="platform-empty__icon"
    aria-hidden="true"
  >

    @if (hasError) {

      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 8v5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="16.5"
          r=".8"
          fill="currentColor"
        />
      </svg>

    } @else {

      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="6"
          y="4"
          width="12"
          height="16"
          rx="2"
          stroke="currentColor"
          stroke-width="1.6"
        />

        <path
          d="M9 3.5h6M9 9h6M9 13h6"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />

        <path
          d="M9 17h3"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>

    }

  </div>


  <div class="platform-empty__content">

    <strong class="platform-empty__title">
      {{ title }}
    </strong>

    <p class="platform-empty__description">
      {{ description }}
    </p>

  </div>

</section>
