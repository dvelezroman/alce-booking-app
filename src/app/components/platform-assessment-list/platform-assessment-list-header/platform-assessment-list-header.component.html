<header class="platform-header">

  <!-- =========================
       INFORMATION
  ========================== -->

  <div class="platform-header__information">

    <div class="platform-header__content">

      <h1 class="platform-header__title">
        Evaluaciones de plataforma
      </h1>

      <p class="platform-header__description">
        Listado en tiempo real de asignaciones de exámenes realizados en la plataforma externa.
      </p>

    </div>

  </div>


  <!-- =========================
       ACTIONS
  ========================== -->

  <div class="platform-header__actions">

    <!-- AYUDA -->
    <button
      type="button"
      class="
        platform-header__button
        platform-header__button--secondary
      "
      (click)="onHelp()"
    >
      <span class="platform-header__button-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="8"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9.8 9.4a2.4 2.4 0 0 1 4.6.9c0 1.7-2.4 2-2.4 3.6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="16.8"
            r=".8"
            fill="currentColor"
          />
        </svg>
      </span>

      <span>
        Ayuda
      </span>
    </button>


    <!-- NUEVA ASIGNACIÓN -->
    <a
      class="
        platform-header__button
        platform-header__button--primary
      "
      routerLink="/dashboard/platform-assessments-assign"
    >
      <span class="platform-header__button-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="8"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M12 8v8M8 12h8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Nueva asignación
      </span>
    </a>

  </div>

</header>
