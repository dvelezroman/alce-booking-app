<nav
  *ngIf="totalItems > 0 && totalPages > 0"
  class="scheduled-meetings-pagination"
  aria-label="Paginación de clases agendadas"
>
  <p class="pagination-summary">
    Mostrando
    <strong>
      {{ firstVisibleItem }}
    </strong>
    a
    <strong>
      {{ lastVisibleItem }}
    </strong>
    de
    <strong>
      {{ totalItems }}
    </strong>
    clases
  </p>

  <div class="pagination-controls">
    <button
      type="button"
      class="pagination-button pagination-arrow"
      [disabled]="currentPage === 1"
      (click)="goToPreviousPage()"
      aria-label="Ir a la página anterior"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m15 18-6-6 6-6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <button
      *ngIf="
        visiblePages.length > 0 &&
        visiblePages[0] > 1
      "
      type="button"
      class="pagination-button"
      [class.pagination-button-active]="currentPage === 1"
      [attr.aria-current]="currentPage === 1 ? 'page' : null"
      (click)="goToPage(1)"
    >
      1
    </button>

    <span
      *ngIf="showStartEllipsis"
      class="pagination-ellipsis"
      aria-hidden="true"
    >
      …
    </span>

    <button
      *ngFor="
        let page of visiblePages;
        trackBy: trackByPage
      "
      type="button"
      class="pagination-button"
      [class.pagination-button-active]="page === currentPage"
      [attr.aria-current]="
        page === currentPage
          ? 'page'
          : null
      "
      (click)="goToPage(page)"
    >
      {{ page }}
    </button>

    <span
      *ngIf="showEndEllipsis"
      class="pagination-ellipsis"
      aria-hidden="true"
    >
      …
    </span>

    <button
      *ngIf="
        visiblePages.length > 0 &&
        visiblePages[
          visiblePages.length - 1
        ] < totalPages
      "
      type="button"
      class="pagination-button"
      [class.pagination-button-active]="
        currentPage === totalPages
      "
      [attr.aria-current]="
        currentPage === totalPages
          ? 'page'
          : null
      "
      (click)="goToPage(totalPages)"
    >
      {{ totalPages }}
    </button>

    <button
      type="button"
      class="pagination-button pagination-arrow"
      [disabled]="currentPage === totalPages"
      (click)="goToNextPage()"
      aria-label="Ir a la página siguiente"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m9 18 6-6-6-6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  </div>
</nav>
