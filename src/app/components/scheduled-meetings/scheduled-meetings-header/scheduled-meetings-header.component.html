<header
  class="scheduled-meetings-header"
  aria-labelledby="scheduled-meetings-title"
>
  <div class="scheduled-meetings-header__information">

    <div class="scheduled-meetings-header__main">
      <div
        class="scheduled-meetings-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 48 48"
          role="img"
          focusable="false"
        >
          <rect
            x="8"
            y="11"
            width="32"
            height="28"
            rx="6"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <path
            d="M8 19H40"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M17 7V14"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M31 7V14"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M16 26L21 31L32 23"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <div class="scheduled-meetings-header__content">
        <h1
          id="scheduled-meetings-title"
          class="scheduled-meetings-header__title"
        >
          Mis clases agendadas
        </h1>

        <p class="scheduled-meetings-header__description">
          Consulta y gestiona todas tus clases programadas.
        </p>
      </div>
    </div>

    <button
      type="button"
      class="scheduled-meetings-header__schedule-button"
      (click)="navigateToMeetingBooking()"
    >
      <svg
        class="scheduled-meetings-header__schedule-button-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <rect
          x="3.5"
          y="5"
          width="17"
          height="15"
          rx="3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M3.5 9H20.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 3.5V6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M16 3.5V6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M12 12V17"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M9.5 14.5H14.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Agendar nueva clase
      </span>

      <span
        class="material-icons scheduled-meetings-header__schedule-button-arrow"
        aria-hidden="true"
      >
        arrow_forward
      </span>
    </button>
  </div>

  <div
    class="scheduled-meetings-header__illustration"
    aria-hidden="true"
  >
    <svg
      viewBox="0 0 260 170"
      role="img"
      focusable="false"
    >
      <defs>
        <linearGradient
          id="scheduled-calendar-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#a88df5"
          />

          <stop
            offset="100%"
            stop-color="#6d48d8"
          />
        </linearGradient>

        <linearGradient
          id="scheduled-check-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#ffffff"
          />

          <stop
            offset="100%"
            stop-color="#eee8ff"
          />
        </linearGradient>
      </defs>

      <circle
        cx="125"
        cy="85"
        r="68"
        fill="#f2edff"
      />

      <circle
        cx="202"
        cy="43"
        r="9"
        fill="#e3d8ff"
      />

      <circle
        cx="47"
        cy="126"

      />

      <path

      <rect

        rx="15"

        stroke-width="3"

      <path

      />

      <path
        d="M85 31V49"
        fill="none"
        stroke="#7652df"
        stroke-width="6"
        stroke-linecap="round"
      />

      <path
        d="M146 31V49"
        fill="none"
        stroke="#7652df"
        stroke-width="6"
        stroke-linecap="round"
      />

      <rect
        x="72"
        y="77"
        width="18"
        height="15"
        rx="4"
        fill="#ece5ff"
      />

      <rect
        x="98"
        y="77"
        width="18"
        height="15"
        rx="4"
        fill="#ece5ff"
      />

      <rect
        x="124"
        y="77"
        width="18"
        height="15"
        rx="4"
        fill="url(#scheduled-calendar-gradient)"
      />

      <rect
        x="72"
        y="101"
        width="18"
        height="15"
        rx="4"
        fill="#ece5ff"
      />

      <rect
        x="98"
        y="101"
        width="18"
        height="15"
        rx="4"
        fill="#ece5ff"
      />

      <rect
        x="124"
        y="101"
        width="18"
        height="15"
        rx="4"
        fill="#ece5ff"
      />

      <circle
        cx="183"

        stroke-width="4"
      />

      <path
        d="M170 116L180 126L197 105"

        stroke="#7652df"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M204 72L211 65"
        fill="none"
        stroke="#a78bf1"
        stroke-width="4"
        stroke-linecap="round"
      />

      <path
        d="M218 85L228 82"
        fill="none"
        stroke="#a78bf1"
        stroke-width="4"
        stroke-linecap="round"
      />

      <path
        d="M213 99L222 102"
        fill="none"
        stroke="#a78bf1"
        stroke-width="4"
        stroke-linecap="round"
      />
    </svg>
  </div>
</header>
