<section
  class="scheduled-meetings-filters"
  aria-label="Filtros de clases agendadas"
>
  <div class="filters-layout">

    <!-- Buscar instructor -->
    <div class="filter-control filter-control--search">
      <span class="filter-icon" aria-hidden="true">
        <span class="material-icons">
          search
        </span>
      </span>

      <input
        class="filter-input"
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
        placeholder="Buscar por instructor"
        aria-label="Buscar por instructor"
      />
    </div>

    <!-- Filtro por fecha -->
    <div class="filter-control">
      <span class="filter-icon" aria-hidden="true">
        <span class="material-icons">
          calendar_today
        </span>
      </span>

      <select
        class="filter-select"
        [ngModel]="selectedDateFilter"
        (ngModelChange)="onDateFilterChange($event)"
        aria-label="Filtrar por fecha"
        >
        <option value="all">Todas las fechas</option>
        <option value="today">Hoy</option>
        <option value="week">Esta semana</option>
        <option value="month">Este mes</option>
        <option value="upcoming">Próximas clases</option>
        <option value="past">Clases anteriores</option>
        </select>

      <span class="select-arrow" aria-hidden="true">
        <span class="material-icons">
          keyboard_arrow_down
        </span>
      </span>
    </div>

    <button
      type="button"
      class="refresh-button"
      [class.refresh-button--loading]="isRefreshing"
      [disabled]="isRefreshing"
      (click)="onRefresh()"
      aria-label="Actualizar lista de clases"
    >
      <span
        class="material-icons refresh-button__icon"
        [class.refresh-button__icon--spinning]="isRefreshing"
      >
        refresh
      </span>
      <span class="refresh-button__text">
        {{ isRefreshing ? 'Actualizando...' : 'Actualizar lista' }}
      </span>
    </button>

  </div>
</section>
