<section
  class="scheduled-meetings-list"
  [class.scheduled-meetings-list-grid]="view === 'grid'"
  aria-label="Lista de clases agendadas"
>
  <ng-container *ngIf="isLoading; else meetingsContent">
    <div
      class="meeting-card-skeleton"
      *ngFor="let item of [1, 2, 3, 4]"
      aria-hidden="true"
    >
      <div class="skeleton-mode"></div>

      <div class="skeleton-date">
        <span class="skeleton-line skeleton-line-small"></span>
        <span class="skeleton-line skeleton-line-day"></span>
        <span class="skeleton-line skeleton-line-small"></span>
      </div>

      <div class="skeleton-divider"></div>

      <div class="skeleton-information">
        <span class="skeleton-line skeleton-line-hour"></span>
        <span class="skeleton-line skeleton-line-title"></span>

        <div class="skeleton-instructor">
          <span class="skeleton-avatar"></span>
          <span class="skeleton-line skeleton-line-name"></span>
        </div>
      </div>

      <div class="skeleton-actions">
        <span class="skeleton-line skeleton-line-status"></span>

        <div class="skeleton-buttons">
          <span class="skeleton-button skeleton-button-details"></span>
          <span class="skeleton-button skeleton-button-options"></span>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #meetingsContent>
    <ng-container *ngIf="meetings.length > 0; else emptyState">
      <ng-container
        *ngFor="
          let meeting of sortedMeetings;
          trackBy: trackByMeetingId
        "
      >
        <div class="scheduled-meeting-item">

          <app-scheduled-meeting-card
            [meeting]="meeting"
            (viewDetails)="onViewDetails($event)"
            (openOptions)="onOpenOptions($event)"
            (deleteMeeting)="onDeleteMeeting($event)"
          ></app-scheduled-meeting-card>

        </div>
      </ng-container>
    </ng-container>
  </ng-template>

  <ng-template #emptyState>
    <div class="scheduled-meetings-empty">
      <div
        class="empty-icon"
        aria-hidden="true"
      >
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="3"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M8 3v4M16 3v4M3 10h18"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="m9.5 15 1.7 1.7 3.8-4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <h3 class="empty-title">
        No encontramos clases agendadas
      </h3>

      <p class="empty-description">
        No existen clases que coincidan con los filtros seleccionados.
      </p>
    </div>
  </ng-template>
</section>
