<section class="searching-meeting-assignment">

  <!-- =========================
       TITLE
  ========================== -->
  <h2 class="searching-meeting-assignment__title">
    Asignar a instructor
  </h2>


  <!-- =========================
      INSTRUCTOR
  ========================== -->
  <div class="searching-meeting-assignment__field">

    <label
      class="searching-meeting-assignment__label"
      for="searching-meeting-instructor-search"
    >
      Instructor
    </label>

    <div class="searching-meeting-assignment__instructor-search">

      <!-- SEARCH ICON -->
      <span
        class="searching-meeting-assignment__instructor-search-icon"
        aria-hidden="true"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m16 16 4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <!-- INPUT -->
      <input
        id="searching-meeting-instructor-search"
        type="text"
        class="searching-meeting-assignment__input searching-meeting-assignment__instructor-input"
        placeholder="Buscar instructor..."
        [(ngModel)]="instructorSearch"
        (focus)="onInstructorInputFocus()"
        (ngModelChange)="onInstructorInputChange($event)"
        (blur)="onInstructorInputBlur()"
        autocomplete="off"
      />

      <!-- CLEAR -->
      <button
        *ngIf="instructorSearch"
        type="button"
        class="searching-meeting-assignment__instructor-clear"
        aria-label="Limpiar instructor"
        (mousedown)="$event.preventDefault()"
        (click)="clearInstructor()"
      >
        ×
      </button>


      <!-- =========================
          DROPDOWN
      ========================== -->
      <div
        *ngIf="
          showInstructorDropdown &&
          filteredInstructors.length > 0
        "
        class="searching-meeting-assignment__instructor-dropdown"
      >

        <button
          *ngFor="
            let instructor of filteredInstructors;
            trackBy: trackByInstructorId
          "
          type="button"
          class="searching-meeting-assignment__instructor-option"
          [class.searching-meeting-assignment__instructor-option--selected]="
            selectedInstructor?.id === instructor.id
          "
          (mousedown)="onSelectInstructor(instructor)"
        >

          <span class="searching-meeting-assignment__instructor-avatar">
            {{ getInstructorInitials(instructor) }}
          </span>

          <span class="searching-meeting-assignment__instructor-content">

            <strong>
              {{ getInstructorName(instructor) }}
            </strong>

            <small>
              {{ getInstructorSubtitle(instructor) }}
            </small>

          </span>

          <span class="searching-meeting-assignment__instructor-id">
            #{{ instructor.id }}
          </span>

        </button>

      </div>

    </div>


    <!-- SELECTED INSTRUCTOR -->
    <div
      *ngIf="selectedInstructor"
      class="searching-meeting-assignment__selected-instructor"
    >

      <span class="searching-meeting-assignment__selected-avatar">
        {{ getInstructorInitials(selectedInstructor) }}
      </span>

      <span class="searching-meeting-assignment__selected-content">

        <strong>
          {{ getInstructorName(selectedInstructor) }}
        </strong>

        <small>
          {{ getInstructorSubtitle(selectedInstructor) }}
        </small>

      </span>

      <svg
        class="searching-meeting-assignment__selected-check"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m5 12 4 4L19 6"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </div>

  </div>


  <!-- =========================
       MEETING LINK
  ========================== -->
  <div class="searching-meeting-assignment__field">

    <label
      class="searching-meeting-assignment__label"
      for="searching-meeting-link"
    >
      Enlace de reunión
    </label>

    <div class="searching-meeting-assignment__input-wrapper">

      <input
        id="searching-meeting-link"
        type="text"
        class="searching-meeting-assignment__input searching-meeting-assignment__input--link"
        [value]="meetingLink"
        placeholder="https://zoom.us/j/1234567890"
        readonly
      />

      <a
        *ngIf="meetingLink"
        class="searching-meeting-assignment__external-link"
        [href]="meetingLink"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir enlace de reunión"
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M14 4h6v6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="m20 4-9 9"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>

    </div>

  </div>


  <!-- =========================
       PASSWORD
  ========================== -->
  <div class="searching-meeting-assignment__field">

    <label
      class="searching-meeting-assignment__label"
      for="searching-meeting-password"
    >
      Contraseña
      <span class="searching-meeting-assignment__label-muted">
        (opcional)
      </span>
    </label>

    <input
      id="searching-meeting-password"
      type="text"
      class="searching-meeting-assignment__input"
      [value]="meetingPassword"
      placeholder="Contraseña de la reunión"
      readonly
    />

  </div>


  <!-- =========================
       INFO
  ========================== -->
  <div class="searching-meeting-assignment__info">

    <span
      class="searching-meeting-assignment__info-icon"
      aria-hidden="true"
    >
      <svg
        width="21"
        height="21"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M12 3 20 6v5c0 5.1-3.1 8.6-8 10-4.9-1.4-8-4.9-8-10V6l8-3Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="m8.5 12 2.2 2.2 4.8-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <p class="searching-meeting-assignment__info-text">
      El enlace y la contraseña se asignarán a todas las reuniones seleccionadas.
    </p>

  </div>

</section>
