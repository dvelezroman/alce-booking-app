<section class="searching-meeting-selection-summary">

  <!-- =========================
       TITLE
  ========================== -->
  <h2 class="searching-meeting-selection-summary__title">
    Selección actual
  </h2>


  <!-- =========================
       SELECTED COUNT
  ========================== -->
  <div class="searching-meeting-selection-summary__selected">

    <span
      class="searching-meeting-selection-summary__selected-icon"
      aria-hidden="true"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="4"
          y="4"
          width="16"
          height="16"
          rx="3"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="m8 12 2.5 2.5L16 9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <span class="searching-meeting-selection-summary__selected-text">
      {{ selectedMeetingsLabel }}
    </span>

  </div>


  <!-- =========================
       ACTION
  ========================== -->
  <button
    type="button"
    class="searching-meeting-selection-summary__button"
    [disabled]="disabled"
    (click)="onAssignRequested()"
  >
    <span
      class="searching-meeting-selection-summary__button-icon"
      aria-hidden="true"
    >
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M10.6 13.4 13.4 10.6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="m8.8 15.2-2.1 2.1a3.5 3.5 0 0 1-5-5l3.7-3.7a3.5 3.5 0 0 1 5 0"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="m15.2 8.8 2.1-2.1a3.5 3.5 0 0 1 5 5l-3.7 3.7a3.5 3.5 0 0 1-5 0"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span>
      Asignar enlace
    </span>
  </button>


  <!-- =========================
       INFO
  ========================== -->
  <div class="searching-meeting-selection-summary__info">

    <span
      class="searching-meeting-selection-summary__info-icon"
      aria-hidden="true"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 10.5v5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="7.5"
          r="1"
          fill="currentColor"
        />
      </svg>
    </span>

    <p class="searching-meeting-selection-summary__info-text">
      Selecciona una o más reuniones para asignarles el enlace del instructor.
    </p>

  </div>

</section>
