<section class="searching-meeting-filters">

  <h2 class="searching-meeting-filters__title">
    Filtros de búsqueda
  </h2>

  <!-- =========================
       FILTERS ROW
  ========================== -->
  <div class="searching-meeting-filters__grid">

    <!-- FECHA DESDE -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Fecha desde
      </span>

      <div class="searching-meeting-filters__control-wrapper">
        <input
          type="date"
          class="searching-meeting-filters__control searching-meeting-filters__control--date"
          [(ngModel)]="filter.from"
        />

        <span
          class="searching-meeting-filters__control-icon searching-meeting-filters__control-icon--left"
          aria-hidden="true"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M7 3v4M17 3v4M3 9h18"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>
    </label>


    <!-- FECHA HASTA -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Fecha hasta
      </span>

      <div class="searching-meeting-filters__control-wrapper">
        <input
          type="date"
          class="searching-meeting-filters__control searching-meeting-filters__control--date"
          [(ngModel)]="filter.to"
        />

        <span
          class="searching-meeting-filters__control-icon searching-meeting-filters__control-icon--left"
          aria-hidden="true"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M7 3v4M17 3v4M3 9h18"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </span>
      </div>
    </label>


    <!-- HORA -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Hora
      </span>

      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.hour"
        >
          <option value="">
            Selecciona
          </option>

          <option
            *ngFor="let hour of availableHours"
            [ngValue]="hour"
          >
            {{ formatHour(hour) }}
          </option>
        </select>

        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>


    <!-- ETAPA -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Etapa
      </span>

      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.stageId"
        >
          <option value="">
            Selecciona etapa
          </option>

          <option
            *ngFor="let stage of stages"
            [value]="stage.id"
          >
            {{ getStageLabel(stage) }}
          </option>
        </select>

        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>


    <!-- ASIGNADO -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Asignado
      </span>

      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.assigned"
        >
          <option [ngValue]="false">
            Todos
          </option>

          <option [ngValue]="true">
            Asignados
          </option>
        </select>

        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>


    <!-- CATEGORÍA -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Categoría
      </span>

      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.category"
        >
          <option [ngValue]="undefined">
            Todas
          </option>

          <option
            *ngFor="let category of ageGroupOptions"
            [value]="category"
          >
            {{ getCategoryLabel(category) }}
          </option>
        </select>

        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>


    <!-- MODALIDAD -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Modalidad
      </span>

      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.mode"
        >
          <option [ngValue]="undefined">
            Todas
          </option>

          <option
            *ngFor="let mode of modeOptions"
            [value]="mode"
          >
            {{ getModeLabel(mode) }}
          </option>
        </select>

        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>

    <!-- INSTRUCTOR ASIGNADO -->
    <label class="searching-meeting-filters__field">
      <span class="searching-meeting-filters__label">
        Instructor asignado
      </span>
  
      <div class="searching-meeting-filters__select-wrapper">
        <select
          class="searching-meeting-filters__control searching-meeting-filters__select"
          [(ngModel)]="filter.instructorId"
          (ngModelChange)="onInstructorChange()"
        >
          <option value="">
            Todos
          </option>
  
          <option
            *ngFor="
              let instructor of instructors;
              trackBy: trackByInstructorId
            "
            [value]="getInstructorId(instructor)"
          >
            {{ getInstructorLabel(instructor) }}
          </option>
        </select>
  
        <svg
          class="searching-meeting-filters__select-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m6 9 6 6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </label>
  </div>



  <!-- =========================
       SEARCH / ACTIONS
  ========================== -->
  <div class="searching-meeting-filters__bottom">

    <!-- <label class="searching-meeting-filters__field searching-meeting-filters__field--search">
      <span class="searching-meeting-filters__label">
        Buscar estudiante
      </span>

      <div class="searching-meeting-filters__search-wrapper">

        <input
          type="text"
          class="searching-meeting-filters__control searching-meeting-filters__search"
          placeholder="Nombre o email del estudiante"
        />

        <span
          class="searching-meeting-filters__search-icon"
          aria-hidden="true"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
          >
            <circle
              cx="11"
              cy="11"
              r="6"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m16 16 4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>

      </div>
    </label> -->


    <!-- CLEAR -->
    <button
      type="button"
      class="searching-meeting-filters__button searching-meeting-filters__button--clear"
      (click)="onClearFilters()"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M20 6v5h-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M4 18v-5h5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M5.8 9A7 7 0 0 1 18.5 6M18.2 15A7 7 0 0 1 5.5 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Limpiar filtros
      </span>
    </button>


    <!-- SEARCH -->
    <button
      type="button"
      class="searching-meeting-filters__button searching-meeting-filters__button--search"
      (click)="onApplyFilters()"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="11"
          cy="11"
          r="6"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="m16 16 4 4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Buscar
      </span>
    </button>

  </div>

</section>
