<header class="stage-resources-header">

  <!-- LEFT -->
  <div class="stage-resources-header__main">

    <div
      class="stage-resources-header__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="4"
          width="14"
          height="15"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M8 4V3.5A1.5 1.5 0 0 1 9.5 2h5A1.5 1.5 0 0 1 16 3.5V4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 8h8M8 12h8M8 16h5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>


    <div class="stage-resources-header__content">

      <h1 class="stage-resources-header__title">
        Recursos académicos
      </h1>

      <p class="stage-resources-header__description">
        Administra los recursos académicos asociados a cada stage.
      </p>

    </div>

  </div>


  <!-- RIGHT -->
  <div class="stage-resources-header__actions">

    <button
      type="button"
      class="stage-resources-header__create"
      (click)="onCreateResource()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 5V19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M5 12H19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Nuevo recurso
      </span>

    </button>

  </div>

</header>
