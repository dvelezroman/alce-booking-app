<div class="whatsapp-widget">

  <div class="widget-header">

    <h3>WhatsApp</h3>

    <a routerLink="/dashboard/whatsapp" class="widget-link">
      Ver todos
    </a>

  </div>

  <!-- LISTA -->
  <div class="whatsapp-list" *ngIf="groups.length > 0">

    <div
      class="whatsapp-item"
      *ngFor="let g of groups"
      routerLink="/dashboard/whatsapp"
    >

      <div class="whatsapp-dot"></div>

      <div class="whatsapp-content">

        <span class="whatsapp-title">
          {{ g.name }}
        </span>

      </div>

    </div>

  </div>

  <!-- TOTAL -->
  <div
    class="whatsapp-more"
    *ngIf="totalGroups > groups.length"
    routerLink="/dashboard/whatsapp-groups"
  >
    {{ totalGroups - groups.length }} grupos más...
  </div>

  <!-- ACCION -->
  <div class="whatsapp-actions">

    <button
      class="whatsapp-btn"
      routerLink="/dashboard/whatsapp"
      type="button"
    >
      Enviar mensaje
    </button>

  </div>

  <!-- EMPTY -->
  <div
    class="whatsapp-empty"
    *ngIf="!loading && groups.length === 0"
  >

    <i class="fa-brands fa-whatsapp"></i>

    <p>Sin grupos activos</p>

  </div>

</div>
