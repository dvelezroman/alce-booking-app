<section class="feature-flag-restriction-filters">

  <!-- =====================================================
       CLASSIFICATION
  ====================================================== -->

  <div class="feature-flag-restriction-filters__field">

    <label
      class="feature-flag-restriction-filters__label"
      for="restriction-classification"
    >
      Clasificación
    </label>

    <div class="feature-flag-restriction-filters__select-wrapper">

      <select
        #classificationSelect
        id="restriction-classification"
        class="feature-flag-restriction-filters__select"
        [ngModel]="selectedStudentClassification"
        (ngModelChange)="onClassificationChange($event)"
      >
        <option [ngValue]="null">
          Todos
        </option>

        <option [ngValue]="'KIDS'">
          Kids
        </option>

        <option [ngValue]="'TEENS'">
          Teens
        </option>

        <option [ngValue]="'ADULTS'">
          Adults
        </option>
      </select>


      <svg
        class="feature-flag-restriction-filters__chevron"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m7 9 5 5 5-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </div>

  </div>


  <!-- =====================================================
       MODE
  ====================================================== -->

  <div class="feature-flag-restriction-filters__field">

    <label
      class="feature-flag-restriction-filters__label"
      for="restriction-mode"
    >
      Modalidad
    </label>

    <div class="feature-flag-restriction-filters__select-wrapper">

      <select
        #modeSelect
        id="restriction-mode"
        class="feature-flag-restriction-filters__select"
        [ngModel]="selectedMode"
        (ngModelChange)="onModeChange($event)"
      >
        <option [ngValue]="null">
          Todas
        </option>

        <option [ngValue]="'ONLINE'">
          Online
        </option>

        <option [ngValue]="'PRESENCIAL'">
          Presencial
        </option>
      </select>


      <svg
        class="feature-flag-restriction-filters__chevron"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m7 9 5 5 5-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </div>

  </div>


  <!-- =====================================================
       CITY
  ====================================================== -->

  <div class="feature-flag-restriction-filters__field">

    <label
      class="feature-flag-restriction-filters__label"
      for="restriction-city"
    >
      Ciudad
    </label>

    <div class="feature-flag-restriction-filters__select-wrapper">

      <select
        #citySelect
        id="restriction-city"
        class="feature-flag-restriction-filters__select"
        [ngModel]="selectedCity"
        (ngModelChange)="onCityChange($event)"
      >
        <option [ngValue]="null">
          Todas
        </option>

        <option [ngValue]="'Portoviejo'">
          Portoviejo
        </option>

        <option [ngValue]="'Cuenca'">
          Cuenca
        </option>
      </select>


      <svg
        class="feature-flag-restriction-filters__chevron"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m7 9 5 5 5-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </div>

  </div>

</section>
