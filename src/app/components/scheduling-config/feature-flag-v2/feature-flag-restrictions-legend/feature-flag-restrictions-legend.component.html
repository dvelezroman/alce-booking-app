<section class="feature-flag-restrictions-legend">

  <!-- =====================================================
       TITLE
  ====================================================== -->

  <h3 class="feature-flag-restrictions-legend__title">
    Leyenda
  </h3>


  <!-- =====================================================
       ITEMS
  ====================================================== -->

  <div class="feature-flag-restrictions-legend__list">

    <!-- FULL DAY -->

    <div class="feature-flag-restrictions-legend__item">

      <span
        class="
          feature-flag-restrictions-legend__indicator
          feature-flag-restrictions-legend__indicator--full-day
        "
        aria-hidden="true"
      >
        <span></span>
      </span>

      <span class="feature-flag-restrictions-legend__text">
        Día completo no disponible
      </span>

    </div>


    <!-- PARTIAL HOURS -->

    <div class="feature-flag-restrictions-legend__item">

      <span
        class="
          feature-flag-restrictions-legend__indicator
          feature-flag-restrictions-legend__indicator--hours
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="12"
            r="7"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M12 8v4l2.5 1.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="feature-flag-restrictions-legend__text">
        Horas parcialmente no disponibles
      </span>

    </div>


    <!-- FILTER -->

    <div class="feature-flag-restrictions-legend__item">

      <span
        class="
          feature-flag-restrictions-legend__indicator
          feature-flag-restrictions-legend__indicator--filter
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 6h16M7 12h10M10 18h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="feature-flag-restrictions-legend__text">
        Restricción por filtros aplicados
      </span>

    </div>


    <!-- AVAILABLE -->

    <div class="feature-flag-restrictions-legend__item">

      <span
        class="
          feature-flag-restrictions-legend__indicator
          feature-flag-restrictions-legend__indicator--available
        "
        aria-hidden="true"
      >
        <span></span>
      </span>

      <span class="feature-flag-restrictions-legend__text">
        Día disponible
      </span>

    </div>

  </div>


  <!-- =====================================================
       INFO
  ====================================================== -->

  <aside class="feature-flag-restrictions-legend__info">

    <span
      class="feature-flag-restrictions-legend__info-icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="4"
          y="5"
          width="16"
          height="15"
          rx="2.3"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M8 3v4M16 3v4M4 9h16"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </span>


    <p>
      Las restricciones mostradas corresponden a los filtros seleccionados.
    </p>

  </aside>

</section>
