<header class="assessment-header">

  <div class="assessment-header__content">

    <span class="assessment-header__eyebrow">
      Evaluaciones
    </span>

    <h1 class="assessment-header__title">
      Evaluaciones asignadas
    </h1>

    <p class="assessment-header__description">
      Consulta y gestiona todas las evaluaciones asignadas a los estudiantes.
    </p>

  </div>


  <div class="assessment-header__actions">

    <button
      type="button"
      class="assessment-header__button"
      (click)="onNewAssessment()"
    >
      <span
        class="assessment-header__button-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Nueva evaluación
      </span>

    </button>

  </div>

</header>
