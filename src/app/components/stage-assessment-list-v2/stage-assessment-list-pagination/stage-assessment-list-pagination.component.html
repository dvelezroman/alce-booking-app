<nav
  class="assessment-pagination"
  aria-label="Paginación de evaluaciones"
>

  <!-- =========================
       INFORMATION
  ========================== -->

  <div class="assessment-pagination__information">

    <span>
      {{ paginationLabel }}
    </span>

  </div>


  <!-- =========================
       CONTROLS
  ========================== -->

  <div class="assessment-pagination__controls">

    <!-- PREVIOUS -->

    <button
      type="button"
      class="
        assessment-pagination__button
        assessment-pagination__button--arrow
      "
      [disabled]="!canPrev"
      aria-label="Página anterior"
      (click)="onPrevious()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m14.5 7-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <!-- PAGES -->

    @for (
      item of visiblePages;
      track $index
    ) {

      @if (item === 'ellipsis') {

        <span class="assessment-pagination__ellipsis">
          …
        </span>

      } @else {

        <button
          type="button"
          class="assessment-pagination__button"
          [class.assessment-pagination__button--active]="
            item === page
          "
          [attr.aria-current]="
            item === page
              ? 'page'
              : null
          "
          (click)="goToPage(item)"
        >
          {{ item }}
        </button>

      }

    }


    <!-- NEXT -->

    <button
      type="button"
      class="
        assessment-pagination__button
        assessment-pagination__button--arrow
      "
      [disabled]="!canNext"
      aria-label="Página siguiente"
      (click)="onNext()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m9.5 7 5 5-5 5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

  </div>

</nav>
