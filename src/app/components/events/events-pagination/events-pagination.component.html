<section class="events-pagination">

  <!-- =========================
       RANGE
  ========================== -->
  <div class="events-pagination__range">
    {{ rangeLabel }}
  </div>


  <!-- =========================
       NAVIGATION
  ========================== -->
  <nav
    class="events-pagination__navigation"
    aria-label="Paginación de eventos"
  >

    <!-- PREVIOUS -->
    <button
      type="button"
      class="events-pagination__button events-pagination__button--arrow"
      [disabled]="!canPreviousPage"
      aria-label="Página anterior"
      (click)="onPrevious()"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m15 18-6-6 6-6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <!-- PAGES -->
    @for (
      page of visiblePages;
      track $index
    ) {

      @if (page === 'ellipsis') {

        <span class="events-pagination__ellipsis">
          ...
        </span>

      } @else {

        <button
          type="button"
          class="events-pagination__button"
          [class.events-pagination__button--active]="
            page === currentPage
          "
          [attr.aria-current]="
            page === currentPage
              ? 'page'
              : null
          "
          (click)="onPageChange(page)"
        >
          {{ page }}
        </button>

      }

    }


    <!-- NEXT -->
    <button
      type="button"
      class="events-pagination__button events-pagination__button--arrow"
      [disabled]="!canNextPage"
      aria-label="Página siguiente"
      (click)="onNext()"
    >
      <svg
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m9 18 6-6-6-6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

  </nav>


  <!-- =========================
       PAGE SIZE
  ========================== -->
  <div class="events-pagination__size">

    <div class="events-pagination__select-wrapper">

      <select
        class="events-pagination__select"
        [value]="itemsPerPage"
        (change)="
          onItemsPerPageChange(
            $any($event.target).value
          )
        "
      >
        @for (
          option of itemsPerPageOptions;
          track option
        ) {
          <option [value]="option">
            {{ option }} por página
          </option>
        }
      </select>


      <svg
        class="events-pagination__select-icon"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m6 9 6 6 6-6"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

    </div>

  </div>

</section>
