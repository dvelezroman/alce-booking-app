<header class="active-students-header">

  <div class="active-students-header__left">

    <span
      class="active-students-header__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M9 12h6M9 15.5h6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="m9.2 18.2 1.1 1 2-2.2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>


    <div class="active-students-header__information">

      <h1>
        Reporte de estudiantes activos
      </h1>

      <p>
        Genera y descarga el reporte de estudiantes activos según los filtros seleccionados.
      </p>

    </div>

  </div>


  <button
    type="button"
    class="active-students-header__history"
    (click)="onHistory()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <circle
        cx="12"
        cy="12"
        r="8"
        stroke="currentColor"
        stroke-width="1.7"
      />

      <path
        d="M12 7.5V12l3 2"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span>
      Historial de reportes
    </span>
  </button>

</header>
