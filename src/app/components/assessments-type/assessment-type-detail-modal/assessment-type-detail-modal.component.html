<div
  *ngIf="show && assessmentType"
  class="assessment-type-detail-modal"
  role="presentation"
  (click)="onBackdropClick()"
>

  <div
    class="assessment-type-detail-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="assessment-type-detail-title"
    (click)="stopPropagation($event)"
  >

    <!-- HEADER -->
    <header class="assessment-type-detail-modal__header">

      <div class="assessment-type-detail-modal__header-main">

        <div
          class="assessment-type-detail-modal__icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="5"
              y="4"
              width="14"
              height="16"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </div>


        <div class="assessment-type-detail-modal__header-content">

          <h2
            id="assessment-type-detail-title"
            class="assessment-type-detail-modal__title"
          >
            Detalle del tipo
          </h2>

          <p class="assessment-type-detail-modal__description">
            Información registrada del tipo de evaluación.
          </p>

        </div>

      </div>


      <button
        type="button"
        class="assessment-type-detail-modal__close"
        aria-label="Cerrar modal"
        (click)="onClose()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M6 6L18 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M18 6L6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- BODY -->
    <div class="assessment-type-detail-modal__body">

      <!-- NAME / STATUS -->
      <div class="assessment-type-detail-modal__grid">

        <div class="assessment-type-detail-modal__group">

          <span class="assessment-type-detail-modal__label">
            Nombre
          </span>

          <div class="assessment-type-detail-modal__value-box">

            <div
              class="
                assessment-type-detail-modal__value-icon
                assessment-type-detail-modal__value-icon--name
              "
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M5 5h14M5 10h14M5 15h8"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </div>


            <span class="assessment-type-detail-modal__value">
              {{ assessmentType.name }}
            </span>

          </div>

        </div>


        <div class="assessment-type-detail-modal__group">

          <span class="assessment-type-detail-modal__label">
            Estado
          </span>

          <div class="assessment-type-detail-modal__value-box">

            <span
              class="assessment-type-detail-modal__status"
              [class.assessment-type-detail-modal__status--active]="
                isActive
              "
              [class.assessment-type-detail-modal__status--inactive]="
                !isActive
              "
            >

              <span
                class="assessment-type-detail-modal__status-dot"
              ></span>

              {{ statusLabel }}

            </span>

          </div>

        </div>

      </div>


      <!-- DESCRIPTION -->
      <div class="assessment-type-detail-modal__group">

        <span class="assessment-type-detail-modal__label">
          Descripción
        </span>

        <div class="assessment-type-detail-modal__value-box">

          <div
            class="
              assessment-type-detail-modal__value-icon
              assessment-type-detail-modal__value-icon--description
            "
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="2"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M8 9h8M8 13h8M8 17h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>


          <span
            class="
              assessment-type-detail-modal__value
              assessment-type-detail-modal__value--secondary
            "
          >
            {{ description }}
          </span>

        </div>

      </div>


      <!-- DATES -->
      <div class="assessment-type-detail-modal__grid">

        <div class="assessment-type-detail-modal__group">

          <span class="assessment-type-detail-modal__label">
            Creado
          </span>

          <div class="assessment-type-detail-modal__date-box">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="4"
                y="5"
                width="16"
                height="15"
                rx="2"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M8 3v4M16 3v4M4 9h16"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>

            <span>
              {{ formatDateTime(getCreatedAt()) }}
            </span>

          </div>

        </div>


        <div class="assessment-type-detail-modal__group">

          <span class="assessment-type-detail-modal__label">
            Actualizado
          </span>

          <div class="assessment-type-detail-modal__date-box">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M20 11a8 8 0 1 0-2.34 5.66"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

              <path
                d="M20 5v6h-6"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <span>
              {{ formatDateTime(getUpdatedAt()) }}
            </span>

          </div>

        </div>

      </div>

    </div>


    <!-- FOOTER -->
    <footer class="assessment-type-detail-modal__footer">

      <button
        type="button"
        class="assessment-type-detail-modal__button"
        (click)="onClose()"
      >
        Cerrar
      </button>

    </footer>

  </div>

</div>
