<section
  class="assessment-type-summary"
  aria-label="Resumen de tipos de evaluación"
>

  <!-- TOTAL -->
  <article class="assessment-type-summary__card">

    <div
      class="
        assessment-type-summary__icon
        assessment-type-summary__icon--total
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="4"
          width="14"
          height="16"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>


    <div class="assessment-type-summary__content">

      <span class="assessment-type-summary__value">
        {{ totalAssessmentTypes }}
      </span>

      <span class="assessment-type-summary__title">
        Total tipos
      </span>

      <span class="assessment-type-summary__description">
        Tipos registrados
      </span>

    </div>

  </article>


  <!-- ACTIVE -->
  <article class="assessment-type-summary__card">

    <div
      class="
        assessment-type-summary__icon
        assessment-type-summary__icon--active
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M8.5 12.2L10.8 14.5L15.8 9.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="assessment-type-summary__content">

      <span class="assessment-type-summary__value">
        {{ activeAssessmentTypes }}
      </span>

      <span class="assessment-type-summary__title">
        Tipos activos
      </span>

      <span class="assessment-type-summary__description">
        {{ activePercentage }}% del total
      </span>

    </div>

  </article>


  <!-- IN USE -->
  <article class="assessment-type-summary__card">

    <div
      class="
        assessment-type-summary__icon
        assessment-type-summary__icon--usage
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M5 7h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M9 11h6M9 15h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>


    <div class="assessment-type-summary__content">

      <span class="assessment-type-summary__value">
        {{ assessmentTypesInUse }}
      </span>

      <span class="assessment-type-summary__title">
        Tipos en uso
      </span>

      <span class="assessment-type-summary__description">
        Utilizados en evaluaciones
      </span>

    </div>

  </article>

</section>
