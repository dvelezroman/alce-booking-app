<header class="assessment-type-header">

  <!-- LEFT -->
  <div class="assessment-type-header__main">

    <div
      class="assessment-type-header__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="3.5"
          width="14"
          height="17"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M9 3.5V3A1.5 1.5 0 0 1 10.5 1.5h3A1.5 1.5 0 0 1 15 3v.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8.5 8h7"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8.5 12h7"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8.5 16h4.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>


    <div class="assessment-type-header__content">

      <h1 class="assessment-type-header__title">
        Tipos de evaluación
      </h1>

      <p class="assessment-type-header__description">
        Administra los tipos de evaluación utilizados en los assessments.
      </p>

    </div>

  </div>


  <!-- RIGHT -->
  <div class="assessment-type-header__actions">

    <button
      type="button"
      class="assessment-type-header__create"
      (click)="onCreateAssessmentType()"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 5V19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M5 12H19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Nuevo tipo
      </span>

    </button>

  </div>

</header>
