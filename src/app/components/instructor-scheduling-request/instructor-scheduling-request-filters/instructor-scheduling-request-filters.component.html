<section class="scheduling-request-filters">
  <div class="scheduling-request-filters__search-row">
    <div class="scheduling-request-filters__field scheduling-request-filters__field--search">
      <label class="scheduling-request-filters__label" for="search-student">
        Buscar por nombre o correo (página actual)
      </label>

      <div class="scheduling-request-filters__search-wrapper">
        <span class="scheduling-request-filters__search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" />
            <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </span>

        <input
          id="search-student"
          type="text"
          class="scheduling-request-filters__search-input"
          placeholder="Buscar estudiante..."
          autocomplete="off"
          [ngModel]="searchName"
          [disabled]="loading"
          (ngModelChange)="onSearchChange($event)"
        />
      </div>
    </div>
  </div>

  <div class="scheduling-request-filters__filters-row">
    <div class="scheduling-request-filters__field">
      <label class="scheduling-request-filters__label" for="request-status">
        Estado
      </label>

      <div class="scheduling-request-filters__select-wrapper">
        <select
          id="request-status"
          class="scheduling-request-filters__select"
          [ngModel]="filterStatus"
          [disabled]="loading"
          (ngModelChange)="onStatusChange($event)"
        >
          <option value="">Todos</option>
          <option
            *ngFor="let option of statusOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="scheduling-request-filters__field" *ngIf="showKindFilter">
      <label class="scheduling-request-filters__label" for="request-kind">
        Tipo de solicitud
      </label>

      <div class="scheduling-request-filters__select-wrapper">
        <select
          id="request-kind"
          class="scheduling-request-filters__select"
          [ngModel]="filterKind"
          [disabled]="loading"
          (ngModelChange)="onKindChange($event)"
        >
          <option value="">Todos</option>
          <option
            *ngFor="let option of kindOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="scheduling-request-filters__field">
      <label class="scheduling-request-filters__label" for="request-sort">
        Ordenar por
      </label>

      <div class="scheduling-request-filters__select-wrapper">
        <select
          id="request-sort"
          class="scheduling-request-filters__select"
          [ngModel]="sortBy"
          [disabled]="loading"
          (ngModelChange)="onSortByChange($event)"
        >
          <option
            *ngFor="let option of sortByOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="scheduling-request-filters__field">
      <label class="scheduling-request-filters__label" for="date-field">
        Rango aplica a
      </label>

      <div class="scheduling-request-filters__select-wrapper">
        <select
          id="date-field"
          class="scheduling-request-filters__select"
          [ngModel]="dateField"
          [disabled]="loading || sessionTodayOnly"
          (ngModelChange)="onDateFieldChange($event)"
        >
          <option
            *ngFor="let option of dateFieldOptions"
            [ngValue]="option.value"
          >
            {{ option.label }}
          </option>
        </select>
      </div>
    </div>

    <div class="scheduling-request-filters__field">
      <label class="scheduling-request-filters__label" for="date-from">
        Desde
      </label>

      <div class="scheduling-request-filters__date-wrapper">
        <input
          id="date-from"
          type="date"
          class="scheduling-request-filters__date"
          [ngModel]="dateFrom"
          [disabled]="loading || sessionTodayOnly"
          (ngModelChange)="onFromDateChange($event)"
        />
      </div>
    </div>

    <div class="scheduling-request-filters__field">
      <label class="scheduling-request-filters__label" for="date-to">
        Hasta
      </label>

      <div class="scheduling-request-filters__date-wrapper">
        <input
          id="date-to"
          type="date"
          class="scheduling-request-filters__date"
          [ngModel]="dateTo"
          [disabled]="loading || sessionTodayOnly"
          (ngModelChange)="onToDateChange($event)"
        />
      </div>
    </div>

    <div class="scheduling-request-filters__actions">
      <button
        type="button"
        class="scheduling-request-filters__today"
        [class.scheduling-request-filters__today--active]="sessionTodayOnly"
        [disabled]="loading"
        (click)="onTodayClick()"
      >
        <span>Sesiones de hoy</span>
      </button>

      <button
        type="button"
        class="scheduling-request-filters__clear"
        [disabled]="loading || !hasActiveFilters"
        (click)="onClearFilters()"
      >
        <span>Limpiar filtros</span>
      </button>
    </div>
  </div>
</section>
