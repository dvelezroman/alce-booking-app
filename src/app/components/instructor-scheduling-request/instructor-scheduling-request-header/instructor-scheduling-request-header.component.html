<header class="scheduling-request-header">
  <div class="scheduling-request-header__information">
    <h1 class="scheduling-request-header__title">
      Solicitudes de agendamiento
    </h1>

    <p class="scheduling-request-header__description">
      Gestiona solicitudes de clases demo y exámenes de ubicación.
    </p>
  </div>

  <button
    type="button"
    class="scheduling-request-header__refresh"
    [disabled]="loading"
    (click)="onRefresh()"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      [class.scheduling-request-header__refresh-icon--loading]="loading"
    >
      <path
        d="M20 6v5h-5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M4 18v-5h5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M5.8 9A7 7 0 0 1 18.5 6M18.2 15A7 7 0 0 1 5.5 18"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>

    <span>{{ loading ? 'Actualizando...' : 'Actualizar' }}</span>
  </button>
</header>
