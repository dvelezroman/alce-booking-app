<header class="notifications-header">

  <div class="notifications-header__content">

    <!-- ICON -->
    <div
      class="notifications-header__icon"
      aria-hidden="true"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M18 8A6 6 0 0 0 6 8c0 7-3 7-3 9h18c0-2-3-2-3-9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M13.73 21a2 2 0 0 1-3.46 0"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <!-- INFORMATION -->
    <div class="notifications-header__information">

      <h1 class="notifications-header__title">
        Configuración de Notificaciones
      </h1>

      <p class="notifications-header__description">
        Gestiona tus preferencias de notificaciones push para mantenerte al día.
      </p>

    </div>

  </div>


  <!-- ACTION -->
  <button
    type="button"
    class="notifications-header__test-button"
    [disabled]="isLoading"
    (click)="onTestNotification()"
  >

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M20 12a8 8 0 1 1-2.34-5.66"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <path
        d="M20 4v5h-5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span>
      {{ isLoading ? 'Enviando...' : 'Probar notificación' }}
    </span>

  </button>

</header>
