<section class="resources-filters">

  <div class="resources-filters__grid">

    <!-- SEARCH -->
    <div class="resources-filters__field resources-filters__field--search">

      <label
        for="resource-search"
        class="resources-filters__label"
      >
        Buscar recurso
      </label>

      <div class="resources-filters__input-wrapper">

        <span
          class="resources-filters__input-icon"
          aria-hidden="true"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M16 16L20 20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <input
          id="resource-search"
          type="text"
          class="resources-filters__input"
          placeholder="Buscar por título..."
          [ngModel]="searchTerm"
          (ngModelChange)="onSearchTermChange($event)"
          (keyup.enter)="onEnter()"
        />

      </div>

    </div>


    <!-- STATUS -->
    <div class="resources-filters__field resources-filters__field--status">

      <label
        for="resource-status"
        class="resources-filters__label"
      >
        Estado
      </label>

      <div class="resources-filters__select-wrapper">

        <select
          id="resource-status"
          class="resources-filters__select"
          [ngModel]="selectedStatus"
          (ngModelChange)="onStatusChange($event)"
        >
          <option value="all">
            Todos
          </option>

          <option value="active">
            Activos
          </option>

          <option value="inactive">
            Inactivos
          </option>
        </select>

        <span
          class="resources-filters__select-icon"
          aria-hidden="true"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M7 10L12 15L17 10"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

      </div>

    </div>


    <!-- ACTIONS -->
    <div class="resources-filters__actions">

      <button
        type="button"
        class="resources-filters__button resources-filters__button--clear"
        (click)="onClearFilters()"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M6 6L18 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M18 6L6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span>
          Limpiar
        </span>
      </button>


      <button
        type="button"
        class="resources-filters__button resources-filters__button--search"
        (click)="onSearch()"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M16 16L20 20"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

        <span>
          Buscar
        </span>
      </button>

    </div>

  </div>

</section>
