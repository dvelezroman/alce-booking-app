<section
  class="resources-table"
  [class.resources-table--menu-open]="openMenuId !== null"
>

  <div class="resources-table__desktop">

    <table class="resources-table__table">

      <thead>
        <tr>
          <th class="resources-table__column-number">
            #
          </th>

          <th class="resources-table__column-title">
            Título
          </th>

          <th class="resources-table__column-note">
            Nota
          </th>

          <th class="resources-table__column-url">
            URL
          </th>

          <th class="resources-table__column-actions">
            Acciones
          </th>
        </tr>
      </thead>


      <!-- LOADING -->
      <tbody *ngIf="isLoading">

        <tr
          *ngFor="let item of [1, 2, 3, 4]"
          class="resources-table__row"
        >
          <td>
            <span
              class="
                resources-table__skeleton
                resources-table__skeleton--number
              "
            ></span>
          </td>

          <td>
            <span
              class="
                resources-table__skeleton
                resources-table__skeleton--title
              "
            ></span>
          </td>

          <td>
            <span
              class="
                resources-table__skeleton
                resources-table__skeleton--note
              "
            ></span>
          </td>

          <td>
            <span
              class="
                resources-table__skeleton
                resources-table__skeleton--url
              "
            ></span>
          </td>

          <td>
            <span
              class="
                resources-table__skeleton
                resources-table__skeleton--button
              "
            ></span>
          </td>
        </tr>

      </tbody>


      <!-- DATA -->
      <tbody *ngIf="!isLoading">

        <tr
          *ngFor="
            let resource of paginatedResources;
            let i = index;
            trackBy: trackByResourceId
          "
          class="resources-table__row"
          [class.resources-table__row--menu-open]="
            isMenuOpen(resource.id)
          "
        >

          <!-- NUMBER -->
          <td class="resources-table__number">
            {{
              (currentPage - 1) *
              pageSize +
              i +
              1
            }}
          </td>


          <!-- TITLE -->
          <td>
            <span class="resources-table__title">
              {{ resource.title }}
            </span>
          </td>


          <!-- NOTE -->
          <td>
            <span class="resources-table__note">
              {{ getResourceNote(resource) }}
            </span>
          </td>


          <!-- URL -->
          <td>
            <a
              class="resources-table__link"
              [href]="resource.link"
              target="_blank"
              rel="noopener noreferrer"
              [title]="resource.link"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M10.6 13.4a4 4 0 0 0 5.66 0l2.14-2.14a4 4 0 0 0-5.66-5.66L11.5 6.84"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M13.4 10.6a4 4 0 0 0-5.66 0L5.6 12.74a4 4 0 1 0 5.66 5.66l1.23-1.23"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <span>
                {{ resource.link }}
              </span>
            </a>
          </td>


          <!-- ACTIONS -->
          <td class="resources-table__actions-cell">

            <div
              class="resources-table__actions"
              (click)="$event.stopPropagation()"
            >

              <button
                type="button"
                class="resources-table__menu-button"
                [class.resources-table__menu-button--active]="
                  isMenuOpen(resource.id)
                "
                aria-label="Opciones del recurso"
                [attr.aria-expanded]="
                  isMenuOpen(resource.id)
                "
                (click)="toggleMenu($event, resource.id)"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <circle cx="12" cy="5" r="1.7" />
                  <circle cx="12" cy="12" r="1.7" />
                  <circle cx="12" cy="19" r="1.7" />
                </svg>
              </button>


              <!-- MENU -->
              <div
                *ngIf="isMenuOpen(resource.id)"
                class="resources-table__menu"
                [class.resources-table__menu--up]="
                  shouldOpenMenuUp(i)
                "
                (click)="$event.stopPropagation()"
              >

                <button
                  type="button"
                  class="resources-table__menu-item"
                  (click)="onView($event, resource)"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />

                    <circle
                      cx="12"
                      cy="12"
                      r="2.5"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                  </svg>

                  <span>
                    Ver detalles
                  </span>
                </button>


                <button
                  type="button"
                  class="resources-table__menu-item"
                  (click)="onEdit($event, resource)"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />

                    <path
                      d="m13.8 8.2 3 3"
                      stroke="currentColor"
                      stroke-width="1.7"
                    />
                  </svg>

                  <span>
                    Editar
                  </span>
                </button>


                <button
                  type="button"
                  class="
                    resources-table__menu-item
                    resources-table__menu-item--danger
                  "
                  (click)="onDelete($event, resource)"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M4 7h16"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />

                    <path
                      d="M9 7V4h6v3"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linejoin="round"
                    />

                    <path
                      d="m7 7 1 13h8l1-13"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linejoin="round"
                    />

                    <path
                      d="M10 11v5M14 11v5"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                    />
                  </svg>

                  <span>
                    Eliminar
                  </span>
                </button>

              </div>

            </div>

          </td>

        </tr>

      </tbody>

    </table>


    <!-- EMPTY -->
    <div
      *ngIf="
        !isLoading &&
        resources.length === 0
      "
      class="resources-table__empty"
    >
      <div class="resources-table__empty-icon">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11a1 1 0 0 1 1 1v16a3 3 0 0 0-3-3H4V5.5Z"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13a1 1 0 0 0-1 1v16a3 3 0 0 1 3-3h5V5.5Z"
            stroke="currentColor"
            stroke-width="1.7"
          />
        </svg>
      </div>

      <strong>
        No hay recursos
      </strong>

      <span>
        No se encontraron recursos académicos.
      </span>
    </div>

  </div>


  <!-- =========================
       FOOTER / PAGINATION
  ========================== -->

  <footer
    *ngIf="
      !isLoading &&
      resources.length > 0
    "
    class="resources-table__footer"
  >

    <p class="resources-table__results">
      Mostrando
      <strong>{{ startItem }}</strong>
      a
      <strong>{{ endItem }}</strong>
      de
      <strong>{{ resources.length }}</strong>
      recursos
    </p>


    <div class="resources-table__pagination">

      <!-- PREVIOUS -->
      <button
        type="button"
        class="resources-table__pagination-button"
        [disabled]="currentPage === 1"
        aria-label="Página anterior"
        (click)="previousPage()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m15 18-6-6 6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>


      <!-- PAGE NUMBERS -->
      <button
        *ngFor="
          let page of visiblePages;
          trackBy: trackByPage
        "
        type="button"
        class="resources-table__page-button"
        [class.resources-table__page-button--active]="
          page === currentPage
        "
        [attr.aria-current]="
          page === currentPage
            ? 'page'
            : null
        "
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>


      <!-- NEXT -->
      <button
        type="button"
        class="resources-table__pagination-button"
        [disabled]="currentPage === totalPages"
        aria-label="Página siguiente"
        (click)="nextPage()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m9 18 6-6-6-6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

    </div>

  </footer>

</section>
