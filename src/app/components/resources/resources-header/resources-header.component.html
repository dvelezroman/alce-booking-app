<header class="resources-header">

  <div class="resources-header__main">

    <div
      class="resources-header__icon"
      aria-hidden="true"
    >
      <svg
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M4.5 5.5C4.5 4.39543 5.39543 3.5 6.5 3.5H10.2C11.1939 3.5 12 4.30609 12 5.3V19.5C12 18.1193 10.8807 17 9.5 17H4.5V5.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />

        <path
          d="M19.5 5.5C19.5 4.39543 18.6046 3.5 17.5 3.5H13.8C12.8061 3.5 12 4.30609 12 5.3V19.5C12 18.1193 13.1193 17 14.5 17H19.5V5.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />

        <path
          d="M7.5 7.5H9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M15 7.5H16.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </div>


    <div class="resources-header__content">
      <h1 class="resources-header__title">
        Recursos académicos
      </h1>

      <p class="resources-header__description">
        Administra los recursos académicos disponibles para los estudiantes.
      </p>
    </div>

  </div>


  <div class="resources-header__actions">

    <button
      type="button"
      class="resources-header__create-button"
      (click)="onCreateResource()"
    >
      <svg
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 5V19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

        <path
          d="M5 12H19"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Nuevo recurso
      </span>
    </button>

  </div>

</header>
