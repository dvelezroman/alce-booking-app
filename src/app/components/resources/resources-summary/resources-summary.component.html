<section
  class="resources-summary"
  aria-label="Resumen de recursos académicos"
>

  <!-- TOTAL RESOURCES -->
  <article class="resources-summary__card">

    <div
      class="
        resources-summary__icon
        resources-summary__icon--resources
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M4.5 5.5C4.5 4.4 5.4 3.5 6.5 3.5H10.2C11.2 3.5 12 4.3 12 5.3V19.5C12 18.1 10.9 17 9.5 17H4.5V5.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />

        <path
          d="M19.5 5.5C19.5 4.4 18.6 3.5 17.5 3.5H13.8C12.8 3.5 12 4.3 12 5.3V19.5C12 18.1 13.1 17 14.5 17H19.5V5.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="resources-summary__content">

      <span class="resources-summary__value">
        {{ totalResources }}
      </span>

      <span class="resources-summary__title">
        Total recursos
      </span>

      <span class="resources-summary__description">
        Recursos registrados
      </span>

    </div>

  </article>


  <!-- ACTIVE RESOURCES -->
  <article class="resources-summary__card">

    <div
      class="
        resources-summary__icon
        resources-summary__icon--active
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M8.5 12.2L10.8 14.5L15.8 9.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="resources-summary__content">

      <span class="resources-summary__value">
        {{ activeResources }}
      </span>

      <span class="resources-summary__title">
        Recursos activos
      </span>

      <span class="resources-summary__description">
        {{ activePercentage }}% del total
      </span>

    </div>

  </article>


  <!-- RESOURCES WITH LINK -->
  <article class="resources-summary__card">

    <div
      class="
        resources-summary__icon
        resources-summary__icon--links
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M10.6 13.4a4 4 0 0 0 5.66 0l2.14-2.14a4 4 0 0 0-5.66-5.66L11.5 6.84"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M13.4 10.6a4 4 0 0 0-5.66 0L5.6 12.74a4 4 0 1 0 5.66 5.66l1.23-1.23"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="resources-summary__content">

      <span class="resources-summary__value">
        {{ resourcesWithLink }}
      </span>

      <span class="resources-summary__title">
        Enlaces registrados
      </span>

      <span class="resources-summary__description">
        Recursos con URL
      </span>

    </div>

  </article>

</section>
