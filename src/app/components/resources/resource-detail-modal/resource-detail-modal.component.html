<div
  *ngIf="show && resource"
  class="resource-detail-modal"
  role="presentation"
  (click)="onBackdropClick()"
>

  <div
    class="resource-detail-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="resource-detail-title"
    (click)="stopPropagation($event)"
  >

    <!-- =========================
         HEADER
    ========================== -->

    <header class="resource-detail-modal__header">

      <div class="resource-detail-modal__header-main">

        <div
          class="resource-detail-modal__icon"
          aria-hidden="true"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M4.5 5.5C4.5 4.4 5.4 3.5 6.5 3.5H10.2C11.2 3.5 12 4.3 12 5.3V19.5C12 18.1 10.9 17 9.5 17H4.5V5.5Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />

            <path
              d="M19.5 5.5C19.5 4.4 18.6 3.5 17.5 3.5H13.8C12.8 3.5 12 4.3 12 5.3V19.5C12 18.1 13.1 17 14.5 17H19.5V5.5Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
        </div>


        <div class="resource-detail-modal__header-content">

          <h2
            id="resource-detail-title"
            class="resource-detail-modal__title"
          >
            Detalle del recurso
          </h2>

          <p class="resource-detail-modal__description">
            Información registrada del recurso académico.
          </p>

        </div>

      </div>


      <button
        type="button"
        class="resource-detail-modal__close"
        aria-label="Cerrar modal"
        (click)="onClose()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M6 6L18 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M18 6L6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- =========================
         BODY
    ========================== -->

    <div class="resource-detail-modal__body">

      <!-- TITLE -->
      <div class="resource-detail-modal__group">

        <span class="resource-detail-modal__label">
          Título
        </span>

        <div class="resource-detail-modal__value-row">

          <div
            class="
              resource-detail-modal__value-icon
              resource-detail-modal__value-icon--title
            "
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M5 5h14M5 10h14M5 15h8"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>

          <span class="resource-detail-modal__value">
            {{ resource.title }}
          </span>

        </div>

      </div>


      <!-- NOTE -->
      <div class="resource-detail-modal__group">

        <span class="resource-detail-modal__label">
          Nota
        </span>

        <div class="resource-detail-modal__value-row">

          <div
            class="
              resource-detail-modal__value-icon
              resource-detail-modal__value-icon--note
            "
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M8 9h8M8 13h8M8 17h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </div>

          <span
            class="
              resource-detail-modal__value
              resource-detail-modal__value--secondary
            "
          >
            {{ resourceNote }}
          </span>

        </div>

      </div>


      <!-- URL -->
      <div class="resource-detail-modal__group">

        <span class="resource-detail-modal__label">
          URL del recurso
        </span>

        <div
          class="
            resource-detail-modal__value-row
            resource-detail-modal__value-row--link
          "
        >

          <div
            class="
              resource-detail-modal__value-icon
              resource-detail-modal__value-icon--link
            "
            aria-hidden="true"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M10.6 13.4a4 4 0 0 0 5.66 0l2.14-2.14a4 4 0 0 0-5.66-5.66L11.5 6.84"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="M13.4 10.6a4 4 0 0 0-5.66 0L5.6 12.74a4 4 0 1 0 5.66 5.66l1.23-1.23"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>


          <a
            class="resource-detail-modal__link"
            [href]="resource.link"
            target="_blank"
            rel="noopener noreferrer"
            [title]="resource.link"
          >
            <span>
              {{ resource.link }}
            </span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M14 5h5v5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="M10 14 19 5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

              <path
                d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>

        </div>

      </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="resource-detail-modal__footer">

      <button
        type="button"
        class="resource-detail-modal__button"
        (click)="onClose()"
      >
        Cerrar
      </button>

    </footer>

  </div>

</div>
