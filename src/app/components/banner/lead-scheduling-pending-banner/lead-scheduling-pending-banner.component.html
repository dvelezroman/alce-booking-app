<div class="lead-pending-banner" *ngIf="visible && count > 0">
  <div class="bubble" (click)="goToRequests()" style="cursor: pointer;">
    <span class="bell">🔔</span>
    <span>{{ message }}</span>
    <button type="button" class="close" (click)="close(); $event.stopPropagation()" aria-label="Cerrar">
      &times;
    </button>
  </div>
</div>
