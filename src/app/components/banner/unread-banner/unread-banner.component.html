<div class="unread-banner" *ngIf="visible">
  <div class="unread-banner__card">

    <!-- BARRA DE TIEMPO -->
    <div class="unread-banner__timer"></div>

    <!-- ICONO -->
    <button
      type="button"
      class="unread-banner__icon"
      (click)="goToNotifications()"
      aria-label="Ver notificaciones"
    >
      <span class="unread-banner__bell">🔔</span>

      <span class="unread-banner__badge">
        {{ count > 9 ? '9+' : count }}
      </span>
    </button>

    <!-- TEXTO -->
    <div
      class="unread-banner__content"
      (click)="goToNotifications()"
    >
      <h3>
        Tienes
        <strong>{{ count }}</strong>
        mensaje{{ count === 1 ? '' : 's' }} no leído{{ count === 1 ? '' : 's' }}
      </h3>

      <p>
        Revisa tu bandeja de entrada para no perderte nada importante.
      </p>
    </div>

    <!-- ACCIONES DESKTOP -->
    <div class="unread-banner__actions">
      <button
        type="button"
        class="unread-banner__view"
        (click)="goToNotifications()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          />
          <path
            d="m4 7 8 6 8-6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>Ver mensajes</span>
      </button>

      <button
        type="button"
        class="unread-banner__close"
        (click)="close()"
        aria-label="Cerrar"
      >
        ×
      </button>
    </div>

    <!-- FLECHA MOBILE -->
    <button
      type="button"
      class="unread-banner__mobile-arrow"
      (click)="goToNotifications()"
      aria-label="Ver mensajes"
    >
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="m9 5 7 7-7 7"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

  </div>
</div>
