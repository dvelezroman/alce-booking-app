<section class="assessment-hours-config">

  <div class="assessment-hours-config__field">

    <label
      class="assessment-hours-config__label"
      for="assessment-min-hours"
    >
      Nuevas horas mínimas
    </label>

    <div class="assessment-hours-config__control">

      <input
        id="assessment-min-hours"
        type="number"
        min="1"
        step="1"
        class="assessment-hours-config__input"
        [class.assessment-hours-config__input--error]="
          value !== null &&
          isInvalid
        "
        [(ngModel)]="value"
        placeholder="Ej. 5"
      />

      <span class="assessment-hours-config__suffix">
        h/sem
      </span>

    </div>

    <span
      *ngIf="
        value !== null &&
        isInvalid
      "
      class="assessment-hours-config__error"
    >
      Ingresa al menos 1 hora semanal.
    </span>

  </div>


  <button
    type="button"
    class="assessment-hours-config__button"
    [disabled]="
      isInvalid ||
      !hasChanges ||
      isSaving
    "
    (click)="save()"
  >

    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M5 4h11l3 3v13H5V4Z"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
      />

      <path
        d="M8 4v6h8V4M8 20v-6h8v6"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linejoin="round"
      />
    </svg>

    <span>
      Guardar
    </span>

  </button>

</section>
