<div
  class="link-modal"
  (mousedown)="onBackdropClick($event)"
>
  <section
    class="link-modal__dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="link-modal-title"
  >

    <!-- =========================
         HEADER
    ========================== -->

    <header class="link-modal__header">

      <div class="link-modal__header-main">

        <span
          class="link-modal__header-icon"
          aria-hidden="true"
        >
          @if (isPasswordMode) {

            <!-- KEY -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                cx="8"
                cy="15"
                r="4"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="m11 12 7-7m-2 2 2 2m-5 1 2 2"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          } @else {

            <!-- LINK -->
            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m10 13.5 4-4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

              <path
                d="M8.8 15.2 7 17a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />

              <path
                d="M15.2 8.8 17 7a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>

          }
        </span>


        <div class="link-modal__heading">

          <h2
            id="link-modal-title"
            class="link-modal__title"
          >
            {{ title }}
          </h2>

          <p class="link-modal__description">
            {{ description }}
          </p>

        </div>

      </div>


      <button
        type="button"
        class="link-modal__close"
        aria-label="Cerrar"
        (click)="close()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M7 7 17 17M17 7 7 17"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- =========================
         FORM
    ========================== -->

    <form
      class="link-modal__form"
      (ngSubmit)="save()"
    >

      <div class="link-modal__body">


        <!-- =========================
             CREATE / EDIT
        ========================== -->

        @if (!isPasswordMode) {

          <!-- DESCRIPTION -->

          <div class="link-modal__field">

            <label
              for="link-description"
              class="link-modal__label"
            >
              Descripción

              <span class="link-modal__required">
                *
              </span>
            </label>

            <input
              id="link-description"
              type="text"
              name="description"
              class="link-modal__control"
              placeholder="Ej. Clases en vivo - General"
              [(ngModel)]="link.description"
              autocomplete="off"
              required
            />

            <span class="link-modal__hint">
              Nombre para identificar fácilmente el enlace.
            </span>

          </div>


          <!-- URL -->

          <div class="link-modal__field">

            <label
              for="link-url"
              class="link-modal__label"
            >
              Enlace

              <span class="link-modal__required">
                *
              </span>
            </label>


            <div class="link-modal__input-wrapper">

              <span
                class="link-modal__input-icon"
                aria-hidden="true"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="m10 13.5 4-4"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />

                  <path
                    d="M8.8 15.2 7 17a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />

                  <path
                    d="M15.2 8.8 17 7a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
              </span>

              <input
                id="link-url"
                type="url"
                name="link"
                class="
                  link-modal__control
                  link-modal__control--with-icon
                "
                placeholder="https://meet.google.com/..."
                [(ngModel)]="link.link"
                autocomplete="off"
                required
              />

            </div>

          </div>

        }


        <!-- =========================
             PASSWORD
        ========================== -->

        <div class="link-modal__field">

          <label
            for="link-password"
            class="link-modal__label"
          >
            Contraseña

            @if (!isPasswordMode) {
              <span class="link-modal__optional">
                Opcional
              </span>
            } @else {
              <span class="link-modal__required">
                *
              </span>
            }

          </label>


          <div class="link-modal__input-wrapper">

            <span
              class="link-modal__input-icon"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
              >
                <rect
                  x="5"
                  y="10"
                  width="14"
                  height="10"
                  rx="2.5"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <path
                  d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  d="M12 14v2"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </span>


            <input
              id="link-password"
              [type]="showPassword ? 'text' : 'password'"
              name="password"
              class="
                link-modal__control
                link-modal__control--with-icon
                link-modal__control--password
              "
              [placeholder]="
                isPasswordMode
                  ? 'Ingresa la nueva contraseña'
                  : 'Contraseña de la reunión'
              "
              [(ngModel)]="link.password"
              autocomplete="new-password"
              [required]="isPasswordMode"
            />


            <!-- SHOW / HIDE -->

            <button
              type="button"
              class="link-modal__password-toggle"
              [attr.aria-label]="
                showPassword
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              "
              (click)="togglePassword()"
            >

              @if (showPassword) {

                <!-- EYE OFF -->

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M3 3 21 21"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />

                  <path
                    d="M10.7 10.7a1.85 1.85 0 0 0 2.6 2.6"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />

                  <path
                    d="M9.4 5.3A9.7 9.7 0 0 1 12 5c5.2 0 8.5 5 8.5 5a12.7 12.7 0 0 1-2.3 2.8M6.2 6.2C4.4 7.5 3.5 10 3.5 10S6.8 15 12 15c1 0 1.9-.2 2.7-.5"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>

              } @else {

                <!-- EYE -->

                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M3.5 12S6.8 7 12 7s8.5 5 8.5 5-3.3 5-8.5 5-8.5-5-8.5-5Z"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="2.2"
                    stroke="currentColor"
                    stroke-width="1.7"
                  />
                </svg>

              }

            </button>

          </div>


          @if (isPasswordMode) {

            <span class="link-modal__hint">
              Ingresa la nueva contraseña para este enlace.
            </span>

          } @else {

            <span class="link-modal__hint">
              Déjala vacía si la reunión no requiere contraseña.
            </span>

          }

        </div>

      </div>


      <!-- =========================
           FOOTER
      ========================== -->

      <footer class="link-modal__footer">

        <button
          type="button"
          class="
            link-modal__button
            link-modal__button--secondary
          "
          (click)="close()"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="
            link-modal__button
            link-modal__button--primary
          "
          [disabled]="!canSave"
        >

          @if (isCreateMode) {

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M12 5v14M5 12h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>

          } @else if (isPasswordMode) {

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m7.5 12.5 3 3 6-7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          } @else {

            <svg
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m7.5 12.5 3 3 6-7"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          }

          <span>
            {{ saveLabel }}
          </span>

        </button>

      </footer>

    </form>

  </section>
</div>
