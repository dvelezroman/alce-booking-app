<header class="links-header">

  <!-- =========================
       INFORMATION
  ========================== -->

  <div class="links-header__information">

    <div class="links-header__title-row">

      <span
        class="links-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M10.6 13.4a4 4 0 0 0 5.65.05l2.2-2.2a4 4 0 0 0-5.65-5.65l-1.25 1.25"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M13.4 10.6a4 4 0 0 0-5.65-.05l-2.2 2.2a4 4 0 0 0 5.65 5.65l1.25-1.25"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <h1 class="links-header__title">
        Enlaces
      </h1>

    </div>

    <p class="links-header__description">
      Administra los enlaces de reuniones disponibles.
    </p>

  </div>


  <!-- =========================
       ACTION
  ========================== -->

  <div class="links-header__actions">

    <button
      type="button"
      class="links-header__create"
      (click)="onCreate()"
    >

      <span
        class="links-header__create-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Nuevo enlace
      </span>

    </button>

  </div>

</header>
