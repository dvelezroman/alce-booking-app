<section
  class="links-summary"
  aria-label="Resumen de enlaces"
>

  <!-- =========================
       TOTAL LINKS
  ========================== -->

  <article class="links-summary__card">

    <div
      class="
        links-summary__icon
        links-summary__icon--total
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M10.6 13.4a4 4 0 0 0 5.66 0l2.14-2.14a4 4 0 0 0-5.66-5.66L11.5 6.84"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M13.4 10.6a4 4 0 0 0-5.66 0L5.6 12.74a4 4 0 1 0 5.66 5.66l1.23-1.23"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="links-summary__content">

      <span class="links-summary__value">
        {{ totalLinks }}
      </span>

      <span class="links-summary__title">
        Total de enlaces
      </span>

      <span class="links-summary__description">
        Enlaces registrados
      </span>

    </div>

  </article>


  <!-- =========================
       WITH PASSWORD
  ========================== -->

  <article class="links-summary__card">

    <div
      class="
        links-summary__icon
        links-summary__icon--secure
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="10"
          width="14"
          height="10"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M8 10V7.5A4 4 0 0 1 12 3.5A4 4 0 0 1 16 7.5V10"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="15"
          r="1.3"
          fill="currentColor"
        />
      </svg>
    </div>


    <div class="links-summary__content">

      <span class="links-summary__value">
        {{ linksWithPassword }}
      </span>

      <span class="links-summary__title">
        Con contraseña
      </span>

      <span class="links-summary__description">
        {{ passwordCoveragePercentage }}% del total
      </span>

    </div>

  </article>


  <!-- =========================
       WITHOUT PASSWORD
  ========================== -->

  <article class="links-summary__card">

    <div
      class="
        links-summary__icon
        links-summary__icon--open
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="10"
          width="14"
          height="10"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M9 10V7.5A3.5 3.5 0 0 1 15.5 5.7"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <circle
          cx="12"
          cy="15"
          r="1.3"
          fill="currentColor"
        />
      </svg>
    </div>


    <div class="links-summary__content">

      <span class="links-summary__value">
        {{ linksWithoutPassword }}
      </span>

      <span class="links-summary__title">
        Sin contraseña
      </span>

      <span class="links-summary__description">
        Acceso sin contraseña
      </span>

    </div>

  </article>


  <!-- =========================
       LATEST LINK
  ========================== -->

  <article class="links-summary__card">

    <div
      class="
        links-summary__icon
        links-summary__icon--latest
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M12 7.5V12L15.5 14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="links-summary__content">

      <span
        class="
          links-summary__value
          links-summary__value--text
        "
        [title]="latestLinkDescription"
      >
        {{ latestLinkDescription }}
      </span>

      <span class="links-summary__title">
        Último registrado
      </span>

      <span class="links-summary__description">
        Enlace más reciente
      </span>

    </div>

  </article>

</section>
