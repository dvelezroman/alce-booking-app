<nav
  class="links-pagination"
  aria-label="Paginación de enlaces"
>

  <!-- =========================
       LIMIT
  ========================== -->

  <div class="links-pagination__limit">

    <span class="links-pagination__text">
      Mostrar
    </span>

    <div class="links-pagination__select-wrapper">

      <select
        class="links-pagination__select"
        [ngModel]="limit"
        (ngModelChange)="onLimitChange($event)"
        aria-label="Resultados por página"
      >
        @for (
          option of limitOptions;
          track option
        ) {
          <option [ngValue]="option">
            {{ option }}
          </option>
        }
      </select>

      <span
        class="links-pagination__select-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m7 9.5 5 5 5-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>

    </div>

    <span class="links-pagination__text">
      por página
    </span>

  </div>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <div class="links-pagination__navigation">

    <!-- FIRST -->
    <button
      type="button"
      class="links-pagination__button"
      [disabled]="!canPrev"
      aria-label="Primera página"
      title="Primera página"
      (click)="first()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m13 7-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="m18 7-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <!-- PREVIOUS -->
    <button
      type="button"
      class="links-pagination__button"
      [disabled]="!canPrev"
      aria-label="Página anterior"
      title="Página anterior"
      (click)="previous()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m14.5 7-5 5 5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <!-- PAGES -->
    @for (
      item of visiblePages;
      track $index
    ) {

      @if (item === 'ellipsis') {

        <span
          class="links-pagination__ellipsis"
          aria-hidden="true"
        >
          ···
        </span>

      } @else {

        <button
          type="button"
          class="links-pagination__button links-pagination__page"
          [class.links-pagination__page--active]="item === page"
          [attr.aria-current]="item === page ? 'page' : null"
          (click)="selectPage(item)"
        >
          {{ item }}
        </button>

      }

    }


    <!-- NEXT -->
    <button
      type="button"
      class="links-pagination__button"
      [disabled]="!canNext"
      aria-label="Página siguiente"
      title="Página siguiente"
      (click)="next()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m9.5 7 5 5-5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>


    <!-- LAST -->
    <button
      type="button"
      class="links-pagination__button"
      [disabled]="!canNext"
      aria-label="Última página"
      title="Última página"
      (click)="last()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m6 7 5 5-5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="m11 7 5 5-5 5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

  </div>


  <!-- =========================
       INFO
  ========================== -->

  <div class="links-pagination__info">
    {{ paginationLabel }}
  </div>

</nav>
