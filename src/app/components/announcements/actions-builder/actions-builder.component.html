<div class="actions-builder">

  <!-- HEADER -->
  <div class="actions-builder__header">
    <button class="actions-builder__add-btn" (click)="onAdd()">
      ➕ Agregar botón
    </button>
  </div>

  <!-- LIST -->
  <div *ngIf="actions.length > 0" class="actions-builder__list">

    <div
      *ngFor="let action of actions; trackBy: trackById"
      class="actions-builder__item box"
    >

      <!-- TYPE -->
      <div class="select">
        <select
          [value]="action.type"
          (change)="onUpdate(action.id, { type: $any($event.target).value })"
        >
          <option
            value="action"
            [disabled]="isTypeAlreadyUsed('action', action.id)"
          >
            Botón
          </option>

          <option
            value="whatsapp"
            [disabled]="isTypeAlreadyUsed('whatsapp', action.id)"
          >
            WhatsApp
          </option>

          <option
            value="close"
            [disabled]="isTypeAlreadyUsed('close', action.id)"
          >
            Cerrar
          </option>
        </select>
      </div>

      <!-- LABEL -->
      <input
        class="input actions-builder__input actions-builder__input--label"
        placeholder="Texto del botón"
        [value]="action.label"
        [disabled]="action.type === 'whatsapp' || action.type === 'close'"
        (input)="onUpdate(action.id, { label: $any($event.target).value })"
      />

      <!-- URL -->
      <input
        *ngIf="action.type === 'action' || action.type === 'whatsapp'"
        class="input actions-builder__input actions-builder__input--url"
        [placeholder]="action.type === 'whatsapp'
          ? 'Número o link WhatsApp'
          : 'https://... (opcional)'"
        [value]="action.url || ''"
        (input)="onUpdate(action.id, { url: $any($event.target).value })"
      />

      <!-- COLOR SOLO BOTÓN -->
      <div *ngIf="action.type === 'action'" class="select select-color">
        <select
          (change)="onColorChange(action.id, $any($event.target).value)"
        >
          <option value="blue">Azul</option>
          <option value="gray">Gris</option>
          <option value="gold">Dorado</option>
        </select>
      </div>

      <!-- DELAY -->
      <div class="select select-delay">
        <select
          [ngModel]="action.delaySeconds ?? ''"
          (ngModelChange)="onUpdate(action.id, { delaySeconds: $event })"
        >
          <option value="">Sin delay</option>

          <option *ngFor="let d of delayOptions" [ngValue]="d">
            {{ d }} segundos
          </option>
        </select>
      </div>

      <!-- REMOVE -->
      <button
        class="button is-light has-text-danger"
        (click)="onRemove(action.id)"
      >
        ✕
      </button>

    </div>

  </div>

</div>
