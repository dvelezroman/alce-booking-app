<div class="preview-card card">

  <!-- MEDIA SIEMPRE VISIBLE 🔥 -->
  <div class="preview-card__media">

    <!-- STATUS -->
    <div class="preview-card__status-top">
      <span
        class="tag preview-card__status"
        [ngClass]="isActive ? 'is-success' : 'is-light'"
      >
        {{ isActive ? 'Active' : 'Inactive' }}
      </span>
    </div>

    <!-- CLOSE -->
    <button *ngIf="hasClose()" class="preview-card__close">
      ✕
    </button>

    <!-- TITLE -->
    <div class="preview-card__title-overlay">
      {{ title || 'Untitled Announcement' }}
    </div>

    <!-- IMAGE -->
    <img
      *ngIf="media && !isYoutube() && !isVideoFile()"
      [src]="media"
      class="preview-card__image"
    />

    <!-- YOUTUBE -->
    <iframe
      *ngIf="media && isYoutube()"
      [src]="getYoutubeEmbedUrl()"
      class="preview-card__image"
      frameborder="0"
      allowfullscreen
    ></iframe>

    <!-- VIDEO -->
    <video
      *ngIf="media && isVideoFile() && !isYoutube()"
      [src]="media"
      class="preview-card__image"
      controls
      playsinline
    ></video>

  </div>

  <!-- ACTIONS -->
  <div *ngIf="actionButtons.length > 0" class="preview-card__actions">
    <button
      *ngFor="let action of actionButtons"
      class="button preview-card__button"
      [ngStyle]="getButtonStyle(action)"
    >
      {{
        action.type === 'whatsapp'
          ? 'WhatsApp'
          : (action.label || 'Acción')
      }}
    </button>
  </div>

</div>
