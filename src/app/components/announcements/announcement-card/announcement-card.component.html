<div
  *ngIf="announcement as a"
  class="announcement-card"
>
  <div class="announcement-card__media">
    <img
      *ngIf="
        announcement.mediaUrl &&
        !isYoutubeMedia &&
        !isGoogleDriveMedia &&
        !isVideoFile()
      "
      [src]="announcement.mediaUrl"
      [alt]="announcement.title || 'Imagen del anuncio'"
      class="announcement-card__media-element"
    />

    <div
      *ngIf="
        announcement.mediaUrl &&
        isYoutubeMedia &&
        safeEmbedUrl
      "
      class="announcement-card__video-preview"
    >
      <iframe
        [src]="safeEmbedUrl"
        class="announcement-card__iframe"
        title="Video de YouTube"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>

    <button
      *ngIf="
        announcement.mediaUrl &&
        isGoogleDriveMedia
      "
      type="button"
      class="
        announcement-card__video-preview
        announcement-card__drive-preview
      "
      aria-label="Abrir video de Google Drive"
      title="Abrir video en Google Drive"
      (click)="openGoogleDriveVideo()"
    >
      <span class="announcement-card__drive-logo">
        <i class="fab fa-google-drive"></i>
      </span>

      <span class="announcement-card__drive-info">
        <strong>Video de Google Drive</strong>
        <small>Abrir reproductor</small>
      </span>

      <span class="announcement-card__drive-open">
        <i class="fas fa-arrow-up-right-from-square"></i>
      </span>
    </button>

    <div
      *ngIf="
        announcement.mediaUrl &&
        isVideoFile() &&
        !isYoutubeMedia &&
        !isGoogleDriveMedia
      "
      class="announcement-card__video-preview"
    >
      <video
        [src]="announcement.mediaUrl"
        class="announcement-card__media-element"
        controls
        playsinline
        preload="metadata"
      >
        Tu navegador no permite reproducir este video.
      </video>
    </div>

    <span
      class="announcement-card__status"
      [class.is-active]="announcement.isActive"
      [class.is-inactive]="!announcement.isActive"
    >
      <span class="announcement-card__status-dot"></span>

      {{ announcement.isActive ? 'Activo' : 'Inactivo' }}
    </span>
  </div>

  <div class="announcement-card__body">
    <div class="announcement-card__heading">
      <div class="announcement-card__heading-content">
        <h3
          class="announcement-card__title"
          [title]="a.title || 'Anuncio sin título'"
        >
          {{ a.title || 'Anuncio sin título' }}
        </h3>

        <p class="announcement-card__type">
          {{
            a.type === 'promotion'
              ? 'Promoción'
              : a.type === 'relocation'
                ? 'Cambio de ubicación'
                : 'Notificación'
          }}
        </p>
      </div>
    </div>

    <div class="announcement-card__badges">
      <span
        *ngIf="a.targetRole"
        class="announcement-card__badge"
        [title]="a.targetRole"
      >
        <i class="fas fa-user-shield"></i>

        <span class="announcement-card__badge-text">
          {{ a.targetRole }}
        </span>
      </span>

      <span
        *ngIf="a.targetStudentType"
        class="announcement-card__badge"
        [title]="a.targetStudentType"
      >
        <i class="fas fa-users"></i>

        <span class="announcement-card__badge-text">
          {{ a.targetStudentType }}
        </span>
      </span>

      <span
        *ngIf="a.city"
        class="announcement-card__badge"
        [title]="a.city"
      >
        <i class="fas fa-location-dot"></i>

        <span class="announcement-card__badge-text">
          {{ a.city }}
        </span>
      </span>

      <span
        *ngIf="
          !a.targetRole &&
          !a.targetStudentType &&
          !a.city
        "
        class="
          announcement-card__badge
          announcement-card__badge--general
        "
      >
        <i class="fas fa-earth-americas"></i>

        <span class="announcement-card__badge-text">
          Público general
        </span>
      </span>
    </div>

    <div class="announcement-card__footer">
      <label class="announcement-card__toggle">
        <input
          type="checkbox"
          [checked]="a.isActive"
          (change)="onToggle()"
        />

        <span class="announcement-card__toggle-control">
          <span class="announcement-card__toggle-thumb"></span>
        </span>

        <span
          class="announcement-card__toggle-label"
          [class.is-inactive]="!a.isActive"
        >
          {{ a.isActive ? 'Publicado' : 'Desactivado' }}
        </span>
      </label>

      <div class="announcement-card__buttons">
        <button
          type="button"
          class="
            announcement-card__action-button
            announcement-card__action-button--edit
          "
          aria-label="Editar anuncio"
          title="Editar anuncio"
          (click)="onEdit()"
        >
          <i class="fas fa-pen"></i>
        </button>

        <button
          type="button"
          class="
            announcement-card__action-button
            announcement-card__action-button--delete
          "
          aria-label="Eliminar anuncio"
          title="Eliminar anuncio"
          (click)="onDelete()"
        >
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
