<section class="announcement-v2-actions">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="announcement-v2-actions__header">

    <div class="announcement-v2-actions__heading">

      <span
        class="announcement-v2-actions__heading-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="7"
            cy="7"
            r="2.2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <circle
            cx="17"
            cy="7"
            r="2.2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <circle
            cx="7"
            cy="17"
            r="2.2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9.2 7h5.6M7 9.2v5.6M9 17h5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <rect
            x="15"
            y="15"
            width="4"
            height="4"
            rx="1"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
      </span>


      <div>

        <h3>
          5. Botones de acción
        </h3>

        <p>
          Define las acciones disponibles en el anuncio.
        </p>

      </div>

    </div>


    <span class="announcement-v2-actions__limit">
      Máx. {{ maxActions }} botones
    </span>

  </header>


  <!-- =====================================================
       LIST
  ====================================================== -->

  <div
    *ngIf="actions.length > 0; else emptyActions"
    class="announcement-v2-actions__list"
  >

    <article
      *ngFor="
        let action of actions;
        trackBy: trackById
      "
      class="announcement-v2-actions__item"
    >

      <!-- ===============================================
           ITEM HEADER
      ================================================ -->

      <div class="announcement-v2-actions__item-header">

        <div class="announcement-v2-actions__item-main">

          <span
            class="announcement-v2-actions__action-icon"
            [ngClass]="
              getActionIconClass(
                action.type
              )
            "
            [style.background]="
              action.type === 'action'
                ? getCurrentColor(action)
                : null
            "
            aria-hidden="true"
          >

            <!-- ACTION -->

            <svg
              *ngIf="
                action.type === 'action'
              "
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M5 12h14"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />

              <path
                d="m14 7 5 5-5 5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>


            <!-- WHATSAPP -->

            <svg
              *ngIf="
                action.type === 'whatsapp'
              "
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M19.7 11.8a7.7 7.7 0 0 1-11.4 6.8L4 20l1.4-4.1A7.7 7.7 0 1 1 19.7 11.8Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />

              <path
                d="M9 8.5c.3 2.9 2.3 4.9 5.2 5.2"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>


            <!-- CLOSE -->

            <svg
              *ngIf="
                action.type === 'close'
              "
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m7 7 10 10M17 7 7 17"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>

          </span>


          <div class="announcement-v2-actions__item-content">

            <strong>
              {{
                action.label ||
                getTypeLabel(
                  action.type
                )
              }}
            </strong>


            <span>

              {{
                getActionDescription(
                  action
                )
              }}

              <ng-container
                *ngIf="
                  action.type !== 'close' &&
                  action.color
                "
              >
                · Color:
                {{ action.color }}
              </ng-container>

            </span>

          </div>

        </div>


        <button
          type="button"
          class="announcement-v2-actions__delete"
          title="Eliminar botón"
          aria-label="Eliminar botón"
          (click)="onRemove(action.id)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 7h16"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

            <path
              d="M9 4h6l1 3H8l1-3Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />

            <path
              d="m7 7 .7 13h8.6L17 7"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />

            <path
              d="M10 11v5M14 11v5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>

      </div>


      <!-- ===============================================
           CONFIG
      ================================================ -->

      <div class="announcement-v2-actions__config">

        <!-- TYPE -->

        <div class="announcement-v2-actions__field">

          <label>
            Tipo
          </label>


          <div class="announcement-v2-actions__select-wrapper">

            <select
              #typeSelect
              [value]="action.type"
              (change)="
                onTypeChange(
                  action,
                  typeSelect.value
                )
              "
            >

              <option
                value="action"
                [disabled]="
                  isTypeAlreadyUsed(
                    'action',
                    action.id
                  )
                "
              >
                Acción
              </option>

              <option
                value="whatsapp"
                [disabled]="
                  isTypeAlreadyUsed(
                    'whatsapp',
                    action.id
                  )
                "
              >
                WhatsApp
              </option>

              <option
                value="close"
                [disabled]="
                  isTypeAlreadyUsed(
                    'close',
                    action.id
                  )
                "
              >
                Cerrar
              </option>

            </select>


            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="m7 9 5 5 5-5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </div>

        </div>


        <!-- LABEL -->

        <div class="announcement-v2-actions__field">

          <label>
            Texto del botón
          </label>

          <input
            #labelInput
            type="text"
            [value]="action.label"
            [disabled]="
              action.type === 'whatsapp' ||
              action.type === 'close'
            "
            placeholder="Texto del botón"
            (input)="
              onLabelChange(
                action.id,
                labelInput.value
              )
            "
          />

        </div>


        <!-- URL / PHONE -->

        <div
          *ngIf="
            action.type !== 'close'
          "
          class="
            announcement-v2-actions__field
            announcement-v2-actions__field--wide
          "
        >

          <label>
            {{
              action.type === 'whatsapp'
                ? 'Número de WhatsApp'
                : 'Enlace'
            }}
          </label>


          <input
            #urlInput
            [type]="
              action.type === 'whatsapp'
                ? 'tel'
                : 'url'
            "
            [value]="action.url || ''"
            [placeholder]="
              action.type === 'whatsapp'
                ? 'Ej. 0999999999'
                : 'https://...'
            "
            (input)="
              onUrlChange(
                action.id,
                urlInput.value
              )
            "
          />

        </div>


        <!-- COLOR -->

        <div
          *ngIf="
            action.type === 'action'
          "
          class="announcement-v2-actions__field"
        >

          <label>
            Color
          </label>


          <div class="announcement-v2-actions__select-wrapper">

            <select
              #colorSelect
              [value]="action.color || '#28336f'"
              (change)="
                onColorChange(
                  action.id,
                  colorSelect.value
                )
              "
            >

              <option
                *ngFor="
                  let option of colorOptions
                "
                [value]="option.value"
              >
                {{ option.label }}
              </option>

            </select>


            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="m7 9 5 5 5-5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </div>

        </div>


        <!-- DELAY -->

        <div
          *ngIf="
            action.type !== 'close'
          "
          class="announcement-v2-actions__field"
        >

          <label>
            Retraso
          </label>


          <div class="announcement-v2-actions__select-wrapper">

            <select
              #delaySelect
              [value]="
                action.delaySeconds || 0
              "
              (change)="
                onDelayChange(
                  action.id,
                  delaySelect.value
                )
              "
            >

              <option value="0">
                Sin retraso
              </option>

              <option
                *ngFor="
                  let delay of delayOptions
                "
                [value]="delay"
              >
                {{ delay }} segundos
              </option>

            </select>


            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="m7 9 5 5 5-5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </div>

        </div>

      </div>

    </article>

  </div>


  <!-- =====================================================
       EMPTY
  ====================================================== -->

  <ng-template #emptyActions>

    <div class="announcement-v2-actions__empty">

      <span
        class="announcement-v2-actions__empty-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <strong>
        Sin botones
      </strong>

      <span>
        Agrega una acción para el anuncio.
      </span>

    </div>

  </ng-template>


  <!-- =====================================================
       ADD
  ====================================================== -->

  <button
    type="button"
    class="announcement-v2-actions__add-button"
    [disabled]="!canAddAction"
    (click)="onAdd()"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M12 5v14M5 12h14"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>

    <span>
      {{
        canAddAction
          ? 'Agregar botón'
          : 'Máximo de botones alcanzado'
      }}
    </span>

  </button>

</section>
