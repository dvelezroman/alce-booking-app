<div class="results-list">

  <div
    class="item"
    *ngFor="let item of progressList"
    (click)="toggleSelection(item)"
    [class.selected]="isSelected(item.studentId)"
  >

    <!-- Nombre -->
    <div class="student-name">
      {{ item.student.user?.firstName }} {{ item.student.user?.lastName }}
    </div>

    <!-- Fecha subida de stage -->
    <div class="stage-entry-date">
      <ng-container *ngIf="item.stageEntryDate">
        <i class="fa-solid fa-arrow-up"></i>
        {{ item.stageEntryDate | date:'mediumDate':'UTC' }}
      </ng-container>
    </div>

    <!-- Evaluaciones -->
    <div class="pending">

      <!-- Grammar -->
      <div class="assessment-block">

      <div class="assessment-hover">

        <span
          class="badge"
          [class.success]="getAssessmentStatus(item, 'Grammar') === 'approved'"
          [class.danger]="getAssessmentStatus(item, 'Grammar') === 'pending'"
        >
          Grammar
        </span>

        <!-- Tooltip -->
        <div
          class="assessment-tooltip"
          *ngIf="latestAssessmentMap.get(item.studentId) as last"
        >
          {{ last.createdAt | date:'medium':'UTC' }}
        </div>

      </div>

      <!-- Fecha corta -->
      <div
        class="assessment-assigned-date"
        *ngIf="latestAssessmentMap.get(item.studentId) as last"
      >
        {{ last.createdAt | date:'mediumDate':'UTC' }}
      </div>

    </div>

      <!-- Speaking -->
      <span
        class="badge"
        [class.success]="getAssessmentStatus(item, 'Speaking') === 'approved'"
        [class.danger]="getAssessmentStatus(item, 'Speaking') === 'pending'"
      >
        Speaking
      </span>

    </div>

    <!-- Barra -->
    <div class="progress-bar">
      <div
        class="fill"
        [style.width.%]="item.progress"
        [style.background]="getColor(item.progress)"
      ></div>
      <span class="percent">{{ item.progress }}%</span>
    </div>

  </div>

</div>
