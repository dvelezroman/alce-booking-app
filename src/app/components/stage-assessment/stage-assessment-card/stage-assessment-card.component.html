<div class="assessment-card"
     [class.selected-card]="highlighted"
     [class.expired-card]="assessment.isPastDue"
     [class.urgent-card]="isUrgent && !assessment.isPastDue">

  <div class="header-row">
    <h3 class="title">
      {{ assessment.stageAssessmentResource?.description || 'Recurso sin título' }}
    </h3>

    <span
      class="status"
      [ngClass]="{
        'pending': !assessment.isPastDue,
        'expired': assessment.isPastDue
      }">
      {{ assessment.isPastDue ? 'Expirada' : 'Pendiente' }}
    </span>
  </div>

  <div class="info">
    <p>
      <strong>Fecha límite:</strong>
      {{ assessment.dueDate | date:'fullDate' }}
    </p>

    <p *ngIf="assessment.stage">
      <strong>Stage:</strong>
      {{ assessment.stage?.description || 'Sin etapa' }}
    </p>
  </div>

  <!-- NUEVA FILA COUNTDOWN + BOTÓN -->
  <div class="bottom-row">

    <div class="countdown-wrapper" *ngIf="!assessment.isPastDue">

      <span class="countdown-label">
        Tiempo restante:
      </span>

      <div class="countdown-badge" [class.urgent]="isUrgent">
        {{ timeFormatted }}
      </div>

    </div>

    <div class="actions">
      <button
        class="btn-open"
        [disabled]="assessment.isPastDue"
        (click)="handleOpenAndFinish()">
        {{ assessment.isPastDue ? 'Evaluación expirada' : 'Abrir evaluación' }}
      </button>
    </div>

  </div>

</div>
