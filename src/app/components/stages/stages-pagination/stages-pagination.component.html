<div class="stages-pagination">

  <!-- =====================
       RESULTS
  ====================== -->

  <div class="stages-pagination__results">

    {{ resultsLabel }}

  </div>


  <!-- =====================
       NAVIGATION
  ====================== -->

  @if (totalPages > 1) {

    <nav
      class="stages-pagination__navigation"
      aria-label="Paginación de stages"
    >

      <!-- PREVIOUS -->

      <button
        type="button"
        class="
          stages-pagination__button
          stages-pagination__button--arrow
        "
        [disabled]="!canPrev"
        aria-label="Página anterior"
        title="Página anterior"
        (click)="previous()"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m14 7-5 5 5 5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>


      <!-- PAGES -->

      @for (
        item of visiblePages;
        track $index
      ) {

        @if (item === 'ellipsis') {

          <span
            class="stages-pagination__ellipsis"
            aria-hidden="true"
          >
            ...
          </span>

        } @else {

          <button
            type="button"
            class="
              stages-pagination__button
              stages-pagination__page
            "
            [class.stages-pagination__page--active]="
              item === page
            "
            [attr.aria-current]="
              item === page
                ? 'page'
                : null
            "
            [attr.aria-label]="
              'Ir a página ' + item
            "
            (click)="selectPage(item)"
          >

            {{ item }}

          </button>

        }

      }


      <!-- NEXT -->

      <button
        type="button"
        class="
          stages-pagination__button
          stages-pagination__button--arrow
        "
        [disabled]="!canNext"
        aria-label="Página siguiente"
        title="Página siguiente"
        (click)="next()"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m10 7 5 5-5 5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>

    </nav>

  }

</div>
