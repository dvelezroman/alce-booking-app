<header class="stages-header">

  <!-- =========================
       INFORMATION
  ========================== -->

  <div class="stages-header__information">

    <div class="stages-header__title-row">

      <span
        class="stages-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m4 7 8-4 8 4-8 4-8-4Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="m6.5 10 5.5 2.8 5.5-2.8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="m6.5 14 5.5 2.8 5.5-2.8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>


      <h1 class="stages-header__title">
        Stages
      </h1>

    </div>


    <p class="stages-header__description">
      Gestiona las etapas del programa académico.
    </p>

  </div>


  <!-- =========================
       ACTION
  ========================== -->

  <div class="stages-header__actions">

    <button
      type="button"
      class="stages-header__create"
      (click)="onCreate()"
    >

      <span
        class="stages-header__create-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v14M5 12h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Nuevo stage
      </span>

    </button>

  </div>

</header>
