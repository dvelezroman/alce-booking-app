<div class="stages-table">

  <div class="stages-table__scroll">

    <table class="stages-table__table">

      <!-- =====================
           HEADER
      ====================== -->

      <thead>

        <tr>

          <th class="stages-table__index">
            #
          </th>

          <th>
            Número
          </th>

          <th>
            Descripción
          </th>

          <th class="stages-table__actions-column">
            Acciones
          </th>

        </tr>

      </thead>


      <!-- =====================
           BODY
      ====================== -->

      <tbody>

        @for (
          stage of stages;
          track stage.id;
          let i = $index
        ) {

          <tr>

            <!-- INDEX -->

            <td class="stages-table__index">

              {{ getRowNumber(i) }}

            </td>


            <!-- STAGE -->

            <td>

              <span class="stages-table__stage-badge">

                Stage
                {{ getStageNumber(stage) }}

              </span>

            </td>


            <!-- DESCRIPTION -->

            <td>

              <span class="stages-table__description">

                {{ getDescription(stage) }}

              </span>

            </td>


            <!-- ACTIONS -->

            <td class="stages-table__actions-column">

              <button
                type="button"
                class="stages-table__menu-trigger"
                [class.stages-table__menu-trigger--active]="
                  isMenuOpen(stage)
                "
                aria-label="Opciones del stage"
                title="Opciones"
                (click)="toggleMenu(stage, $event)"
              >

                <svg
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <circle
                    cx="12"
                    cy="5"
                    r="1.5"
                  />

                  <circle
                    cx="12"
                    cy="12"
                    r="1.5"
                  />

                  <circle
                    cx="12"
                    cy="19"
                    r="1.5"
                  />
                </svg>

              </button>


              <!-- =================
                   FLOATING MENU
              ================== -->

              @if (
                isMenuOpen(stage)
              ) {

                <div
                  class="stages-table__menu"
                  [style.top.px]="menuPosition.top"
                  [style.left.px]="menuPosition.left"
                  (click)="$event.stopPropagation()"
                >

                  <!-- EDIT -->

                  <button
                    type="button"
                    class="stages-table__menu-item"
                    (click)="edit(stage, $event)"
                  >

                    <span
                      class="
                        stages-table__menu-icon
                        stages-table__menu-icon--edit
                      "
                    >

                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M13.5 6.5 17.5 10.5M5 19l3.4-.7L18.3 8.4a1.5 1.5 0 0 0 0-2.1l-.6-.6a1.5 1.5 0 0 0-2.1 0L5.7 15.6 5 19Z"
                          stroke="currentColor"
                          stroke-width="1.7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>

                    </span>


                    <div class="stages-table__menu-content">

                      <span class="stages-table__menu-title">
                        Editar
                      </span>

                      <span class="stages-table__menu-description">
                        Modificar información
                      </span>

                    </div>

                  </button>


                  <div class="stages-table__menu-divider">
                  </div>


                  <!-- DELETE -->

                  <button
                    type="button"
                    class="
                      stages-table__menu-item
                      stages-table__menu-item--danger
                    "
                    (click)="delete(stage, $event)"
                  >

                    <span class="stages-table__menu-icon">

                      <svg
                        viewBox="0 0 24 24"
                        fill="none"
                      >
                        <path
                          d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"
                          stroke="currentColor"
                          stroke-width="1.7"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>

                    </span>


                    <div class="stages-table__menu-content">

                      <span class="stages-table__menu-title">
                        Eliminar
                      </span>

                      <span class="stages-table__menu-description">
                        Eliminar este stage
                      </span>

                    </div>

                  </button>

                </div>

              }

            </td>

          </tr>

        }

      </tbody>

    </table>

  </div>

</div>
