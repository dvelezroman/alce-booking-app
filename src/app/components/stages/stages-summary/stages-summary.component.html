<section
  class="stages-summary"
  aria-label="Resumen de stages"
>

  <!-- =========================
       TOTAL
  ========================== -->

  <article class="summary-card">

    <div
      class="
        summary-card__icon
        summary-card__icon--purple
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m12 3 8 4-8 4-8-4 8-4Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="m4 12 8 4 8-4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="m4 17 8 4 8-4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="summary-card__content">

      <span class="summary-card__label">
        Total de stages
      </span>

      <strong class="summary-card__value">
        {{ total }}
      </strong>

      <span class="summary-card__description">
        Etapas registradas
      </span>

    </div>

  </article>


  <!-- =========================
       ACTIVE
  ========================== -->

  <article class="summary-card">

    <div
      class="
        summary-card__icon
        summary-card__icon--green
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8.5"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="m8.5 12 2.2 2.2 4.8-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="summary-card__content">

      <span class="summary-card__label">
        Stages activos
      </span>

      <strong class="summary-card__value">
        {{ activeStages }}
      </strong>

      <span class="summary-card__description">
        {{ activePercentage }}% del total
      </span>

    </div>

  </article>


  <!-- =========================
       UPDATE
  ========================== -->

  <article class="summary-card">

    <div
      class="
        summary-card__icon
        summary-card__icon--yellow
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="8.5"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 7.5V12l3 2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="summary-card__content">

      <span class="summary-card__label">
        Última actualización
      </span>

      <strong
        class="
          summary-card__value
          summary-card__value--date
        "
      >
        Hoy, {{ lastUpdateTime }}
      </strong>

      <span class="summary-card__description">
        {{ lastUpdateDate }}
      </span>

    </div>

  </article>


  <!-- =========================
       PROGRESS
  ========================== -->

  <article class="summary-card">

    <div
      class="
        summary-card__icon
        summary-card__icon--purple
      "
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m4 16 5-5 4 3 7-8"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="summary-card__content">

      <span class="summary-card__label">
        Progreso promedio
      </span>

      <strong class="summary-card__value">
        {{ averageProgress }}%
      </strong>

      <span class="summary-card__description">
        Estudiantes avanzados
      </span>

    </div>

  </article>

</section>
