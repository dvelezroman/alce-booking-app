<header class="searching-user-header">

  <!-- =========================
       INFORMATION
  ========================== -->
  <div class="searching-user-header__information">

    <h1 class="searching-user-header__title">
      Gestión de usuarios
    </h1>

    <p class="searching-user-header__description">
      Busca, visualiza y administra usuarios del sistema
      (estudiantes, instructores y administradores).
    </p>

  </div>


  <!-- =========================
       ACTION
  ========================== -->
  <div class="searching-user-header__actions">

    <button
      type="button"
      class="searching-user-header__help"
      (click)="onHelpRequested()"
    >
      <span
        class="searching-user-header__help-icon"
        aria-hidden="true"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M9.8 9.3a2.4 2.4 0 0 1 4.6.9c0 1.8-2.4 2-2.4 3.6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <circle
            cx="12"
            cy="17"
            r="1"
            fill="currentColor"
          />
        </svg>
      </span>

      <span>
        Ayuda
      </span>
    </button>

  </div>

</header>
