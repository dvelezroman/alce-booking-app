<section class="searching-user-search-type">

  <!-- =========================
       STUDENT
  ========================== -->
  <button
    type="button"
    class="searching-user-search-type__option"
    [class.searching-user-search-type__option--active]="isActive('student')"
    (click)="selectForm('student')"
  >
    <span
      class="searching-user-search-type__icon"
      aria-hidden="true"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="7"
          r="3.5"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M5.5 20v-1.5A5.5 5.5 0 0 1 11 13h2a5.5 5.5 0 0 1 5.5 5.5V20"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="searching-user-search-type__content">
      <span class="searching-user-search-type__title">
        Buscar por estudiante
      </span>

      <span class="searching-user-search-type__description">
        Nombre, cédula o etapa
      </span>
    </span>
  </button>


  <!-- =========================
       USER
  ========================== -->
  <button
    type="button"
    class="searching-user-search-type__option"
    [class.searching-user-search-type__option--active]="isActive('user')"
    (click)="selectForm('user')"
  >
    <span
      class="searching-user-search-type__icon"
      aria-hidden="true"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="m4.5 7 7.5 6 7.5-6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <span class="searching-user-search-type__content">
      <span class="searching-user-search-type__title">
        Buscar por usuario
      </span>

      <span class="searching-user-search-type__description">
        Correo y rol
      </span>
    </span>
  </button>


  <!-- =========================
       CODE
  ========================== -->
  <button
    type="button"
    class="searching-user-search-type__option"
    [class.searching-user-search-type__option--active]="isActive('code')"
    (click)="selectForm('code')"
  >
    <span
      class="searching-user-search-type__icon"
      aria-hidden="true"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="3"
          y="5"
          width="18"
          height="14"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <circle
          cx="8"
          cy="10"
          r="2"
          stroke="currentColor"
          stroke-width="1.5"
        />

        <path
          d="M5.5 15.5c.6-1.7 1.6-2.5 2.5-2.5s1.9.8 2.5 2.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />

        <path
          d="M13 9h5M13 12h5M13 15h3"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <span class="searching-user-search-type__content">
      <span class="searching-user-search-type__title">
        Buscar por código
      </span>

      <span class="searching-user-search-type__description">
        Cédula / Código
      </span>
    </span>
  </button>

</section>
