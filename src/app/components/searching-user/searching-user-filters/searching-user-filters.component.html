<section class="searching-user-filters">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="searching-user-filters__header">
    <span class="searching-user-filters__header-text">
      Filtros para:
    </span>

    <span class="searching-user-filters__header-value">
      {{ filterLabel }}
    </span>
  </div>


  <!-- =========================
       STUDENT FILTERS
  ========================== -->

  @if (currentForm === 'student') {
    <form
      class="searching-user-filters__form"
      [formGroup]="studentForm"
      (ngSubmit)="onSearch()"
    >
      <div class="searching-user-filters__fields">

        <!-- NOMBRES -->
        <div class="searching-user-filters__field">
          <label
            for="student-first-name"
            class="searching-user-filters__label"
          >
            Nombres o apellidos
          </label>

          <div class="searching-user-filters__input-wrapper">
            <span
              class="searching-user-filters__input-icon"
              aria-hidden="true"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
              >
                <circle
                  cx="12"
                  cy="8"
                  r="3.5"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <path
                  d="M5.5 20v-1.5A5.5 5.5 0 0 1 11 13h2a5.5 5.5 0 0 1 5.5 5.5V20"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            </span>

            <input
              id="student-first-name"
              type="text"
              formControlName="firstName"
              class="searching-user-filters__input"
              placeholder="Nombres"
              autocomplete="off"
            />
          </div>
        </div>


        <!-- ETAPA -->
        <div class="searching-user-filters__field">
          <label
            for="student-stage"
            class="searching-user-filters__label"
          >
            Etapa
          </label>

          <div class="searching-user-filters__select-wrapper">
            <select
              id="student-stage"
              formControlName="stageId"
              class="searching-user-filters__select"
            >
              <option value="">
                Seleccionar etapa
              </option>

              @for (stage of stages; track stage.id) {
                <option [value]="stage.id">
                  {{ stage.number }}
                </option>
              }
            </select>

            <span
              class="searching-user-filters__select-icon"
              aria-hidden="true"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="m6 9 6 6 6-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>

      </div>


      <!-- ACTIONS -->
      <div class="searching-user-filters__actions">
        <button
          type="button"
          class="searching-user-filters__clear"
          (click)="clearFilters()"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 7v5h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.5 11a7 7 0 1 1 1.8 6.6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Limpiar</span>
        </button>

        <button
          type="submit"
          class="searching-user-filters__search"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m16 16 4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Buscar</span>
        </button>
      </div>
    </form>
  }


  <!-- =========================
       USER FILTERS
  ========================== -->

  @if (currentForm === 'user') {
    <form
      class="searching-user-filters__form"
      [formGroup]="userForm"
      (ngSubmit)="onSearch()"
    >
      <div class="searching-user-filters__fields">

        <!-- EMAIL -->
        <div class="searching-user-filters__field">
          <label
            for="user-email"
            class="searching-user-filters__label"
          >
            Usuario (inicio de sesión)
          </label>

          <div class="searching-user-filters__input-wrapper">
            <span
              class="searching-user-filters__input-icon"
              aria-hidden="true"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <path
                  d="m4.5 7 7.5 6 7.5-6"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>

            <input
              id="user-email"
              type="text"
              formControlName="email"
              class="searching-user-filters__input"
              placeholder="Usuario"
              autocomplete="off"
            />
          </div>
        </div>


        <!-- ROLE -->
        <div class="searching-user-filters__field">
          <label
            for="user-role"
            class="searching-user-filters__label"
          >
            Rol
          </label>

          <div class="searching-user-filters__select-wrapper">
            <select
              id="user-role"
              formControlName="role"
              class="searching-user-filters__select"
            >
              <option value="">
                Seleccionar rol
              </option>

              @for (role of roles; track role) {
                <option [value]="role">
                  @switch (role) {
                    @case ('STUDENT') {
                      Estudiante
                    }

                    @case ('INSTRUCTOR') {
                      Instructor
                    }

                    @case ('ADMIN') {
                      Administrador
                    }

                    @default {
                      {{ role }}
                    }
                  }
                </option>
              }
            </select>

            <span
              class="searching-user-filters__select-icon"
              aria-hidden="true"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="m6 9 6 6 6-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>

      </div>


      <!-- ACTIONS -->
      <div class="searching-user-filters__actions">
        <button
          type="button"
          class="searching-user-filters__clear"
          (click)="clearFilters()"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 7v5h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.5 11a7 7 0 1 1 1.8 6.6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Limpiar</span>
        </button>

        <button
          type="submit"
          class="searching-user-filters__search"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m16 16 4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Buscar</span>
        </button>
      </div>
    </form>
  }


  <!-- =========================
       CODE FILTER
  ========================== -->

  @if (currentForm === 'code') {
    <form
      class="searching-user-filters__form"
      [formGroup]="codeForm"
      (ngSubmit)="onSearch()"
    >
      <div class="searching-user-filters__fields">

        <!-- CODE -->
        <div class="searching-user-filters__field">
          <label
            for="student-code"
            class="searching-user-filters__label"
          >
            Código del estudiante
          </label>

          <div class="searching-user-filters__input-wrapper">
            <span
              class="searching-user-filters__input-icon"
              aria-hidden="true"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2"
                  stroke="currentColor"
                  stroke-width="1.7"
                />

                <circle
                  cx="8"
                  cy="10"
                  r="2"
                  stroke="currentColor"
                  stroke-width="1.5"
                />

                <path
                  d="M5.5 15.5c.6-1.7 1.6-2.5 2.5-2.5s1.9.8 2.5 2.5"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />

                <path
                  d="M13 9h5M13 12h5M13 15h3"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>

            <input
              id="student-code"
              type="text"
              formControlName="idNumber"
              class="searching-user-filters__input"
              placeholder="Ingrese código"
              autocomplete="off"
            />
          </div>
        </div>

      </div>


      <!-- ACTIONS -->
      <div class="searching-user-filters__actions">
        <button
          type="button"
          class="searching-user-filters__clear"
          (click)="clearFilters()"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 7v5h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.5 11a7 7 0 1 1 1.8 6.6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Limpiar</span>
        </button>

        <button
          type="submit"
          class="searching-user-filters__search"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="11"
              cy="11"
              r="6.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m16 16 4 4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <span>Buscar</span>
        </button>
      </div>
    </form>
  }

</section>
