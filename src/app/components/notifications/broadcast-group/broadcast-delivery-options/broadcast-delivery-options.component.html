<section class="broadcast-delivery-options">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="broadcast-delivery-options__header">

    <div class="broadcast-delivery-options__step">
      3
    </div>

    <div class="broadcast-delivery-options__heading">
      <h2 class="broadcast-delivery-options__title">
        Opciones de envío
      </h2>

      <p class="broadcast-delivery-options__description">
        Configura cuándo y por cuánto tiempo estará activa tu notificación
      </p>
    </div>

  </div>


  <!-- =========================
       OPTIONS GRID
  ========================== -->

  <div class="broadcast-delivery-options__grid">

    <!-- =====================================================
         DELIVERY
    ====================================================== -->

    <section class="broadcast-delivery-options__card">

      <header class="broadcast-delivery-options__card-header">

        <h3 class="broadcast-delivery-options__card-title">
          Envío
        </h3>

        <span
          class="broadcast-delivery-options__card-icon"
          aria-hidden="true"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3.5"
              y="5.5"
              width="17"
              height="15"
              rx="2.2"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M7 3.5v4M17 3.5v4M3.5 9.5h17"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

            <path
              d="M8 13h3M13 13h3M8 16.5h3"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </span>

      </header>


      <div class="broadcast-delivery-options__choices">

        <!-- SEND NOW -->

        <button
          type="button"
          class="broadcast-delivery-options__choice"
          [class.broadcast-delivery-options__choice--selected]="isSendNow"
          [disabled]="!isEnabled"
          (click)="selectDeliveryMode('now')"
        >

          <span
            class="broadcast-delivery-options__radio"
            aria-hidden="true"
          >
            <span
              *ngIf="isSendNow"
              class="broadcast-delivery-options__radio-dot"
            ></span>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Enviar ahora
            </strong>

            <small>
              La notificación se enviará inmediatamente
            </small>

          </span>

        </button>


        <!-- SCHEDULE -->

        <button
          type="button"
          class="broadcast-delivery-options__choice"
          [class.broadcast-delivery-options__choice--selected]="isScheduled"
          [disabled]="!isEnabled"
          (click)="selectDeliveryMode('scheduled')"
        >

          <span
            class="broadcast-delivery-options__radio"
            aria-hidden="true"
          >
            <span
              *ngIf="isScheduled"
              class="broadcast-delivery-options__radio-dot"
            ></span>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Programar envío
            </strong>

            <small>
              Elige fecha y hora para el envío
            </small>

          </span>

        </button>

      </div>


      <!-- SCHEDULE CONFIG -->

      <div
        *ngIf="isScheduled"
        class="broadcast-delivery-options__schedule"
      >

        <div class="broadcast-delivery-options__date-field">

          <label>
            Fecha
          </label>

          <input
            type="date"
            [ngModel]="scheduledDate"
            (ngModelChange)="onScheduledDateChange($event)"
          />

        </div>


        <div class="broadcast-delivery-options__date-field">

          <label>
            Hora
          </label>

          <input
            type="time"
            [ngModel]="scheduledTime"
            (ngModelChange)="onScheduledTimeChange($event)"
          />

        </div>

      </div>

    </section>


    <!-- =====================================================
         EXPIRATION
    ====================================================== -->

    <section class="broadcast-delivery-options__card">

      <header class="broadcast-delivery-options__card-header">

        <h3 class="broadcast-delivery-options__card-title">
          Expiración
        </h3>

        <span
          class="broadcast-delivery-options__card-icon"
          aria-hidden="true"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M7 3h10M7 21h10"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />

            <path
              d="M8 3c0 4 1.5 6 4 9-2.5 3-4 5-4 9M16 3c0 4-1.5 6-4 9 2.5 3 4 5 4 9"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

      </header>


      <div class="broadcast-delivery-options__choices">

        <!-- NO EXPIRATION -->

        <button
          type="button"
          class="broadcast-delivery-options__choice"
          [class.broadcast-delivery-options__choice--selected]="hasNoExpiration"
          [disabled]="!isEnabled"
          (click)="selectExpirationMode('none')"
        >

          <span
            class="broadcast-delivery-options__radio"
            aria-hidden="true"
          >
            <span
              *ngIf="hasNoExpiration"
              class="broadcast-delivery-options__radio-dot"
            ></span>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Sin expiración
            </strong>

            <small>
              La notificación no tendrá fecha límite
            </small>

          </span>

        </button>


        <!-- EXPIRATION -->

        <button
          type="button"
          class="broadcast-delivery-options__choice"
          [class.broadcast-delivery-options__choice--selected]="hasExpiration"
          [disabled]="!isEnabled"
          (click)="selectExpirationMode('defined')"
        >

          <span
            class="broadcast-delivery-options__radio"
            aria-hidden="true"
          >
            <span
              *ngIf="hasExpiration"
              class="broadcast-delivery-options__radio-dot"
            ></span>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Definir expiración
            </strong>

            <small>
              Establece fecha y hora de expiración
            </small>

          </span>

        </button>

      </div>


      <!-- EXPIRATION CONFIG -->

      <div
        *ngIf="hasExpiration"
        class="broadcast-delivery-options__schedule"
      >

        <div class="broadcast-delivery-options__date-field">

          <label>
            Fecha
          </label>

          <input
            type="date"
            [ngModel]="expirationDate"
            (ngModelChange)="onExpirationDateChange($event)"
          />

        </div>


        <div class="broadcast-delivery-options__date-field">

          <label>
            Hora
          </label>

          <input
            type="time"
            [ngModel]="expirationTime"
            (ngModelChange)="onExpirationTimeChange($event)"
          />

        </div>

      </div>

    </section>


    <!-- =====================================================
         ADVANCED
    ====================================================== -->

    <section class="broadcast-delivery-options__card">

      <header class="broadcast-delivery-options__card-header">

        <div class="broadcast-delivery-options__advanced-title">

          <span
            class="broadcast-delivery-options__advanced-icon"
            aria-hidden="true"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <circle
                cx="12"
                cy="12"
                r="3"
                stroke="currentColor"
                stroke-width="1.7"
              />

              <path
                d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21h-4v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3v-4h.05A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3h4v.05A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21v4h-.05A1.7 1.7 0 0 0 19.4 15Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </span>


          <h3 class="broadcast-delivery-options__card-title">
            Configuración avanzada
          </h3>

        </div>

      </header>


      <div class="broadcast-delivery-options__advanced-options">

        <!-- PERSISTENT -->

        <button
          type="button"
          class="broadcast-delivery-options__advanced-option"
          [class.broadcast-delivery-options__advanced-option--selected]="isPersistent"
          [disabled]="!isEnabled"
          (click)="togglePersistent()"
        >

          <span
            class="broadcast-delivery-options__checkbox"
            aria-hidden="true"
          >
            <svg
              *ngIf="isPersistent"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m5 12 4 4 10-10"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Notificación persistente
            </strong>

            <small>
              Mantener disponible en el sistema
            </small>

          </span>

        </button>


        <!-- DELETABLE -->

        <button
          type="button"
          class="broadcast-delivery-options__advanced-option"
          [class.broadcast-delivery-options__advanced-option--selected]="isDeletable"
          [disabled]="!isEnabled"
          (click)="toggleDeletable()"
        >

          <span
            class="broadcast-delivery-options__checkbox"
            aria-hidden="true"
          >
            <svg
              *ngIf="isDeletable"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m5 12 4 4 10-10"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Permitir eliminar
            </strong>

            <small>
              Los usuarios podrán eliminar esta notificación
            </small>

          </span>

        </button>


        <!-- TEMPORAL -->

        <button
          type="button"
          class="broadcast-delivery-options__advanced-option"
          [class.broadcast-delivery-options__advanced-option--selected]="isTemporal"
          [disabled]="!isEnabled"
          (click)="toggleTemporal()"
        >

          <span
            class="broadcast-delivery-options__checkbox"
            aria-hidden="true"
          >
            <svg
              *ngIf="isTemporal"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="m5 12 4 4 10-10"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>


          <span class="broadcast-delivery-options__choice-content">

            <strong>
              Notificación temporal
            </strong>

            <small>
              Activar configuración de temporalidad
            </small>

          </span>

        </button>

      </div>


      <!-- =================================================
           TEMPORAL CONFIG
      ================================================== -->

      <div
        *ngIf="isTemporal"
        class="broadcast-delivery-options__temporal"
      >

        <div class="broadcast-delivery-options__temporal-grid">

          <!-- WINDOW TYPE -->

          <div class="broadcast-delivery-options__temporal-field">

            <label>
              Tipo de ventana
            </label>

            <select
              [(ngModel)]="temporalWindowType"
              (ngModelChange)="selectTemporalWindowType($event)"
            >
              <option value="FIXED_DAYS">
                Días fijos
              </option>

              <option value="ROLLING">
                Ventana móvil
              </option>
            </select>

          </div>


          <!-- WINDOW VALUE -->

          <div class="broadcast-delivery-options__temporal-field">

            <label>
              Duración
            </label>

            <div class="broadcast-delivery-options__number-wrapper">

              <input
                type="number"
                min="1"
                placeholder="Ej: 7"
                [ngModel]="temporalWindowValue"
                (ngModelChange)="onTemporalWindowValueChange($event)"
              />

              <span>
                días
              </span>

            </div>

          </div>

        </div>

      </div>

    </section>

  </div>

</section>
