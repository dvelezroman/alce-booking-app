<section class="broadcast-send-action">

  <!-- =========================
       HEADER
  ========================== -->

  <div class="broadcast-send-action__header">

    <div
      class="broadcast-send-action__icon"
      aria-hidden="true"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M21 3 9.5 14.5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="m21 3-7 18-4.5-6.5L3 10l18-7Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />
      </svg>
    </div>


    <div class="broadcast-send-action__heading">

      <h2 class="broadcast-send-action__title">
        Listo para enviar
      </h2>

      <p class="broadcast-send-action__description">
        Revisa la información y envía tu notificación
      </p>

    </div>

  </div>


  <!-- =========================
       VALIDATION
  ========================== -->

  <p
    *ngIf="!canSubmit && validationMessage"
    class="broadcast-send-action__validation"
  >
    {{ validationMessage }}
  </p>


  <!-- =========================
       SEND
  ========================== -->

  <button
    type="button"
    class="broadcast-send-action__button"
    [disabled]="isSubmitting"
    (click)="submit()"
  >

    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M21 3 9.5 14.5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <path
        d="m21 3-7 18-4.5-6.5L3 10l18-7Z"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linejoin="round"
      />
    </svg>


    <span>
      {{
        isSubmitting
          ? 'Enviando...'
          : 'Enviar notificación'
      }}
    </span>

  </button>

</section>
