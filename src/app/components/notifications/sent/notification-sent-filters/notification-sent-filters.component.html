<section class="notification-sent-filters">

  <div class="notification-sent-filters__dates">

    <label class="notification-sent-filters__field">
      <span class="notification-sent-filters__label">
        Desde
      </span>

      <div class="notification-sent-filters__input-wrapper">
        <input
          type="date"
          class="notification-sent-filters__input"
          [ngModel]="fromDate"
          (ngModelChange)="onFromDateChange($event)"
        />
      </div>
    </label>

    <label class="notification-sent-filters__field">
      <span class="notification-sent-filters__label">
        Hasta
      </span>

      <div class="notification-sent-filters__input-wrapper">
        <input
          type="date"
          class="notification-sent-filters__input"
          [ngModel]="toDate"
          (ngModelChange)="onToDateChange($event)"
        />
      </div>
    </label>

  </div>

  <div class="notification-sent-filters__actions">

    <button
      type="button"
      class="notification-sent-filters__button notification-sent-filters__button--clear"
      (click)="onClearFilters()"
    >
      <span
        class="notification-sent-filters__button-icon"
        aria-hidden="true"
        >
        <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
        >
            <path
            d="M3 12a9 9 0 1 0 3-6.7"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            />

            <path
            d="M3 4.5v5h5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            />
        </svg>
        </span>

      <span>
        Limpiar filtros
      </span>
    </button>

    <button
      type="button"
      class="notification-sent-filters__button notification-sent-filters__button--apply"
      (click)="onApplyFilters()"
    >
      <span
        class="notification-sent-filters__button-icon"
        aria-hidden="true"
      >
        <svg
          width="19"
          height="19"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m16 16 4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span>
        Aplicar filtros
      </span>
    </button>

  </div>

</section>
