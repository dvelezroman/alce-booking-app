<section class="notification-sent-header">

  <div class="notification-sent-header__main">

    <div
      class="notification-sent-header__icon"
      aria-hidden="true"
    >
      <svg
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M22 2L11 13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M22 2L15 22L11 13L2 9L22 2Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="notification-sent-header__content">
      <h1 class="notification-sent-header__title">
        Notificaciones enviadas
      </h1>

      <p class="notification-sent-header__description">
        Consulta el historial de todas las notificaciones que has enviado.
      </p>
    </div>

  </div>

  <button
    type="button"
    class="notification-sent-header__button"
    (click)="onCreateNotification()"
  >
    <span
      class="notification-sent-header__button-icon"
      aria-hidden="true"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M22 2L11 13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M22 2L15 22L11 13L2 9L22 2Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <span>
      Enviar nueva notificación
    </span>
  </button>

</section>
