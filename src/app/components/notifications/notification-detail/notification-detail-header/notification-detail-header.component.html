<header class="notification-detail-header">

  <div class="notification-detail-header__content">

    <div class="notification-detail-header__main">

      <div class="notification-detail-header__heading">

        <div
            class="notification-detail-header__icon"
            aria-hidden="true"
            >
            <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
            >
                <path
                d="M18 8.5C18 5.46 15.54 3 12.5 3C9.46 3 7 5.46 7 8.5V11.35C7 12.52 6.62 13.66 5.92 14.59L5 15.8C4.55 16.4 4.98 17.25 5.73 17.25H19.27C20.02 17.25 20.45 16.4 20 15.8L19.08 14.59C18.38 13.66 18 12.52 18 11.35V8.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                />

                <path
                d="M10 20C10.55 20.62 11.35 21 12.25 21C13.15 21 13.95 20.62 14.5 20"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                />
            </svg>
            </div>

        <div class="notification-detail-header__text">

          <h1 class="notification-detail-header__title">
            Detalle de notificación
          </h1>

          <p class="notification-detail-header__description">
            Consulta la información completa de la
            notificación seleccionada.
          </p>

        </div>

      </div>

      <button
        type="button"
        class="notification-detail-header__back-button"
        (click)="onBack()"
      >
        <i
          class="pi pi-arrow-left"
          aria-hidden="true"
        ></i>

        <span>
          Volver a Notificaciones
        </span>
      </button>

    </div>

    <div
      class="notification-detail-header__illustration"
      aria-hidden="true"
    >

      <svg
        viewBox="0 0 460 300"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <defs>

          <linearGradient
            id="notificationEnvelopeGradient"
            x1="145"
            y1="115"
            x2="320"
            y2="275"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#4694ff" />

            <stop
              offset="1"
              stop-color="#1467ee"
            />
          </linearGradient>

          <linearGradient
            id="notificationCardGradient"
            x1="190"
            y1="70"
            x2="300"
            y2="195"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#ffffff" />

            <stop
              offset="1"
              stop-color="#f5f8ff"
            />
          </linearGradient>

          <linearGradient
            id="notificationBellGradient"
            x1="320"
            y1="90"
            x2="370"
            y2="160"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#ffc34d" />

            <stop
              offset="1"
              stop-color="#ff9f1c"
            />
          </linearGradient>

          <filter
            id="notificationShadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%"
          >
            <feDropShadow
              dx="0"
              dy="14"
              stdDeviation="14"
              flood-color="#3478e5"
              flood-opacity=".18"
            />
          </filter>

        </defs>

        <circle
          cx="330"
          cy="145"
          r="112"
          fill="#eaf1ff"
        />

        <circle
          cx="330"
          cy="145"
          r="82"
          fill="#f4f7ff"
        />

        <circle
          cx="102"
          cy="78"
          r="6"
          fill="#8bb8ff"
        />

        <circle
          cx="388"
          cy="55"
          r="5"
          fill="#8bb8ff"
        />

        <circle
          cx="423"
          cy="132"
          r="5"
          fill="#8bb8ff"
        />

        <circle
          cx="410"
          cy="230"
          r="4"
          fill="#8bb8ff"
        />

        <circle
          cx="100"
          cy="222"
          r="4"
          fill="#8bb8ff"
        />

        <path
          d="M143 142
             L235 213
             L327 142
             V246
             C327 258
             318 267
             306 267
             H164
             C152 267
             143 258
             143 246
             Z"
          fill="url(#notificationEnvelopeGradient)"
          filter="url(#notificationShadow)"
        />

        <path
          d="M143 142
             L220 205
             C229 212
             241 212
             250 205
             L327 142"
          stroke="#8cb7ff"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M143 246
             L213 186"
          stroke="#3d8cff"
          stroke-width="6"
          stroke-linecap="round"
        />

        <path
          d="M327 246
             L257 186"
          stroke="#3d8cff"
          stroke-width="6"
          stroke-linecap="round"
        />

        <rect
          x="176"
          y="70"
          width="128"
          height="140"
          rx="20"
          fill="url(#notificationCardGradient)"
          stroke="#e3eaff"
          stroke-width="2"
          filter="url(#notificationShadow)"
        />

        <rect
          x="201"
          y="102"
          width="80"
          height="10"
          rx="5"
          fill="#bdd0f8"
        />

        <rect
          x="201"
          y="128"
          width="74"
          height="10"
          rx="5"
          fill="#cbd9f7"
        />

        <rect
          x="201"
          y="154"
          width="61"
          height="10"
          rx="5"
          fill="#d5e0f8"
        />

        <circle
          cx="339"
          cy="120"
          r="47"
          fill="#ffffff"
          filter="url(#notificationShadow)"
        />

        <path
          d="M339 91
             C328 91
             320 100
             320 111
             V125
             C320 132
             316 138
             311 143
             H367
             C362 138
             358 132
             358 125
             V111
             C358 100
             350 91
             339 91Z"
          fill="url(#notificationBellGradient)"
        />

        <path
          d="M329 148
             C331 156
             335 160
             339 160

             349 148"
          fill="#f29a14"
        />

        <circle
          cx="370"
          cy="73"

        />

        <text
          x="370"
          y="80"
          text-anchor="middle"
          fill="#ffffff"
          font-size="20"
          font-weight="700"
          font-family="Arial, sans-serif"
        >
          1
        </text>

        <path
          d="M89 178
             C72 198
             72 224
             91 243"
          stroke="#9dc1ff"
          stroke-width="3"
          stroke-linecap="round"
          stroke-dasharray="2 10"
        />

      </svg>

    </div>

  </div>

</header>
