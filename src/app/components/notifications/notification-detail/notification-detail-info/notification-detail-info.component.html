  <aside
    class="notification-detail-info"
    aria-labelledby="notification-detail-info-title"
  >

    <button
      type="button"
      class="notification-detail-info__header"
      [class.notification-detail-info__header--expanded]="
        isExpanded
      "
      [attr.aria-expanded]="isExpanded"
      aria-controls="notification-detail-info-list"
      (click)="toggleExpanded()"
    >

      <h2
        id="notification-detail-info-title"
        class="notification-detail-info__title"
      >
        Detalles de la notificación
      </h2>
      <svg
        class="notification-detail-info__arrow"
        [class.notification-detail-info__arrow--expanded]="
          isExpanded
        "
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >

        <path
          d="M6 9L12 15L18 9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>

    <dl
      id="notification-detail-info-list"
      class="notification-detail-info__list"
      [class.notification-detail-info__list--expanded]="
        isExpanded
      "
    >

    <!-- FECHA DE ENVÍO -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M7 3V6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M17 3V6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M4 9H20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <rect
              x="4"
              y="5"
              width="16"
              height="15"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </span>

        <dt>
          Fecha de envío
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        <ng-container *ngIf="createdAt; else noDate">
          <span>
            {{
              createdAt
                | date: 'd \'de\' MMMM \'de\' y'
            }}
          </span>

          <span>
            {{
              createdAt
                | date: 'hh:mm a'
            }}
          </span>
        </ng-container>

        <ng-template #noDate>
          <span>
            No disponible
          </span>
        </ng-template>
      </dd>
    </div>

    <!-- CATEGORÍA -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 5.5V10.2C4 10.73 4.21 11.24 4.59 11.61L12.39 19.41C13.17 20.19 14.44 20.19 15.22 19.41L19.41 15.22C20.19 14.44 20.19 13.17 19.41 12.39L11.61 4.59C11.24 4.21 10.73 4 10.2 4H5.5C4.67 4 4 4.67 4 5.5Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <circle
              cx="8"
              cy="8"
              r="1.25"
              fill="currentColor"
            />
          </svg>
        </span>

        <dt>
          Categoría
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        <span
          class="
            notification-detail-info__badge
            notification-detail-info__badge--category
          "
        >
          {{ typeLabel }}
        </span>
      </dd>
    </div>

    <!-- CANAL -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M4.5 7L12 12.5L19.5 7"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <dt>
          Canal
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        In-App
      </dd>
    </div>

    <!-- PRIORIDAD -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 21V4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M6 5H15.5L14 8L17 11H6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <dt>
          Prioridad
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        <span
          class="notification-detail-info__badge"
          [ngClass]="priorityClass"
        >
          {{ priorityLabel }}
        </span>
      </dd>
    </div>

    <!-- DESTINATARIO -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <circle
              cx="12"
              cy="8"
              r="3.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M5 20C5.45 16.5 8.05 14.5 12 14.5C15.95 14.5 18.55 16.5 19 20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <dt>
          Destinatario
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        {{ recipientLabel }}
      </dd>
    </div>

    <!-- ESTADO -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M2.75 12C4.85 8.35 7.95 6.25 12 6.25C16.05 6.25 19.15 8.35 21.25 12C19.15 15.65 16.05 17.75 12 17.75C7.95 17.75 4.85 15.65 2.75 12Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
            <circle
              cx="12"
              cy="12"
              r="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>
        </span>

        <dt>
          Estado
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        <span
          class="notification-detail-info__badge"
          [ngClass]="statusClass"
        >
          <span
            class="notification-detail-info__badge-dot"
            aria-hidden="true"
          ></span>

          {{ stateLabel }}
        </span>
      </dd>
    </div>

    <!-- ID -->
    <div class="notification-detail-info__item">
      <div class="notification-detail-info__label">
        <span class="notification-detail-info__icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M9 3L7 21"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M17 3L15 21"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M4 9H20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <path
              d="M3 15H19"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <dt>
          ID de notificación
        </dt>
      </div>

      <dd class="notification-detail-info__value">
        {{ notification.id }}
      </dd>
    </div>

  </dl>
</aside>
