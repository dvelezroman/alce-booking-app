<section class="notification-historial-header">

  <div class="notification-historial-header__main">

    <div
      class="notification-historial-header__icon"
      aria-hidden="true"
    >
      <svg
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M3 12a9 9 0 1 0 3-6.7"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M3 4.5v5h5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M12 7v5l3 2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="notification-historial-header__content">

      <h1 class="notification-historial-header__title">
        Historial de todas las notificaciones
      </h1>

      <p class="notification-historial-header__description">
        Consulta el historial completo de todas las notificaciones enviadas en el sistema.
      </p>

    </div>

  </div>

  <button
    type="button"
    class="notification-historial-header__button"
    (click)="onCreateNotification()"
  >
    <span
      class="notification-historial-header__button-icon"
      aria-hidden="true"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M22 2 11 13"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M22 2 15 22 11 13 2 9 22 2Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <span>
      Enviar nueva notificación
    </span>
  </button>

</section>
