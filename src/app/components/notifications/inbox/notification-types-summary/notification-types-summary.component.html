<section
  class="notification-types"
  aria-labelledby="notification-types-title"
>
  <header class="notification-types__header">
    <h2
      id="notification-types-title"
      class="notification-types__title"
    >
      Tipos de notificación
    </h2>
  </header>

  <div
    *ngIf="hasItems; else emptyTypes"
    class="notification-types__list"
  >
    <article
      *ngFor="
        let item of visibleItems;
        trackBy: trackByType
      "
      class="notification-types__item"
    >
      <div class="notification-types__item-main">
        <span
          class="notification-types__icon"
          [attr.data-type]="item.type.toLowerCase()"
          aria-hidden="true"
        >
          <ng-container
            [ngSwitch]="item.type.toLowerCase()"
          >
            <!-- Meeting -->
            <svg
              *ngSwitchCase="'meeting'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="4"
                y="5"
                width="16"
                height="15"
                rx="2"
              />

              <path d="M8 3v4" />
              <path d="M16 3v4" />
              <path d="M4 9h16" />
              <path d="M8 13h3" />
              <path d="M8 16h6" />
            </svg>

            <!-- Assessment -->
            <svg
              *ngSwitchCase="'assessment'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="4"
                y="4"
                width="16"
                height="16"
                rx="2"
              />

              <path d="M8 9h8" />
              <path d="M8 13h5" />
              <path d="M8 17h3" />
              <path d="m15 16 1.5 1.5L20 14" />
            </svg>

            <!-- Announce -->
            <svg
              *ngSwitchCase="'announce'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M4 11v2
                  a2 2 0 0 0 2 2h2
                  l2 4h3
                  l-2-4
                  7-3V6
                  l-10 4H6
                  a2 2 0 0 0-2 1Z
                "
              />

              <path d="M18 8a3 3 0 0 1 0 4" />
            </svg>

            <!-- System -->
            <svg
              *ngSwitchCase="'system'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M12 3
                  15 5
                  18.5 5.5
                  19 9
                  21 12
                  19 15
                  18.5 18.5
                  15 19
                  12 21
                  9 19
                  5.5 18.5
                  5 15
                  3 12
                  5 9
                  5.5 5.5
                  9 5Z
                "
              />

              <circle
                cx="12"
                cy="12"
                r="3"
              />
            </svg>

            <!-- Advice -->
            <svg
              *ngSwitchCase="'advice'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M9 18h6
                  M10 21h4
                  M8.5 15
                  C7 14 6 12.5 6 10.5
                  a6 6 0 0 1 12 0
                  c0 2-1 3.5-2.5 4.5
                  -.7.5-1 1.2-1 2H9.5
                  c0-.8-.3-1.5-1-2Z
                "
              />

              <path d="M12 7v4" />
              <path d="M10 9h4" />
            </svg>

            <!-- Commentary -->
            <svg
              *ngSwitchCase="'commentary'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M5 5h14
                  a2 2 0 0 1 2 2v8
                  a2 2 0 0 1-2 2h-8
                  l-5 4v-4H5
                  a2 2 0 0 1-2-2V7
                  a2 2 0 0 1 2-2Z
                "
              />

              <path d="M8 10h8" />
              <path d="M8 13h5" />
            </svg>

            <!-- Mandatory -->
            <svg
              *ngSwitchCase="'mandatory'"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M10.3 4.4
                  3.7 16
                  A2 2 0 0 0 5.4 19h13.2
                  a2 2 0 0 0 1.7-3
                  L13.7 4.4
                  a2 2 0 0 0-3.4 0Z
                "
              />

              <path d="M12 9v4" />
              <circle
                cx="12"
                cy="16"
                r="0.8"
              />
            </svg>

            <!-- Default -->
            <svg
              *ngSwitchDefault
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="
                  M18 8
                  a6 6 0 0 0-12 0
                  c0 7-3 7-3 9h18
                  c0-2-3-2-3-9Z
                "
              />

              <path
                d="
                  M10 21h4
                "
              />
            </svg>
          </ng-container>
        </span>

        <span class="notification-types__label">
          {{ item.label }}
        </span>
      </div>

      <strong class="notification-types__count">
        {{ item.count }}
      </strong>
    </article>
  </div>

  <ng-template #emptyTypes>
    <div class="notification-types__empty">
      No hay tipos de notificación disponibles.
    </div>
  </ng-template>

  <footer class="notification-types__footer">
    <button
      type="button"
      class="notification-types__view-all"
    >
      <span>
        Ver todas las notificaciones
      </span>

      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path d="M5 12h14" />
        <path d="m14 7 5 5-5 5" />
      </svg>
    </button>
  </footer>
</section>
