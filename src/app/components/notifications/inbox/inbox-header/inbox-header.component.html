<header class="inbox-header">
  <div class="inbox-header__content">
    <div class="inbox-header__icon">
      <i class="fa-regular fa-bell"></i>
    </div>

    <div class="inbox-header__information">
      <h1 class="inbox-header__title">
        Notificaciones
      </h1>

      <p class="inbox-header__description">
        Revisa tus avisos, recordatorios y actualizaciones.
      </p>
    </div>
  </div>

  <div
    class="inbox-header__status"
    [class.inbox-header__status--active]="hasUnreadNotifications"
  >
    <span class="inbox-header__status-dot"></span>

    <span class="inbox-header__status-text">
      {{ unreadLabel }}
    </span>
  </div>
</header>
