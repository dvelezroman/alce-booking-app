<header
  class="inbox-header"
  aria-labelledby="inbox-page-title"
>
  <div class="inbox-header__content">

    <!-- INFORMACIÓN -->
    <div class="inbox-header__information">
      <span
        class="inbox-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          role="presentation"
        >
          <path
            d="M18 8a6 6 0 0 0-12 0c0 6.5-3 7-3 9h18c0-2-3-2.5-3-9"
          ></path>

          <path d="M10 21h4"></path>
        </svg>
      </span>

      <div class="inbox-header__text">
        <h1
          id="inbox-page-title"
          class="inbox-header__title"
        >
          Notificaciones
        </h1>

        <p class="inbox-header__description">
          Revisa tus avisos, recordatorios y actualizaciones.
        </p>

        <div
          class="inbox-header__status"
          [class.inbox-header__status--active]="
            hasUnreadNotifications
          "
        >
          <span
            class="inbox-header__status-dot"
            aria-hidden="true"
          ></span>

          <span class="inbox-header__status-text">
            {{ unreadLabel }}
          </span>
        </div>
      </div>
    </div>

    <!-- ILUSTRACIÓN -->
    <div
      class="inbox-header__illustration"
      aria-hidden="true"
    >
      <svg
        class="inbox-header__illustration-svg"
        viewBox="0 0 320 210"
        xmlns="http://www.w3.org/2000/svg"
        role="presentation"
      >
        <defs>
          <linearGradient
            id="inbox-envelope-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#4f93ff"
            />

            <stop
              offset="100%"
              stop-color="#1768df"
            />
          </linearGradient>

          <linearGradient
            id="inbox-paper-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#ffffff"
            />

            <stop
              offset="100%"
              stop-color="#edf5ff"
            />
          </linearGradient>

          <linearGradient
            id="inbox-bell-gradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#ffd36b"
            />

            <stop
              offset="100%"
              stop-color="#f4a51c"
            />
          </linearGradient>

          <filter
            id="inbox-shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="180%"
          >
            <feDropShadow
              dx="0"
              dy="8"
              stdDeviation="7"
              flood-color="#155dbb"
              flood-opacity="0.16"
            />
          </filter>

          <filter
            id="inbox-soft-shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="180%"
          >
            <feDropShadow
              dx="0"
              dy="5"
              stdDeviation="5"
              flood-color="#155dbb"
              flood-opacity="0.13"
            />
          </filter>
        </defs>

        <!-- FONDO DECORATIVO -->
        <ellipse
          cx="177"
          cy="182"
          rx="119"
          ry="17"
          fill="#246fdf"
          opacity="0.08"
        />

        <circle
          cx="248"
          cy="104"
          r="50"
          fill="#4a8ff2"
          opacity="0.08"
        />

        <circle
          cx="68"
          cy="72"
          r="4"
          fill="#4b91f5"
          opacity="0.4"
        />

        <circle
          cx="55"
          cy="115"
          r="2.5"
          fill="#78aaf3"
          opacity="0.55"
        />

        <circle
          cx="286"
          cy="51"
          r="3"
          fill="#4f93ff"
          opacity="0.4"
        />

        <!-- SOBRE -->
        <g filter="url(#inbox-shadow)">
          <rect
            x="84"
            y="74"
            width="145"
            height="96"
            rx="16"
            fill="url(#inbox-envelope-gradient)"
          />

          <path
            d="M91 84L156.5 132L222 84"
            fill="none"
            stroke="#dcecff"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M91 160L135 120"
            fill="none"
            stroke="#79aaf2"
            stroke-width="4"
            stroke-linecap="round"
          />

          <path
            d="M222 160L178 120"
            fill="none"
            stroke="#79aaf2"
            stroke-width="4"
            stroke-linecap="round"
          />
        </g>

        <!-- DOCUMENTO -->
        <g filter="url(#inbox-soft-shadow)">
          <rect
            x="112"
            y="38"
            width="94"
            height="81"
            rx="10"
            fill="url(#inbox-paper-gradient)"
          />

          <rect
            x="127"
            y="55"
            width="52"
            height="6"
            rx="3"
            fill="#bad3f5"
          />

          <rect
            x="127"
            y="69"
            width="63"
            height="5"
            rx="2.5"
            fill="#d3e3f8"
          />

          <rect
            x="127"
            y="81"
            width="47"
            height="5"
            rx="2.5"
            fill="#d3e3f8"
          />

          <rect
            x="127"
            y="93"
            width="57"
            height="5"
            rx="2.5"
            fill="#d3e3f8"
          />
        </g>

        <!-- CAMPANA -->
        <g filter="url(#inbox-soft-shadow)">
          <circle
            cx="240"
            cy="70"
            r="34"
            fill="#ffffff"
          />

          <path
            d="M251 70c0-8-5-14-12-14s-12 6-12 14c0 8-4 9-4 12h32c0-3-4-4-4-12Z"
            fill="url(#inbox-bell-gradient)"
          />

          <path
            d="M235 87h8"
            fill="none"
            stroke="#db8a12"
            stroke-width="3.5"
            stroke-linecap="round"
          />

          <circle
            cx="253"
            cy="48"
            r="10"
            fill="#1768df"
          />

          <text
            x="253"
            y="52"
            fill="#ffffff"
            font-size="11"
            font-weight="800"
            text-anchor="middle"
            font-family="Arial, sans-serif"
          >
            !
          </text>
        </g>
      </svg>
    </div>

  </div>
</header>
