<section
  class="inbox-error"
  role="alert"
  aria-live="polite"
>
  <div
    class="inbox-error__decoration
           inbox-error__decoration--left"
    aria-hidden="true"
  ></div>

  <div
    class="inbox-error__decoration
           inbox-error__decoration--right"
    aria-hidden="true"
  ></div>

  <div
    class="inbox-error__illustration"
    aria-hidden="true"
  >
    <svg
      viewBox="0 0 320 230"
      xmlns="http://www.w3.org/2000/svg"
    >
      <ellipse
        class="inbox-error__illustration-shadow"
        cx="160"
        cy="207"
        rx="94"
        ry="12"
      />

      <circle
        class="inbox-error__illustration-circle"
        cx="160"
        cy="108"
        r="83"
      />

      <circle
        class="inbox-error__illustration-dot
               inbox-error__illustration-dot--one"
        cx="67"
        cy="67"
        r="7"
      />

      <circle
        class="inbox-error__illustration-dot
               inbox-error__illustration-dot--two"
        cx="251"
        cy="61"
        r="5"
      />

      <circle
        class="inbox-error__illustration-dot
               inbox-error__illustration-dot--three"
        cx="271"
        cy="151"
        r="8"
      />

      <path
        class="inbox-error__illustration-line"
        d="M53 142c12-10 24-12 37-4"
      />

      <path
        class="inbox-error__illustration-line"
        d="M229 34c10 1 18 6 24 15"
      />

      <g class="inbox-error__illustration-envelope">
        <rect
          class="inbox-error__illustration-paper"
          x="89"
          y="68"
          width="142"
          height="103"
          rx="18"
        />

        <path
          class="inbox-error__illustration-envelope-fold"
          d="M99 83l61 45 61-45"
        />

        <path
          class="inbox-error__illustration-envelope-line"
          d="M99 158l45-39"
        />

        <path
          class="inbox-error__illustration-envelope-line"
          d="M221 158l-45-39"
        />
      </g>

      <g class="inbox-error__illustration-alert">
        <circle
          class="inbox-error__illustration-alert-circle"
          cx="218"
          cy="73"
          r="29"
        />

        <rect
          class="inbox-error__illustration-alert-mark"
          x="214.5"
          y="57"
          width="7"
          height="20"
          rx="3.5"
        />

        <circle
          class="inbox-error__illustration-alert-mark"
          cx="218"
          cy="85"
          r="4"
        />
      </g>

      <path
        class="inbox-error__illustration-plant-stem"
        d="M77 193c0-28 2-47 14-65"
      />

      <path
        class="inbox-error__illustration-plant-leaf"
        d="M87 151c-19-1-29-13-30-28 18-1 30 9 30 28Z"
      />

      <path
        class="inbox-error__illustration-plant-leaf"
        d="M87 169c16-2 27-12 29-27-17-1-28 9-29 27Z"
      />

      <rect
        class="inbox-error__illustration-pot"
        x="61"
        y="188"
        width="34"
        height="14"
        rx="5"
      />

      <path
        class="inbox-error__illustration-pot-base"
        d="M65 200h26l-4 13H69Z"
      />
    </svg>
  </div>

  <div class="inbox-error__content">
    <span class="inbox-error__eyebrow">
      Algo no salió bien
    </span>

    <h2 class="inbox-error__title">
      No pudimos cargar tus notificaciones
    </h2>

    <p class="inbox-error__message">
      {{ message }}
    </p>

    <p class="inbox-error__help">
      Revisa tu conexión e inténtalo nuevamente.
    </p>

    <button
      type="button"
      class="inbox-error__retry-button"
      (click)="onRetry()"
    >
      Intentar nuevamente
    </button>
  </div>
</section>
