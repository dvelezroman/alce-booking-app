<!-- =========================================================
     SIDEBAR
========================================================= -->

<aside
  class="sidebar"
  [class.sidebar--closed]="isSidebarClosed"
  (mouseleave)="closeSidebar($event)"
  (mouseover)="openSidebar($event)"
>

  <!-- =======================================================
       HEADER / LOGO / USUARIO
  ======================================================== -->

  <header class="sidebar__header">

    <div class="sidebar__logo">
      <img
        src="/assets/icons/logo-alce-sidebar.png"
        alt="Alce College"
        class="sidebar__logo-image"
      />
    </div>

    <div
      class="sidebar__user"
      *ngIf="!isSidebarClosed"
    >

      <ng-container
        *ngIf="
          userData?.firstName && userData?.lastName;
          else welcomeTemplate
        "
      >
        <span class="sidebar__user-greeting">
          Hola,
        </span>

        <span class="sidebar__user-name">
          {{ userData?.firstName | titlecase }}
        </span>
      </ng-container>

      <ng-template #welcomeTemplate>
        <span class="sidebar__user-greeting">
          Bienvenido a
        </span>

        <span class="sidebar__user-name">
          Alce College
        </span>
      </ng-template>

    </div>

  </header>


  <!-- =======================================================
       NAVEGACIÓN
  ======================================================== -->

  <nav class="sidebar__nav">


    <!-- =====================================================
         INICIO
    ====================================================== -->

    <div
      *ngIf="homeNavItem"
      class="sidebar__item"
      [class.sidebar__item--active]="
        currentRoute === homeNavItem.route ||
        currentRoute.startsWith(
          homeNavItem.route + '/dashboard/home'
        )
      "
    >

      <a
        [routerLink]="homeNavItem.route"
        class="sidebar__item-link"
      >

        <span class="sidebar__icon">

          <svg
            viewBox="0 -960 960 960"
            aria-hidden="true"
          >
            <path
              d="M240-200h120v-240h240v240h120v-360L480-740
                 240-560v360Zm-80 80v-480l320-240 320 240v480H520
                 v-240h-80v240H160Zm320-350Z"
            />
          </svg>

        </span>

        <span class="sidebar__label">
          {{ homeNavItem.text }}
        </span>

      </a>

    </div>


    <!-- =====================================================
         PERFIL
    ====================================================== -->

    <div
      *ngIf="profileNavItem"
      class="sidebar__item"
      [class.sidebar__item--active]="
        currentRoute === profileNavItem.route ||
        currentRoute.startsWith(
          profileNavItem.route + '/dashboard/profile'
        )
      "
    >

      <a
        [routerLink]="profileNavItem.route"
        class="sidebar__item-link"
      >

        <span class="sidebar__icon">

          <svg
            viewBox="0 -960 960 960"
            aria-hidden="true"
          >
            <path
              d="M480-480q-66 0-113-47t-47-113q0-66 47-113

                 t-113 47ZM160-160v-112q0-34 17.5-62.5

                 v112H160Zm80-80h480v-32q0-11-5.5-20
                 T700-306q-54-27-109-40.5T480-360q-56 0
                 -111 13.5T260-306q-9 5-14.5 14t-5.5 20
                 v32Zm240-320q33 0 56.5-23.5T560-640
                 q0-33-23.5-56.5T480-720q-33 0-56.5 23.5
                 T400-640q0 33 23.5 56.5T480-560Z"
            />
          </svg>

        </span>

        <span class="sidebar__label">
          {{ profileNavItem.text }}
        </span>

      </a>

    </div>


    <!-- =====================================================
         GRUPOS DINÁMICOS
    ====================================================== -->

    <ng-container *ngFor="let group of navGrouped">

      <section class="sidebar__group">


        <!-- =================================================
             HEADER DEL GRUPO
        ================================================== -->

        <button
          type="button"
          class="sidebar__group-trigger"
          [class.sidebar__group-trigger--active]="
            isCategoryActive(group.items)
          "
          [class.sidebar__group-trigger--expanded]="
            categoryStates[group.title]
          "
          (click)="toggleCategory(group.title)"
        >


          <!-- ===============================================
               CONTENEDOR ÚNICO PARA TODOS LOS ICONOS

               Todos los iconos principales usan exactamente
               este mismo bloque.

               Esto permite que:
               - todos midan igual
               - todos estén centrados
               - no cambien al cerrar
               - no necesitemos CSS distinto por icono
          ================================================ -->

          <span class="sidebar__icon">

            <ng-container [ngSwitch]="group.icon">


              <!-- ===========================================
                   CLASES / EVENTOS
              ============================================ -->

              <svg

              <!-- ===========================================

              <!-- ===========================================

                aria-hidden="true"
              >
                <path
                  d="M480-120q-75 0-140.5-28.5T225-225

              </svg>


              <!-- ===========================================
                   ENLACES
              ============================================ -->

              <svg
                *ngSwitchCase="'link'"
                viewBox="0 -960 960 960"
                aria-hidden="true"
              >
                <path
                  d="M440-280H280q-83 0-141.5-58.5T80-480
                     q0-83 58.5-141.5T280-680h160v80H280

                     141.5T680-280H520Z"
                />
              </svg>


              <!-- ===========================================
                   TEST
              ============================================ -->

              <svg
                *ngSwitchCase="'test'"
                viewBox="0 -960 960 960"
                aria-hidden="true"
              >
                <path
                  d="M280-80v-120h-80v-80h80v-80h-80v-80

                />
              </svg>


              <!-- ===========================================
                   REPORTES
              ============================================ -->

              <svg
                *ngSwitchCase="'reportes'"
                viewBox="0 -960 960 960"
                aria-hidden="true"
              >
                <path

              </svg>


              <!-- ===========================================
                   NOTIFICACIONES
              ============================================ -->

              <ng-container *ngSwitchCase="'notifications'">

                <span
                  class="sidebar__notification"
                  [class.sidebar__notification--unread]="
                    unreadCount && unreadCount > 0
                  "
                >

                  <svg
                    viewBox="0 -960 960 960"
                    aria-hidden="true"
                  >
                    <path
                      d="M160-200v-80h80v-280q0-83 50-147.5
                         T420-792v-28q0-25 17.5-42.5T480-880
                         q25 0 42.5 17.5T540-820v28q80 20
                         130 84.5T720-560v280h80v80H160
                         Zm320 120q-33 0-56.5-23.5T400-160
                         h160q0 33-23.5 56.5T480-80ZM320-280
                         h320v-280q0-66-47-113t-113-47
                         q-66 0-113 47t-47 113v280Z"
                    />
                  </svg>

                  <span
                    *ngIf="unreadCount && unreadCount > 0"
                    class="sidebar__notification-badge"
                  >
                    {{ unreadCount }}
                  </span>

                </span>

              </ng-container>


              <!-- ===========================================
                   WHATSAPP
              ============================================ -->

              <i
                *ngSwitchCase="'whatsapp'"
                class="fa-brands fa-whatsapp sidebar__whatsapp-icon"
                aria-hidden="true"
              ></i>


              <!-- ===========================================
                   EMAIL
              ============================================ -->

              <svg
                *ngSwitchCase="'email'"
                viewBox="0 -960 960 960"
                aria-hidden="true"
              >
                <path
                  d="M160-160q-33 0-56.5-23.5T80-240v-480
                     q0-33 23.5-56.5T160-800h640q33 0
                     56.5 23.5T880-720v480q0 33-23.5
                     56.5T800-160H160Zm320-280L160-640
                     v400h640v-400L480-440Zm0-80 320-200
                     H160l320 200Z"
                />
              </svg>


              <!-- ===========================================
                   CONFIGURACIÓN
              ============================================ -->

              <svg
                *ngSwitchCase="'config'"
                viewBox="0 -960 960 960"
                aria-hidden="true"
              >
                <path
                  d="m370-80-16-128q-13-5-24.5-12T307-235
                     l-119 50L78-375l103-78q-1-7-1-13.5
                     v-27q0-6.5 1-13.5L78-585l110-190

                     q-59 0-99.5 41T342-480q0 58 40.5
                     99t99.5 41Z"
                />
              </svg>

            </ng-container>

          </span>


          <!-- ===============================================
               NOMBRE DEL GRUPO
          ================================================ -->

          <span class="sidebar__group-label">
            {{ group.title }}
          </span>


          <!-- ===============================================
               CHEVRON
          ================================================ -->

          <span class="sidebar__group-chevron">

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="m7 9 5 5 5-5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

          </span>

        </button>


        <!-- =================================================
             CONTENIDO DEL GRUPO
        ================================================== -->

        <ul
          *ngIf="categoryStates[group.title]"
          class="sidebar__group-list"
        >

          <li
            *ngFor="let item of group.items"
            class="sidebar__group-list-item"
          >


            <!-- =============================================
                 ITEM NORMAL
            ============================================== -->

            <ng-container *ngIf="isNavItem(item)">

              <a
                *ngIf="
                  item.roles.includes(
                    userData?.role || UserRole.STUDENT
                  )
                "
                [routerLink]="item.route"
                routerLinkActive="sidebar__child-link--active"
                (click)="closeSidebar($event)"
                class="sidebar__child-link"
              >

                <span
                  class="sidebar__child-dot"
                  aria-hidden="true"
                ></span>

                <span class="sidebar__child-label">
                  {{ item.text }}
                </span>


                <!-- BADGE LEADS -->

                <span
                  *ngIf="showLeadPendingBadge(item.route)"
                  class="sidebar__child-notification"
                  aria-hidden="true"
                >

                  <svg
                    viewBox="0 -960 960 960"
                  >
                    <path
                      d="M160-200v-80h80v-280q0-83 50-147.5
                         T420-792v-28q0-25 17.5-42.5T480-880
                         q25 0 42.5 17.5T540-820v28q80 20
                         130 84.5T720-560v280h80v80H160
                         Zm320 120q-33 0-56.5-23.5T400-160
                         h160q0 33-23.5 56.5T480-80ZM320-280
                         h320v-280q0-66-47-113t-113-47
                         q-66 0-113 47t-47 113v280Z"
                    />
                  </svg>

                  <span class="sidebar__child-badge">
                    {{
                      leadPendingCountForRoute(
                        item.route
                      )
                    }}
                  </span>

                </span>

              </a>

            </ng-container>


            <!-- =============================================
                 SUBGRUPO
            ============================================== -->

            <ng-container *ngIf="isSubGroup(item)">

              <div class="sidebar__subgroup">


                <!-- =========================================
                     HEADER SUBGRUPO
                ========================================== -->

                <button
                  type="button"
                  class="sidebar__subgroup-trigger"
                  [class.sidebar__subgroup-trigger--expanded]="
                    subCategoryStates[item.title]
                  "
                  (click)="toggleSubCategory(item.title)"
                >

                  <span class="sidebar__subgroup-content">

                    <span
                      class="sidebar__child-dot"
                      aria-hidden="true"
                    ></span>

                    <span class="sidebar__subgroup-label">
                      {{ item.title }}
                    </span>

                  </span>


                  <span class="sidebar__subgroup-chevron">

                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="m9 7 5 5-5 5"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>

                  </span>

                </button>


                <!-- =========================================
                     HIJOS DEL SUBGRUPO
                ========================================== -->

                <ul
                  *ngIf="subCategoryStates[item.title]"
                  class="sidebar__subgroup-list"
                >

                  <li
                    *ngFor="let child of item.children"
                    class="sidebar__subgroup-item"
                  >

                    <a
                      [routerLink]="child.route"
                      routerLinkActive="sidebar__subgroup-link--active"
                      [routerLinkActiveOptions]="{
                        exact: true
                      }"
                      (click)="closeSidebar($event)"
                      class="sidebar__subgroup-link"
                    >

                      <span
                        class="sidebar__subgroup-dot"
                        aria-hidden="true"
                      ></span>

                      <span class="sidebar__subgroup-link-label">
                        {{ child.text }}
                      </span>

                    </a>

                  </li>

                </ul>

              </div>

            </ng-container>

          </li>

        </ul>

      </section>

    </ng-container>

  </nav>


  <!-- =======================================================
       FOOTER / SALIR
  ======================================================== -->

  <footer class="sidebar__footer">

    <button
      type="button"
      class="sidebar__logout"
      (click)="openLogoutModal()"
    >

      <span class="sidebar__icon">

        <svg
          viewBox="0 -960 960 960"
          aria-hidden="true"
        >
          <path
            d="M200-120q-33 0-56.5-23.5T120-200v-560
               q0-33 23.5-56.5T200-840h280v80H200v560
               h280v80H200Zm440-160-55-58 102-102H360
               v-80h327L585-622l55-58 200 200-200 200Z"
          />
        </svg>

      </span>

      <span class="sidebar__label">
        Salir
      </span>

    </button>

  </footer>

</aside>


<!-- =========================================================
     BOTÓN MOBILE
========================================================= -->

<button
  type="button"
  class="sidebar-toggle"
  *ngIf="isSidebarClosed"
  (click)="openSidebar($event)"
  aria-label="Abrir menú"
>
  <i class="fas fa-bars"></i>
</button>


<!-- =========================================================
     MODAL LOGOUT
========================================================= -->

<app-modal
  [showModal]="modalConfig.show"
  [message]="modalConfig.message"
  [isError]="false"
  [isInfo]="true"
  [showButtons]="true"
  (confirmAction)="
    modalConfig.confirm &&
    modalConfig.confirm()
  "
  (close)="modalConfig.close()"
/>
