<section class="attendance-instructor-summary">

  <!-- =========================
       TOTAL CLASSES
  ========================== -->
  <article class="attendance-instructor-summary__card">

    <div class="attendance-instructor-summary__icon attendance-instructor-summary__icon--purple">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <rect
          x="4"
          y="5"
          width="16"
          height="15"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M8 3v4M16 3v4M4 9h16"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="M8 13h2M12 13h2M16 13h1M8 16.5h2M12 16.5h2"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="attendance-instructor-summary__content">

      <span class="attendance-instructor-summary__label">
        Clases totales
      </span>

      <strong class="attendance-instructor-summary__value">
        {{ totalClasses }}
      </strong>

      <small class="attendance-instructor-summary__description">
        En el período seleccionado
      </small>

    </div>

  </article>


  <!-- =========================
       PRESENT
  ========================== -->
  <article class="attendance-instructor-summary__card">

    <div class="attendance-instructor-summary__icon attendance-instructor-summary__icon--success">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="m8.5 12 2.2 2.2 4.8-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="attendance-instructor-summary__content">

      <span class="attendance-instructor-summary__label">
        Clases presentes
      </span>

      <strong class="attendance-instructor-summary__value">
        {{ presentClasses }}
      </strong>

      <small class="attendance-instructor-summary__description">
        {{ presentPercentage }}% del total
      </small>

    </div>

  </article>


  <!-- =========================
       ABSENT
  ========================== -->
  <article class="attendance-instructor-summary__card">

    <div class="attendance-instructor-summary__icon attendance-instructor-summary__icon--danger">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="m8 8 8 8M16 8l-8 8"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="attendance-instructor-summary__content">

      <span class="attendance-instructor-summary__label">
        Clases ausentes
      </span>

      <strong class="attendance-instructor-summary__value">
        {{ absentClasses }}
      </strong>

      <small class="attendance-instructor-summary__description">
        {{ absentPercentage }}% del total
      </small>

    </div>

  </article>


  <!-- =========================
       HOURS
  ========================== -->
  <article class="attendance-instructor-summary__card">

    <div class="attendance-instructor-summary__icon attendance-instructor-summary__icon--blue">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 7v5l3 2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <div class="attendance-instructor-summary__content">

      <span class="attendance-instructor-summary__label">
        Horas impartidas
      </span>

      <strong class="attendance-instructor-summary__value">
        {{ totalHoursLabel }}
      </strong>

      <small class="attendance-instructor-summary__description">
        Total en el período
      </small>

    </div>

  </article>

</section>
