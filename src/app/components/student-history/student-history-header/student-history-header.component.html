<header class="student-history-header">

  <div class="student-history-header__information">

    <span
      class="student-history-header__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M7.5 3.5h6.8L19 8.2V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1.5-1.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M14 3.5V8h4.5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M9 12h6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="M9 15.5h3.2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="m14.3 16.1 1.15 1.15 2.25-2.5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

    <div class="student-history-header__text">
      <h1>
        Reporte de historial del estudiante
      </h1>

      <p>
        Genera y descarga el historial completo de clases,
        evaluaciones y asistencia del estudiante.
      </p>
    </div>

  </div>

  <div class="student-history-header__actions">

    <button
      type="button"
      class="student-history-header__history"
      (click)="openHistory()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <circle
          cx="12"
          cy="12"
          r="8"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 7.5V12l3 2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>
        Historial de reportes
      </span>
    </button>

  </div>

</header>
