@if (student) {
  <section class="selected-student">

    <div class="selected-student__main">

      <div class="selected-student__avatar">
        {{ initials }}
      </div>

      <div class="selected-student__identity">
        <strong>
          {{ fullName }}
        </strong>

        <span>
          Estudiante seleccionado
        </span>
      </div>

    </div>

    <div class="selected-student__details">

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <rect
              x="4"
              y="5"
              width="16"
              height="14"
              rx="2"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <path
              d="m5 7 7 6 7-6"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <div>
          <small>Email</small>
          <strong>{{ email }}</strong>
        </div>
      </article>

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle
              cx="9"
              cy="8"
              r="3"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <path
              d="M3.5 18c.6-2.8 2.6-4.5 5.5-4.5s4.9 1.7 5.5 4.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />

            <path
              d="M16 8h4M18 6v4"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <div>
          <small>ID Estudiante</small>
          <strong>{{ studentId }}</strong>
        </div>
      </article>

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <circle
              cx="12"
              cy="8"
              r="3.3"
              stroke="currentColor"
              stroke-width="1.6"
            />

            <path
              d="M6 19c.7-3.1 2.9-5 6-5s5.3 1.9 6 5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <div>
          <small>Stage actual</small>
          <strong>{{ stage }}</strong>
        </div>
      </article>

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3.5 14.4 8l5 .8-3.6 3.6.8 5-4.6-2.3-4.6 2.3.8-5-3.6-3.6 5-.8L12 3.5Z"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round"
            />
          </svg>
        </span>

        <div>
          <small>Modalidad</small>
          <strong>{{ modality }}</strong>
        </div>
      </article>

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 3v18M16 7.5c0-1.4-1.4-2.5-3.5-2.5S9 6 9 7.5 10.3 10 12.5 10 16 11 16 12.5 14.7 15 12.5 15 9 14 9 12.5"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <div>
          <small>Clasificación</small>
          <strong>{{ classification }}</strong>
        </div>
      </article>

      <article class="selected-student__item">
        <span class="selected-student__item-icon">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M6 20V7.5L12 4l6 3.5V20"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />

            <path
              d="M9 20v-4h6v4M9 9h.01M15 9h.01M9 12h.01M15 12h.01"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <div>
          <small>Ciudad</small>
          <strong>{{ city }}</strong>
        </div>
      </article>

    </div>

    <span class="selected-student__check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle
          cx="12"
          cy="12"
          r="9"
          fill="currentColor"
        />

        <path
          d="m8 12 2.5 2.5L16.5 8"
          stroke="#fff"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </span>

  </section>
}
