<section
  class="instructor-quick-actions"
  aria-labelledby="instructor-quick-actions-title"
>
  <h2
    id="instructor-quick-actions-title"
    class="quick-actions-title"
  >
    Accesos rápidos
  </h2>

  <div class="quick-actions-grid">
    <a
      *ngFor="let action of actions"
      class="quick-action-card"
      [class]="'quick-action-card quick-action-card--' + action.tone"
      [routerLink]="action.route"
      [attr.aria-label]="action.ariaLabel"
    >
      <span
        class="quick-action-icon"
        [class]="'quick-action-icon quick-action-icon--' + action.tone"
        aria-hidden="true"
      >
        <ng-container [ngSwitch]="action.icon">

          <!-- CALENDARIO -->
          <svg
            *ngSwitchCase="'calendar'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="M7 3v4M17 3v4M3 9h18"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

            <path
              d="M8 13h3M13 13h3M8 17h3"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>

          <!-- EVALUACIONES -->
          <svg
            *ngSwitchCase="'evaluation'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />

            <path
              d="M9 4.5V3h6v1.5M8 9h6M8 13h4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />

            <path
              d="m14.5 17 4-4M17.5 12l1.5 1.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <!-- PROGRESO -->
          <svg
            *ngSwitchCase="'progress'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M5 20V13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M10 20V9"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M15 20V5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M20 20V2"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>

          <!-- NOTIFICACIONES -->
          <svg
            *ngSwitchCase="'notification'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M10 21h4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <!-- EMAIL -->
          <svg
            *ngSwitchCase="'email'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="14"
              rx="2.5"
              stroke="currentColor"
              stroke-width="1.8"
            />

            <path
              d="m4.5 7 7.5 6 7.5-6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        </ng-container>
      </span>

      <span class="quick-action-content">
        <span class="quick-action-name">
          {{ action.title }}
        </span>

        <span class="quick-action-description">
          {{ action.description }}
        </span>
      </span>

      <span
        class="quick-action-arrow"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M5 12h14M13 6l6 6-6 6"
            stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </a>
  </div>
</section>
