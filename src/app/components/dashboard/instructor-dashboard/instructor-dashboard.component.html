
<div class="instructor-dashboard-wrapper">

  <!-- HEADER -->
  <div class="instructor-header">
    <h1 class="title">
      Hola, {{ userData?.firstName }}
    </h1>
    <p class="subtitle">
      Aquí puedes gestionar tus clases y ver tu agenda
    </p>
  </div>

  <!-- CALENDARIO + TABLA -->
  <div class="calendar-wrapper" *ngIf="instructorId">
    <app-instructor-calendar
      [instructorId]="instructorId">
    </app-instructor-calendar>
  </div>

</div>

  <app-announcement-viewer
    *ngIf="announcementUser"
    [announcements]="announcements"
    [user]="announcementUser"
  ></app-announcement-viewer>
