<section
  class="important-notices-card"
  aria-labelledby="important-notices-title"
>
  <header class="card-header">
    <h2
      id="important-notices-title"
      class="card-title"
    >
      Avisos importantes
    </h2>

    <button
      type="button"
      class="view-all-button"
      (click)="onViewAll()"
    >
      Ver todos
    </button>
  </header>

  <div class="notices-list">
    <article
      *ngFor="
        let notice of notices;
        let last = last;
        trackBy: trackByNoticeId
      "
      class="notice-item"
      [class.notice-item--last]="last"
      tabindex="0"
      role="button"
      [attr.aria-label]="notice.title"
      (click)="onNoticeClick(notice)"
      (keydown.enter)="onNoticeClick(notice)"
      (keydown.space)="onNoticeClick(notice)"
    >
      <span
        class="notice-icon"
        [class]="'notice-icon notice-icon--' + notice.tone"
        aria-hidden="true"
      >
        <ng-container [ngSwitch]="notice.icon">

          <!-- CAMPANA -->
          <svg
            *ngSwitchCase="'bell'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"
              fill="currentColor"
              opacity="0.95"
            />

            <path
              d="M10 20h4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>

          <!-- ADVERTENCIA -->
          <svg
            *ngSwitchCase="'warning'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M10.4 4.2a1.85 1.85 0 0 1 3.2 0l7.1 12.3a1.85 1.85 0 0 1-1.6 2.8H4.9a1.85 1.85 0 0 1-1.6-2.8l7.1-12.3Z"
              fill="currentColor"
            />

            <path
              d="M12 8v5"
              stroke="#ffffff"
              stroke-width="1.9"
              stroke-linecap="round"
            />

            <circle
              cx="12"
              cy="16"
              r="1"
              fill="#ffffff"
            />
          </svg>

          <!-- INFORMACIÓN -->
          <svg
            *ngSwitchCase="'book'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"
              fill="currentColor"
            />

            <path
              d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"
              fill="currentColor"
              opacity="0.9"
            />

            <circle
              cx="16.5"
              cy="7"
              r="0.9"
              fill="#ffffff"
            />

            <path
              d="M16.5 10v4"
              stroke="#ffffff"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>

        </ng-container>
      </span>

      <div class="notice-content">

        <div class="notice-top">
          <span
            class="notice-tag"
            [class]="'notice-tag notice-tag--' + notice.tone"
          >
            {{ notice.tag }}
          </span>

          <time class="notice-date">
            {{ notice.date }}
          </time>
        </div>

        <h3 class="notice-title">
          {{ notice.title }}
        </h3>

        <p class="notice-description">
          {{ notice.description }}
        </p>

      </div>
    </article>
  </div>
</section>
