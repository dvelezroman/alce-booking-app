<section
  class="upcoming-classes-card"
  aria-labelledby="upcoming-classes-title"
>
  <header class="card-header">
    <h2
      id="upcoming-classes-title"
      class="card-title"
    >
      Próximas clases de hoy
    </h2>

    <button
      type="button"
      class="view-calendar-button"
      (click)="onViewCalendar()"
    >
      Ver calendario completo
    </button>
  </header>

  <div class="classes-list">

    <article
      *ngFor="
        let classItem of upcomingClasses;
        let first = first;
        trackBy: trackByClassId
      "
      class="class-item"
      [class.class-item--active]="first"
    >
      <div class="class-time">
        <strong>
          {{ classItem.time }}
        </strong>

        <span>
          {{ classItem.period }}
        </span>
      </div>

      <div class="class-content">
        <div class="class-main">

          <div class="class-heading">

            <div class="class-heading-main">
              <h3 class="class-name">
                {{ classItem.name }}
              </h3>

              <span
                *ngIf="classItem.type === 'courtesy'"
                class="class-badge class-badge--courtesy"
              >
                Cortesía
              </span>

              <span
                *ngIf="classItem.type !== 'courtesy'"
                class="class-badge"
                [class.class-badge--online]="
                  classItem.mode === 'online'
                "
                [class.class-badge--presential]="
                  classItem.mode === 'presential'
                "
              >
                {{ getModeLabel(classItem.mode) }}
              </span>
            </div>

            <!-- SOLO MOBILE -->
            <span
              *ngIf="classItem.startsInMinutes"
              class="starts-badge starts-badge--mobile"
            >
              En {{ classItem.startsInMinutes }} min
            </span>

          </div>

          <div class="class-meta">

            <span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <circle
                  cx="9.5"
                  cy="7"
                  r="4"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  *ngIf="classItem.studentsCount > 1"
                  d="M19 8v6M22 11h-6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>

              {{ getStudentLabel(classItem.studentsCount) }}
            </span>

            <span>
              <svg
                *ngIf="classItem.mode === 'online'"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <rect
                  x="3"
                  y="5"
                  width="18"
                  height="14"
                  rx="2.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                />

                <path
                  d="m16 10 3-2v8l-3-2"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <svg
                *ngIf="classItem.mode === 'presential'"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M12 21s6-4.5 6-11a6 6 0 1 0-12 0c0 6.5 6 11 6 11Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />

                <circle
                  cx="12"
                  cy="10"
                  r="2"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              </svg>

              {{ classItem.location }}
            </span>

          </div>
        </div>

        <div class="class-actions">

          <span
            *ngIf="classItem.startsInMinutes"
            class="starts-badge starts-badge--desktop"
          >
            Comienza en
            {{ classItem.startsInMinutes }}
            min
          </span>

          <button
            *ngIf="classItem.startsInMinutes"
            type="button"
            class="primary-action"
            (click)="onOpenClass(classItem)"
          >
            Entrar a la clase
          </button>

          <button
            *ngIf="!classItem.startsInMinutes"
            type="button"
            class="secondary-action"
            (click)="onViewDetails(classItem)"
          >
            Ver detalles
          </button>

        </div>
      </div>
    </article>

  </div>
</section>
