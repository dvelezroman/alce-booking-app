<section
  class="instructor-summary-card"
  aria-labelledby="instructor-summary-title"
>
  <div class="summary-intro">
    <h2
      id="instructor-summary-title"
      class="summary-title"
    >
      Resumen de hoy
    </h2>

    <p class="summary-description">
      Hoy tienes
      <strong>
        {{ classesToday }} clases programadas
      </strong>

      y
      <strong>
        {{ pendingEvaluations }}
        evaluaciones pendientes.
      </strong>
    </p>

    <button
      type="button"
      class="calendar-button"
      (click)="onCalendarClick()"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <rect
          x="3"
          y="5"
          width="18"
          height="16"
          rx="2.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M7 3v4M17 3v4M3 9h18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 13h3M13 13h3M8 17h3"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>

      <span>Ver mi calendario</span>
    </button>
  </div>

  <div
    class="summary-divider"
    aria-hidden="true"
  ></div>

  <div class="summary-stats">

    <!-- CLASES DE HOY -->
    <article class="summary-stat">
      <div class="stat-icon stat-icon--purple">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="16"
            rx="2.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M7 3v4M17 3v4M3 9h18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="M8 13h3M13 13h3M8 17h3"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <strong class="stat-value">
        5
      </strong>

      <span class="stat-label">
        Clases hoy
      </span>

      <span class="stat-detail">
        2 cortesía
      </span>
    </article>

    <!-- EVALUACIONES -->
    <article class="summary-stat">
      <div class="stat-icon stat-icon--blue">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="M9 4.5V3h6v1.5M8 9h8M8 13h5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="m14.5 16 1.4 1.4 2.6-3"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <strong class="stat-value">
        8
      </strong>

      <span class="stat-label">
        Evaluaciones
      </span>

      <span class="stat-detail">
        pendientes
      </span>
    </article>

    <!-- SATISFACCIÓN -->
    <article class="summary-stat">
      <div class="stat-icon stat-icon--green">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />

          <path
            d="m9.5 12.5 1.6 1.6 3.4-3.5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <strong class="stat-value">
        96%
      </strong>

      <span class="stat-label">
        Promedio de satisfacción
      </span>
    </article>

    <!-- HORAS IMPARTIDAS -->
    <article class="summary-stat">
      <div class="stat-icon stat-icon--yellow">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <circle
            cx="12"
            cy="12"
            r="8.5"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="M12 7.5V12l3 2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <strong class="stat-value">
        22h
      </strong>

      <span class="stat-label">
        Horas impartidas
      </span>

      <span class="stat-detail">
        esta semana
      </span>
    </article>

  </div>

  <div
    class="summary-mascot"
    aria-hidden="true"
  >
    <img
      src="/assets/alce-student-progress.svg"
      alt=""
    />
  </div>
</section>
