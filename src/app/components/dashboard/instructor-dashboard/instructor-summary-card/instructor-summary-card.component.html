<section
  class="instructor-summary-card"
  aria-labelledby="instructor-summary-title"
>
  <div class="summary-intro">
    <h2
      id="instructor-summary-title"
      class="summary-title"
    >
      Resumen de hoy
    </h2>

    <p class="summary-description">
      Consulta tu
      <strong>agenda del día</strong>,
      revisa tus
      <strong>clases programadas</strong>
      y mantente al día con tus actividades.
    </p>

    <button
      type="button"
      class="calendar-button"
      (click)="onCalendarClick()"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <rect
          x="3"
          y="5"
          width="18"
          height="16"
          rx="2.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M7 3v4M17 3v4M3 9h18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 13h3M13 13h3M8 17h3"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Ver mi calendario
      </span>
    </button>
  </div>

  <div
    class="summary-mascot"
    aria-hidden="true"
  >
    <img
      src="/assets/alce-student-progress.svg"
      alt=""
    />
  </div>
</section>
