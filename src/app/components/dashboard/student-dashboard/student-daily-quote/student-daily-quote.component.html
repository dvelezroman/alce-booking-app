<section
  class="daily-quote"
  *ngIf="currentQuote as quote"
>
  <header class="daily-quote__header">
    <h3 class="daily-quote__title">
      Frase del día
    </h3>
  </header>

  <div class="daily-quote__content">
    <span
      class="daily-quote__quotation daily-quote__quotation--opening"
      aria-hidden="true"
    >
      “
    </span>

    <blockquote class="daily-quote__blockquote">
      <p class="daily-quote__text">
        “{{ quote.text }}”
      </p>

      <footer class="daily-quote__author">
        — {{ quote.author }}
      </footer>
    </blockquote>

    <span
      class="daily-quote__quotation daily-quote__quotation--closing"
      aria-hidden="true"
    >
      ”
    </span>
  </div>
