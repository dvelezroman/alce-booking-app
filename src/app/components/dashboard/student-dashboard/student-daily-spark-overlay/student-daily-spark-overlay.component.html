<div
  class="spark-overlay"
  *ngIf="open && spark as item"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'spark-overlay-title'"
  (click)="onBackdropClick($event)"
>
  <div
    class="spark-overlay__card"
    (click)="$event.stopPropagation()"
  >

    <!-- CERRAR -->
    <button
      type="button"
      class="spark-overlay__close"
      aria-label="Close"
      (click)="close()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M6 6l12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
        />
      </svg>
    </button>


   <!-- DECORACIÓN SUPERIOR -->
    <div class="spark-overlay__hero">

      <span
        class="
          spark-overlay__spark
          spark-overlay__spark--one
        "
        aria-hidden="true"
      >
        ✦
      </span>

      <span
        class="
          spark-overlay__spark
          spark-overlay__spark--two
        "
        aria-hidden="true"
      >
        ✦
      </span>

      <span
        class="
          spark-overlay__spark
          spark-overlay__spark--three
        "
        aria-hidden="true"
      >
        ✦
      </span>


      <!-- BOMBILLO -->
      <div class="spark-overlay__bulb" aria-hidden="true">

        <svg
          viewBox="0 0 64 64"
          fill="none"
        >
          <path
            d="M20 27C20 20.37 25.37 15 32 15C38.63 15 44 20.37 44 27C44 31.56 41.46 35.53 37.72 37.56C36.56 38.19 36 39.37 36 40.69V42H28V40.69C28 39.37 27.44 38.19 26.28 37.56C22.54 35.53 20 31.56 20 27Z"
            fill="currentColor"
            opacity=".16"
          />

          <path
            d="M20 27C20 20.37 25.37 15 32 15C38.63 15 44 20.37 44 27C44 31.56 41.46 35.53 37.72 37.56C36.56 38.19 36 39.37 36 40.69V42H28V40.69C28 39.37 27.44 38.19 26.28 37.56C22.54 35.53 20 31.56 20 27Z"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="M28 47H36"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M29.5 52H34.5"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M32 7V11"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M15 14L18 17"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M49 14L46 17"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>

      </div>


      <!-- PERSONAJE -->
      <div
        class="spark-overlay__character"
        aria-hidden="true"
      >
        <img
          src="assets/alce-trivia.png"
          alt=""
          class="spark-overlay__character-image"
        />
      </div>

    </div>


    <!-- ETIQUETA -->
    <p
      class="spark-overlay__eyebrow"
      id="spark-overlay-title"
    >
      {{ label }}
    </p>


    <!-- ETIQUETA -->
    <p
      class="spark-overlay__eyebrow"
      id="spark-overlay-title"
    >
      {{ label }}
    </p>


    <!-- FRASE -->
    <ng-container *ngIf="!isTrivia">

      <blockquote class="spark-overlay__quote">

        <p class="spark-overlay__text">
          “{{ item.text }}”
        </p>

        <footer
          *ngIf="item.author"
          class="spark-overlay__author"
        >
          — {{ item.author }}
        </footer>

      </blockquote>

    </ng-container>


    <!-- TRIVIA -->
    <ng-container *ngIf="isTrivia">

      <p class="spark-overlay__question">
        {{ item.text }}
      </p>


      <!-- FLECHA DECORATIVA -->
      <div
        class="spark-overlay__reveal-arrow"
        *ngIf="!revealed"
        aria-hidden="true"
      >
        <span></span>

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M12 5v13M7 13l5 5 5-5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>


      <!-- FLIP -->
      <button
        type="button"
        class="spark-overlay__flip"
        [class.spark-overlay__flip--revealed]="revealed"
        [attr.aria-expanded]="revealed"
        aria-label="Tap to reveal the answer"
        (click)="flip()"
      >
        <div class="spark-overlay__flip-inner">


          <!-- FRONT -->
          <div
            class="
              spark-overlay__face
              spark-overlay__face--front
            "
          >

            <span
              class="spark-overlay__tap-icon"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="M9.5 10.5V6.3a1.6 1.6 0 0 1 3.2 0V10"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  d="M12.7 9.4V7.9a1.5 1.5 0 0 1 3 0v2.4"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />

                <path
                  d="M15.7 10V9a1.4 1.4 0 0 1 2.8 0v5.2c0 3.8-2.4 6.3-6.1 6.3-2.3 0-4.3-1.1-5.5-3l-2.1-3.2a1.6 1.6 0 0 1 2.5-2l2.2 2.2"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>

            <span
              class="spark-overlay__tap-hint"
              *ngIf="!revealed"
            >
              Tap to reveal the answer
            </span>

          </div>


          <!-- BACK -->
          <div
            class="
              spark-overlay__face
              spark-overlay__face--back
            "
          >

            <span
              class="spark-overlay__success-icon"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
              >
                <path
                  d="m7.5 12.5 3 3 6-7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>

            <p
              class="
                spark-overlay__text
                spark-overlay__text--reveal
              "
            >
              {{ item.reveal }}
            </p>

          </div>

        </div>
      </button>

    </ng-container>


    <!-- HINT -->
    <p
      class="spark-overlay__hint"
      *ngIf="item.hintEs"
    >

      <span
        class="spark-overlay__hint-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M8 10a4 4 0 1 1 8 0c0 1.7-.9 3-2.1 3.9-.7.5-1.1 1.1-1.1 1.9v.2h-1.6v-.2c0-.8-.4-1.4-1.1-1.9C8.9 13 8 11.7 8 10Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />

          <path
            d="M10.5 19h3"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </span>

      <span class="spark-overlay__hint-content">

        <span class="spark-overlay__hint-label">
          Hint
        </span>

        <span class="spark-overlay__hint-text">
          {{ item.hintEs }}
        </span>

      </span>

    </p>


    <!-- CTA -->
    <button
      type="button"
      class="spark-overlay__cta"
      (click)="close()"
    >
      <span
        class="spark-overlay__cta-spark"
        aria-hidden="true"
      >
        ✦
      </span>

      Let's go!
    </button>

  </div>
</div>
