<section
  class="progress-card"
  aria-labelledby="student-progress-title"
>
  <header class="progress-card__header">
    <h2
      id="student-progress-title"
      class="progress-card__title"
    >
      Tu progreso general
    </h2>

    <div
      class="progress-card__stage"
      [class.progress-card__stage--empty]="!hasAssignedStage"
      role="status"
      [attr.aria-label]="stageAriaLabel"
    >
      <span class="progress-card__stage-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="m12 2 2.15 3.2 3.75.4.4 3.75L21.5 12l-3.2 2.65-.4 3.75-3.75.4L12 22l-2.15-3.2-3.75-.4-.4-3.75L2.5 12l3.2-2.65.4-3.75 3.75-.4L12 2Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
      </span>

      <span class="progress-card__stage-copy">
        <span class="progress-card__stage-kicker">
          Stage actual
        </span>

        <strong class="progress-card__stage-value">
          <ng-container *ngIf="hasAssignedStage; else unassignedStage">
            <span *ngIf="stageNumber">
              {{ stageNumber }}
            </span>
            <span
              *ngIf="stageNumber && stageDescription"
              class="progress-card__stage-sep"
              aria-hidden="true"
            >
              ·
            </span>
            <span
              *ngIf="stageDescription"
              class="progress-card__stage-desc"
            >
              {{ stageDescription }}
            </span>
          </ng-container>

          <ng-template #unassignedStage>
            Sin asignar
          </ng-template>
        </strong>
      </span>
    </div>
  </header>

  <ng-container *ngIf="!isLoading; else loadingState">

    <div class="progress-card__content">

      <!-- PROGRESO CIRCULAR -->
      <div class="progress-card__progress-section">
        <!-- <div
          class="progress-ring"
          [style.--progress]="progressPercentage"
          role="progressbar"
          [attr.aria-valuenow]="progressPercentage"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-label="Progreso general"
        >
          <div class="progress-ring__inner">
            <strong>
              {{ progressPercentage }}%
            </strong>
          </div>
        </div> -->
        <img
          class="progress-card__temporary-image"
          src="/assets/icons/icon-384x384.png"
          alt=""
          aria-hidden="true"
        />
      </div>

      <!-- MENSAJE -->
      <div class="progress-card__message">
        <h3>
          ¡Vas por buen camino!
        </h3>

        <p>
          {{ progressMessage }}
        </p>
      </div>

      <span
        class="progress-card__divider progress-card__divider--first"
        aria-hidden="true"
      ></span>

      <!-- CLASES -->
      <div class="progress-card__stat">
        <span class="progress-card__stat-label">
          Clases tomadas
        </span>

        <strong class="progress-card__stat-value">
          {{ totalClasses }}
        </strong>

        <span class="progress-card__stat-caption">
          En total
        </span>
      </div>

      <!-- RACHA -->
      <div class="progress-card__stat progress-card__streak">
        <span class="progress-card__stat-label">
          Racha de estudio
        </span>

        <strong class="progress-card__stat-value">
          <span class="streak-icon" aria-hidden="true">
            🔥
          </span>

          {{ studyStreak }}
          {{ studyStreak === 1 ? 'día' : 'días' }}
        </strong>

        <span class="progress-card__stat-caption">
          {{ streakMessage }}
        </span>
      </div>

      <!-- IMAGEN -->
      <div class="progress-card__mascot" aria-hidden="true">
        <img
          src="/assets/alce-student-progress.svg"
          alt=""
        />
      </div>

    </div>
  </ng-container>

  <!-- LOADING -->
  <ng-template #loadingState>
    <div class="progress-card__loading">
      <div class="loading-circle"></div>

      <div class="loading-lines">
        <span></span>
        <span></span>
      </div>

      <div class="loading-stat"></div>
      <div class="loading-stat"></div>
    </div>
  </ng-template>
</section>
