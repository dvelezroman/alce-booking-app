<section class="admin-dashboard">

  <div class="admin-dashboard__container">

    <!-- =====================================================
         DASHBOARD GRID
    ====================================================== -->

    <div class="admin-dashboard__layout">

      <!-- ===================================================
           MAIN CONTENT
      ==================================================== -->

      <main class="admin-dashboard__main">

        <!-- ===============================================
             HEADER
        ================================================ -->

        <header class="admin-dashboard__header">

          <div class="admin-dashboard__header-content">

            <span class="admin-dashboard__eyebrow">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M4 11.5 12 5l8 6.5V20H4v-8.5Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />

                <path
                  d="M9 20v-5h6v5"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
              </svg>

              Panel administrativo
            </span>

            <h1 class="admin-dashboard__title">
              Bienvenido, {{ adminName }}
              <span aria-hidden="true">👋</span>
            </h1>

            <p class="admin-dashboard__description">
              Consulta un resumen general y accede rápidamente
              a las herramientas de gestión.
            </p>

          </div>


          <div
            class="admin-dashboard__header-illustration"
            aria-hidden="true"
          >
            <div class="admin-dashboard__header-chart">

              <span></span>
              <span></span>
              <span></span>
              <span></span>

            </div>

            <div class="admin-dashboard__header-person">

              <span class="admin-dashboard__header-head"></span>

              <span class="admin-dashboard__header-body"></span>

              <span class="admin-dashboard__header-laptop"></span>

            </div>
          </div>

        </header>


        <!-- ===============================================
             STATS
        ================================================ -->

        <app-admin-dashboard-stats
          [totalUsers]="totalUsers"
          [totalStudents]="totalStudents"
          [totalInstructors]="totalInstructors"
          [totalAdmins]="totalAdmins"
          [pendingClasses]="pendingClassesToAssign"
          [loading]="loadingUserStats"
          [loadingPendingClasses]="loadingPendingClasses"
        >
        </app-admin-dashboard-stats>


        <!-- ===============================================
             SHORTCUTS
        ================================================ -->

        <app-admin-dashboard-shortcuts>
        </app-admin-dashboard-shortcuts>


        <!-- ===============================================
             PENDING DEMOS
        ================================================ -->

        <app-admin-dashboard-pending-demos>
        </app-admin-dashboard-pending-demos>


        <!-- ===============================================
             TIP
        ================================================ -->

        <app-admin-dashboard-tip>
        </app-admin-dashboard-tip>

      </main>


      <!-- ===================================================
           SIDEBAR
      ==================================================== -->

      <aside class="admin-dashboard__sidebar">

        <!-- QUICK ACTIONS -->

        <app-admin-dashboard-quick-actions>
        </app-admin-dashboard-quick-actions>


        <!-- DAY SUMMARY -->

        <app-admin-dashboard-day-summary>
        </app-admin-dashboard-day-summary>


        <!-- UNREAD NOTIFICATIONS -->

        <app-admin-dashboard-notifications>
        </app-admin-dashboard-notifications>

      </aside>

    </div>


    <!-- =====================================================
         ANNOUNCEMENTS
         NO TOCAR
    ====================================================== -->

    <app-announcement-viewer
      *ngIf="announcementUser && visibleAnnouncements.length > 0"
      [announcements]="visibleAnnouncements"
      [user]="announcementUser"
      (closed)="onCustomAnnouncementClosed($event)"
    >
    </app-announcement-viewer>

  </div>

</section>
