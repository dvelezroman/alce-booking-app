<header class="platform-assessment-header">

  <div class="platform-assessment-header__content">

    <!-- ICONO -->
    <span
      class="platform-assessment-header__icon"
      aria-hidden="true"
    >
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="4.5"
          width="14"
          height="16"
          rx="2.5"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M9 4V3.5A1.5 1.5 0 0 1 10.5 2h3A1.5 1.5 0 0 1 15 3.5V4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M9 9h6M9 13h6M9 17h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <!-- TEXTO -->
    <div class="platform-assessment-header__text">
      <h1 class="platform-assessment-header__title">
        Evaluaciones de plataforma
      </h1>

      <p class="platform-assessment-header__description">
        Consulta y gestiona todas tus evaluaciones asignadas por la plataforma.
      </p>
    </div>

  </div>

  <!-- ACCIONES -->
  <div class="platform-assessment-header__actions">

    <button
      type="button"
      class="platform-assessment-header__guide"
      aria-label="Guía de evaluaciones"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 3.5 19 7v5c0 4.4-2.9 7.2-7 8.5C7.9 19.2 5 16.4 5 12V7l7-3.5Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="m10 9 4 3-4 3V9Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span>
        Guía de evaluaciones
      </span>
    </button>

  </div>

</header>
