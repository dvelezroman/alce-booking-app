<header class="report-header">
  <div class="report-header__information">
    <div class="report-header__icon" aria-hidden="true">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M9 12h6M9 15h2.5M14 15h1"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />

        <path
          d="M9 18h6"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <div class="report-header__text">
      <h1>Reportes del estudiante</h1>

      <p>
        Consulta y descarga reportes detallados de asistencia y clases del estudiante.
      </p>
    </div>
  </div>

  <div class="report-header__actions">
    <button
      type="button"
      class="report-header__button report-header__button--secondary"
      [disabled]="!isReportGenerated"
      (click)="onDownload()"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M12 3v12m0 0 4-4m-4 4-4-4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M5 18v1.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>Descargar reporte</span>
    </button>

    <button
      type="button"
      class="report-header__button report-header__button--primary"
      (click)="onRefresh()"
    >
      <svg
        width="17"
        height="17"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M20 6v5h-5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M18.2 9A7 7 0 1 0 19 15"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>Actualizar datos</span>
    </button>
  </div>
</header>
