<section class="report-type">
  <div class="report-type__header">
    <span class="report-type__header-icon" aria-hidden="true">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="4"
          y="3.5"
          width="16"
          height="17"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M8 8h3M8 12h3M8 16h3M14 8h2M14 12h2M14 16h2"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <h2>Tipo de reporte</h2>
  </div>

  <div class="report-type__options">
    <button
      type="button"
      class="report-type__option"
      [class.report-type__option--active]="isActive('detailed')"
      (click)="selectReport('detailed')"
    >
      <span class="report-type__option-title">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M14 3.5V8h4M9 12h6M9 15h6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

        <span>Detallado</span>
      </span>

      <span class="report-type__option-description">
        Reporte completo de asistencia por instructor y stage
      </span>
    </button>

    <button
      type="button"
      class="report-type__option"
      [class.report-type__option--active]="isActive('statistical')"
      (click)="selectReport('statistical')"
    >
      <span class="report-type__option-title">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 19.5h14"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M7.5 17V11.5M12 17V6M16.5 17V9"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

        <span>Estadístico</span>
      </span>

      <span class="report-type__option-description">
        Resumen estadístico general del período
      </span>
    </button>

    <button
      type="button"
      class="report-type__option"
      [class.report-type__option--active]="isActive('meetings')"
      (click)="selectReport('meetings')"
    >
      <span class="report-type__option-title">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="4"
            y="5.5"
            width="16"
            height="14.5"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M8 3.5v4M16 3.5v4M4 9.5h16"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

        <span>Clases</span>
      </span>

      <span class="report-type__option-description">
        Listado de clases agendadas
      </span>
    </button>
  </div>
</section>
