<section
  class="booking-help-banner"
  aria-label="Información sobre cancelación de clases"
>
  <div class="booking-help-banner__content">
    <div
      class="booking-help-banner__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M12 3L19 6V11.5C19 15.94 16.08 20.08 12 21.5C7.92 20.08 5 15.94 5 11.5V6L12 3Z"
          fill="currentColor"
        />

        <path
          d="M12 9.25C10.76 9.25 9.75 10.26 9.75 11.5C9.75 12.74 10.76 13.75 12 13.75C13.24 13.75 14.25 12.74 14.25 11.5C14.25 10.26 13.24 9.25 12 9.25Z"
          fill="white"
        />
      </svg>
    </div>

    <div class="booking-help-banner__text">
      <h3 class="booking-help-banner__title">
        Tu aprendizaje es nuestra prioridad
      </h3>

      <p class="booking-help-banner__description">
        Si no puedes asistir, por favor cancela tu clase con anticipación
        para liberar el espacio.
      </p>
    </div>
  </div>

  <button
    type="button"
    class="booking-help-banner__action"
    (click)="openCancellationPolicies()"
  >
    <span>Ver políticas de cancelación</span>

    <svg
      viewBox="0 0 24 24"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <path
        d="M5 12H19"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <path
        d="M14 7L19 12L14 17"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</section>
