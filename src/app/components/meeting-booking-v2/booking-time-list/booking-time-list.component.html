<section class="booking-time-list">
  <div
    *ngIf="!selectedDayInfo"
    class="time-empty-state"
  >
    <div
      class="time-empty-state__illustration"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 240 180"
        role="img"
        focusable="false"
      >
        <defs>
          <linearGradient
            id="calendarGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#9b84f5"
            />

            <stop
              offset="100%"
              stop-color="#6d47d9"
            />
          </linearGradient>

          <linearGradient
            id="clockGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
          >
            <stop
              offset="0%"
              stop-color="#ffffff"
            />

            <stop
              offset="100%"
              stop-color="#f3efff"
            />
          </linearGradient>
        </defs>

        <circle
          cx="120"
          cy="90"
          r="70"
          fill="#f4f0ff"
        />

        <circle
          cx="182"
          cy="44"
          r="8"
          fill="#e5dcff"
        />

        <circle
          cx="58"
          cy="135"
          r="6"
          fill="#ddd1ff"
        />

        <rect
          x="58"
          y="42"
          width="100"
          height="82"
          rx="14"
          fill="#ffffff"
          stroke="#d9cdf9"
          stroke-width="3"
        />

        <path
          d="M58 65H158"
          stroke="#d9cdf9"
          stroke-width="3"
        />

        <path
          d="M82 34V52"
          stroke="url(#calendarGradient)"
          stroke-width="6"
          stroke-linecap="round"
        />

        <path
          d="M134 34V52"
          stroke="url(#calendarGradient)"
          stroke-width="6"
          stroke-linecap="round"
        />

        <rect
          x="74"
          y="78"
          width="15"
          height="13"
          rx="3"
          fill="#ece6ff"
        />

        <rect
          x="95"
          y="78"
          width="15"
          height="13"
          rx="3"
          fill="#ece6ff"
        />

        <rect
          x="116"
          y="78"
          width="15"
          height="13"
          rx="3"
          fill="url(#calendarGradient)"
        />

        <rect
          x="74"
          y="98"
          width="15"
          height="13"
          rx="3"
          fill="#ece6ff"
        />

        <rect
          x="95"
          y="98"
          width="15"
          height="13"
          rx="3"
          fill="#ece6ff"
        />

        <rect
          x="116"
          y="98"
          width="15"
          height="13"
          rx="3"
          fill="#ece6ff"
        />

        <circle
          cx="170"
          cy="116"
          r="28"
          fill="url(#clockGradient)"
          stroke="#7652df"
          stroke-width="4"
        />

        <path
          d="M170 101V116L181 123"
          stroke="#7652df"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />

        <circle
          cx="170"
          cy="116"
          r="3.5"
          fill="#7652df"
        />
      </svg>
    </div>

    <h3 class="time-empty-state__title">
      Selecciona primero un día
    </h3>

    <p class="time-empty-state__description">
      Elige una fecha en el calendario para visualizar
      los horarios disponibles.
    </p>
  </div>

  <ng-container *ngIf="selectedDayInfo">
    <div class="ecuador-time">
      <strong>Hora actual en Ecuador:</strong>
      <span>{{ ecuadorTime }}</span>
    </div>

    <div
      *ngIf="timeSlots.length > 0; else noTimeSlots"
      class="time-slots"
    >
      <button
        *ngFor="let time of timeSlots"
        type="button"
        class="time-slot"
        [class.selected]="isSelected(time)"
        [class.disabled]="time.isDisabled"
        [disabled]="time.isDisabled"
        [attr.title]="
          time.isDisabled
            ? 'Horario no disponible'
            : 'Seleccionar ' + getTimeLabel(time)
        "
        [attr.aria-label]="
          time.isDisabled
            ? 'Horario no disponible'
            : 'Seleccionar horario ' + getTimeLabel(time)
        "
        [attr.aria-pressed]="isSelected(time)"
        (click)="onTimeSlotClick(time)"
      >
        <span class="time-slot-label">
          <ng-container
            *ngIf="!time.isDisabled; else disabledLabel"
          >
            {{ getTimeLabel(time) }}
          </ng-container>

          <ng-template #disabledLabel>
            Horario no disponible
          </ng-template>
        </span>

        <span
          *ngIf="isSelected(time)"
          class="time-slot-check"
          aria-hidden="true"
        >
          <i class="fas fa-check"></i>
        </span>
      </button>
    </div>

    <ng-template #noTimeSlots>
      <div class="time-empty-state">
        <div class="time-empty-icon">
          <span class="material-icons">
            event_busy
          </span>
        </div>

        <h3>Sin horarios disponibles</h3>

        <p>
          No existen horas disponibles para esta fecha.
          Intenta seleccionar otro día.
        </p>
      </div>
    </ng-template>
  </ng-container>
</section>
