    <div class="booking-header__main">
      <div
        class="booking-header__icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 48 48"
          role="img"
          focusable="false"
        >
          <rect
            x="9"
            y="11"
            width="30"
            height="28"
            rx="6"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />

          <path
            d="M9 19H39"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M17 7V14"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path
            d="M31 7V14"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />

          <path

            stroke-width="3"

          />

            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="booking-header__content">
        <h1
          id="booking-header-title"
          class="booking-header__title"
        >
          Agendar clases
        </h1>

        <p class="booking-header__description">
          Selecciona la fecha y hora para tu próxima clase.
        </p>
      </div>
    </div>

    <button
      type="button"
      class="booking-header__scheduled-button"
      (click)="navigateToScheduledMeetings()"
    >
      <svg
        class="booking-header__scheduled-button-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
        focusable="false"
      >
        <rect
          x="3.5"
          y="5"
          width="17"
          height="15"
          rx="3"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <path
          d="M3.5 9H20.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path

          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M16 3.5V6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 13H11"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M8 16H15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>

      <span>
        Ver mis clases agendadas
      </span>

      <span
        class="material-icons booking-header__scheduled-button-arrow"
        aria-hidden="true"
      >
        arrow_forward
      </span>
    </button>
  </div>

  <div

    aria-hidden="true"

        <linearGradient
          id="booking-clock-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#ffffff"
          />

          <stop
            offset="100%"
            stop-color="#eee8ff"
          />

      </defs>
