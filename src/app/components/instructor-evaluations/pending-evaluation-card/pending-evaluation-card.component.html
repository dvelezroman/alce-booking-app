<article
  class="pending-evaluation-card"
  [attr.aria-label]="classTitle"
>
  <div class="pending-evaluation-card__stage">
    <span class="pending-evaluation-card__stage-label">
      Stage
    </span>

    <strong class="pending-evaluation-card__stage-number">
      {{ stageNumber }}
    </strong>

    <span
      class="pending-evaluation-card__status"
      aria-hidden="true"
    >
      <i class="fa-solid fa-hourglass-half"></i>
    </span>
  </div>

  <div class="pending-evaluation-card__information">
    <h3 class="pending-evaluation-card__title">
      {{ classTitle }}
    </h3>

    <p class="pending-evaluation-card__stage-description">
      {{ stageLabel }}
    </p>

    <div class="pending-evaluation-card__metadata">
      <p class="pending-evaluation-card__metadata-item">
        <i
          class="fa-regular fa-calendar"
          aria-hidden="true"
        ></i>

        <span>
          {{ formattedDate }}
        </span>
      </p>

      <p class="pending-evaluation-card__metadata-item">
        <i
          class="fa-regular fa-clock"
          aria-hidden="true"
        ></i>

        <span>
          {{ formattedTime }}
        </span>
      </p>

      <p class="pending-evaluation-card__metadata-item">
        <i
          [class]="modeIcon"
          aria-hidden="true"
        ></i>

        <span>
          {{ classMode }}
        </span>
      </p>
    </div>

    <span class="pending-evaluation-card__badge">
      Pendiente de evaluación
    </span>
  </div>

  <div class="pending-evaluation-card__actions">
    <button
      type="button"
      class="pending-evaluation-card__button"
      (click)="onEvaluate()"
    >
      <i
        class="fa-regular fa-star"
        aria-hidden="true"
      ></i>

      <span>
        Evaluar clase
      </span>
    </button>
  </div>
</article>
