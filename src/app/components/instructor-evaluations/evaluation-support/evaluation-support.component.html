<section
  class="evaluation-support"
  aria-labelledby="evaluation-support-title"
>
  <div class="evaluation-support__content">
    <div
      class="evaluation-support__icon"
      aria-hidden="true"
    >
      <i class="fa-solid fa-info"></i>
    </div>

    <div class="evaluation-support__information">
      <h2
        id="evaluation-support-title"
        class="evaluation-support__title"
      >
        ¿Tienes dudas?
      </h2>

      <p class="evaluation-support__description">
        Si necesitas ayuda con alguna evaluación,
        contacta a tu instructor o al soporte académico.
      </p>
    </div>
  </div>

  <button
    type="button"
    class="evaluation-support__button"
  >
    <i
      class="fa-solid fa-headset"
      aria-hidden="true"
    ></i>

    <span>
      Contactar soporte
    </span>
  </button>
</section>
