<header
  class="evaluation-header"
  aria-labelledby="evaluation-header-title"
>
  <div class="evaluation-header__content">

    <div class="evaluation-header__main">
      <div
        class="evaluation-header__icon"
        aria-hidden="true"
      >
        <i class="fa-regular fa-clipboard"></i>
      </div>

      <div class="evaluation-header__information">
        <h1
          id="evaluation-header-title"
          class="evaluation-header__title"
        >
          Evaluar clases
        </h1>

        <p class="evaluation-header__description">
          Evalúa tus clases recientes y consulta las clases
          que ya has evaluado.
        </p>
      </div>
    </div>
  </div>

  <div
    class="evaluation-header__illustration"
    aria-hidden="true"
  >
    <svg
      viewBox="0 0 300 180"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
    >
      <defs>
        <linearGradient
          id="evaluation-board-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#a48bff"
          />

          <stop
            offset="100%"
            stop-color="#6945df"
          />
        </linearGradient>

        <linearGradient
          id="evaluation-cap-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#8f70f5"
          />

          <stop
            offset="100%"
            stop-color="#5730c8"
          />
        </linearGradient>

        <linearGradient
          id="evaluation-check-gradient"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#987cf6"
          />

          <stop
            offset="100%"
            stop-color="#6845dc"
          />
        </linearGradient>

        <filter
          id="evaluation-shadow"
          x="-30%"
          y="-30%"
          width="160%"
          height="160%"
        >
          <feDropShadow
            dx="0"
            dy="8"
            stdDeviation="8"
            flood-color="#6c49d8"
            flood-opacity="0.18"
          />
        </filter>
      </defs>
