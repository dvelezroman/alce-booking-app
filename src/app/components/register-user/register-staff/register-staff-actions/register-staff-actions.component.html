<section class="register-staff-actions">

  <!-- =========================
       CLEAR
  ========================== -->
  <button
    type="button"
    class="
      register-staff-actions__button
      register-staff-actions__button--secondary
    "
    (click)="onReset()"
  >

    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M4 12a8 8 0 1 0 2.35-5.65"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />

      <path
        d="M4 5v5h5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span>
      Limpiar formulario
    </span>

  </button>


  <!-- =========================
       REGISTER
  ========================== -->
  <button
    type="button"
    class="
      register-staff-actions__button
      register-staff-actions__button--primary
    "
    (click)="onSubmit()"
  >

    <svg
      width="17"
      height="17"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <circle
        cx="9"
        cy="8"
        r="3"
        stroke="currentColor"
        stroke-width="1.7"
      />

      <path
        d="M3 20a6 6 0 0 1 12 0"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />

      <path
        d="M18 6v6M15 9h6"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      />
    </svg>

    <span>
      Registrar usuario
    </span>

  </button>

</section>
