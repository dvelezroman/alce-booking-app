<nav class="attendance-student-pagination" aria-label="Paginación de reuniones">

  <div class="attendance-student-pagination__info">
    Mostrando {{ resultsStart }} a {{ resultsEnd }} de {{ totalItems }} reuniones
  </div>

  @if (totalPages > 1) {
    <div class="attendance-student-pagination__controls">

      <!-- PREVIOUS -->
      <button
        type="button"
        class="attendance-student-pagination__arrow"
        [disabled]="isFirstPage"
        aria-label="Página anterior"
        (click)="previousPage()"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- PAGES -->
      @for (page of pages; track page) {
        <button
          type="button"
          class="attendance-student-pagination__page"
          [class.attendance-student-pagination__page--active]="page === currentPage"
          [attr.aria-current]="page === currentPage ? 'page' : null"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <!-- NEXT -->
      <button
        type="button"
        class="attendance-student-pagination__arrow"
        [disabled]="isLastPage"
        aria-label="Página siguiente"
        (click)="nextPage()"
      >
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

    </div>
  }

</nav>
