<div class="attendance-student-theme-modal__overlay">

  <section
    class="attendance-student-theme-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="attendance-theme-modal-title"
  >

    <!-- =========================
         HEADER
    ========================== -->
    <header class="attendance-student-theme-modal__header">

      <h2
        id="attendance-theme-modal-title"
        class="attendance-student-theme-modal__title"
      >
        Detalles del tema / reunión
      </h2>

      <button
        type="button"
        class="attendance-student-theme-modal__close"
        aria-label="Cerrar modal"
        (click)="onClose()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="m6 6 12 12M18 6 6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>

    </header>


    <!-- =========================
         BODY
    ========================== -->
    <div class="attendance-student-theme-modal__body">

      <!-- =========================
           MEETING SUMMARY
      ========================== -->
      <div class="attendance-student-theme-modal__meeting">

        <div class="attendance-student-theme-modal__meeting-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect
              x="5"
              y="4"
              width="14"
              height="17"
              rx="2"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M9 8h6M9 12h6M9 16h4"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <div class="attendance-student-theme-modal__meeting-content">

          <strong>
            {{ description }}
          </strong>

          <span>
            {{ meetingDate }}
            <span class="attendance-student-theme-modal__dot">•</span>
            {{ meetingHour }}
          </span>

        </div>

      </div>


      <div class="attendance-student-theme-modal__divider"></div>


      <!-- =========================
           META
      ========================== -->
      <div class="attendance-student-theme-modal__meta">

        <div class="attendance-student-theme-modal__meta-item">
          <span>Etapa</span>
          <strong>{{ stageLabel }}</strong>
        </div>

        <div class="attendance-student-theme-modal__meta-item">
          <span>Instructor</span>
          <strong>{{ instructorLabel }}</strong>
        </div>

      </div>


      <!-- =========================
           DESCRIPTION
      ========================== -->
      <div class="attendance-student-theme-modal__section">

        <span class="attendance-student-theme-modal__section-label">
          Descripción
        </span>

        <p>
          {{ description }}
        </p>

      </div>


      <!-- =========================
           OBSERVATION
      ========================== -->
      <div class="attendance-student-theme-modal__section">

        <span class="attendance-student-theme-modal__section-label">
          Observación del instructor
        </span>

        <p>
          Sin observación registrada.
        </p>

      </div>

    </div>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="attendance-student-theme-modal__footer">

      <button
        type="button"
        class="attendance-student-theme-modal__footer-close"
        (click)="onClose()"
      >
        Cerrar
      </button>

    </footer>

  </section>

</div>
