<div class="block-results">

  <div class="stage-navigation-wrapper" *ngIf="history.length > 0">

    <button 
      class="nav-button left-btn"
      [disabled]="!canGoPrevious"
      [ngClass]="{ 'disabled': !canGoPrevious }"
      (click)="onPreviousStage()"
      title="Anterior">
      <i class="fas fa-chevron-left"></i>
    </button>

    <h3 class="student-stage-subtitle">
      {{ stageDescription }}
    </h3>

    <button 
      class="nav-button right-btn"
      [disabled]="!canGoNext"
      [ngClass]="{ 'disabled': !canGoNext }"
      (click)="onNextStage()"
      title="Siguiente">
      <i class="fas fa-chevron-right"></i>
    </button>

  </div>

  <div *ngIf="showProgress" class="progress-wrapper">
    <h3 class="progress-title">
      Avance 
      <!-- del {{ studentStageDescription }} -->
    </h3>

    <div class="progress-bar-container">
      <div
        class="progress-bar-fill"
        [style.width.%]="stageProgress"
        [attr.data-value]="stageProgress + '%'"
        [ngClass]="{
          'progress-low': stageProgress < 40,
          'progress-medium': stageProgress >= 40 && stageProgress < 70,
          'progress-high': stageProgress >= 70 && stageProgress < 100,
          'progress-full': stageProgress === 100
        }"
      ></div>
    </div>
  </div>

  <div class="table-container">
    <table class="table-results is-fullwidth" *ngIf="history.length > 0">
      <thead>
        <tr>
          <th *ngFor="let content of stageContents; let i = index"
              [title]="content.title"
              (mouseenter)="onMouseEnterColumn(i)"
              (mouseleave)="onMouseLeaveColumn()"
              [ngClass]="{ 'column-hovered': hoveredColumnIndex === i }">
            {{ content.title }}
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
         <td *ngFor="let content of stageContents; let i = index"
          [ngClass]="{ 'column-hovered': hoveredColumnIndex === i }">

        <!-- WRAPPER CON SCROLL INTERNO -->
        <div class="scroll-wrapper"
                [ngClass]="{ 'scrollable-cell': getRecordsByContentTitle(content.title).length > 2 }">

              <ng-container *ngFor="let record of getRecordsByContentTitle(content.title)">
                <div *ngFor="let date of record.dates; let j = index; let last = last"
                    class="record-date-entry"
                    [ngClass]="{ 'bordered-entry': !last }">
                  <div>{{ date | date: 'shortDate' }}</div>
                  <div>{{ getInstructorByIndex(record, j) }}</div>
                </div>
              </ng-container>

            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
