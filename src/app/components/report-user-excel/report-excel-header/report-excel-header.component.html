<header class="report-excel-header">

  <!-- LEFT -->
  <div class="report-excel-header__main">

    <div
      class="report-excel-header__icon"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none">

        <path
          d="M7 3.5h7l4 4V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M9 12h6M9 15h6M9 18h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"/>

      </svg>

    </div>

    <div class="report-excel-header__content">

      <h1>
        Reportes de inasistencias
      </h1>

      <p>
        Descarga reportes en Excel según el tipo de información que necesites.
      </p>

    </div>

  </div>

  <!-- HELP -->
  <button
    type="button"
    class="report-excel-header__help"
    (click)="onHelp()"
    aria-label="Ver información sobre el funcionamiento de los reportes">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true">

      <circle
        cx="12"
        cy="12"
        r="9"
        stroke="currentColor"
        stroke-width="1.7"/>

      <path
        d="M9.8 9a2.3 2.3 0 0 1 4.4 1c0 1.7-2.2 2-2.2 3.5"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"/>

      <circle
        cx="12"
        cy="17"
        r=".8"
        fill="currentColor"/>

    </svg>

    <span>
      ¿Cómo funcionan los reportes?
    </span>

  </button>

</header>
