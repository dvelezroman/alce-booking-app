<section class="report-excel-types">

  <!-- HEADER -->
  <header class="report-excel-types__header">

    <h2>
      Tipo de reporte
    </h2>

    <p>
      Selecciona el tipo de reporte que deseas generar.
    </p>

  </header>


  <!-- OPTIONS -->
  <div class="report-excel-types__list">

    <!-- USERS -->
    <button
      type="button"
      class="report-excel-types__item"
      [class.report-excel-types__item--selected]="
        isSelected('users')
      "
      (click)="selectMode('users')">

      <span
        class="
          report-excel-types__icon
          report-excel-types__icon--users
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <circle
            cx="8"
            cy="8"
            r="3"
            stroke="currentColor"
            stroke-width="1.7"/>

          <circle
            cx="16"
            cy="8"
            r="3"
            stroke="currentColor"
            stroke-width="1.7"/>

          <path
            d="M2.5 19c0-3 2.4-5 5.5-5s5.5 2 5.5 5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

          <path
            d="M11.5 16c1-.9 2.3-1.5 4-1.5 3 0 5.5 1.8 5.5 4.5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-excel-types__content">

        <strong>
          Usuarios
        </strong>

        <small>
          Reporte general de usuarios según filtros seleccionados.
        </small>

      </span>

      <span
        class="report-excel-types__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- ABSENTS -->
    <button
      type="button"
      class="report-excel-types__item"
      [class.report-excel-types__item--selected]="
        isSelected('absents')
      "
      (click)="selectMode('absents')">

      <span
        class="
          report-excel-types__icon
          report-excel-types__icon--absents
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <rect
            x="5"
            y="5"
            width="14"
            height="14"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"/>

          <path
            d="M8 3v4M16 3v4M5 9h14"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

          <circle
            cx="15.5"
            cy="15.5"
            r="3"
            stroke="currentColor"
            stroke-width="1.7"/>

          <path
            d="M15.5 14v1.8l1.2.8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-excel-types__content">

        <strong>
          Estudiantes ausentes
        </strong>

        <small>
          Estudiantes que no asistieron a clases en el rango seleccionado.
        </small>

      </span>

      <span
        class="report-excel-types__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>


    <!-- WITHOUT MEETINGS -->
    <button
      type="button"
      class="report-excel-types__item"
      [class.report-excel-types__item--selected]="
        isSelected('without-meetings')
      "
      (click)="selectMode('without-meetings')">

      <span
        class="
          report-excel-types__icon
          report-excel-types__icon--without
        "
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <circle
            cx="10"
            cy="8"
            r="3"
            stroke="currentColor"
            stroke-width="1.7"/>

          <path
            d="M4 19c0-3 2.4-5 6-5 1.5 0 2.8.3 3.8.9"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

          <path
            d="M17 9v4M15 11h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

          <path
            d="m16 17 4 4M20 17l-4 4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"/>

        </svg>

      </span>

      <span class="report-excel-types__content">

        <strong>
          Estudiantes sin clases agendadas
        </strong>

        <small>
          Estudiantes activos que no tienen clases agendadas en el rango seleccionado.
        </small>

      </span>

      <span
        class="report-excel-types__arrow"
        aria-hidden="true">

        <svg
          viewBox="0 0 24 24"
          fill="none">

          <path
            d="m9 6 6 6-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>

        </svg>

      </span>

    </button>

  </div>

</section>
