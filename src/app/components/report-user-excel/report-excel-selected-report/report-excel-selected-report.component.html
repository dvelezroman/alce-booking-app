<section class="report-excel-selected">

  <!-- INFORMATION -->
  <div class="report-excel-selected__information">

    <h2>
      Reporte seleccionado:
      <strong>
        {{ title }}
      </strong>
    </h2>

    <p>
      {{ description }}
    </p>

  </div>


  <!-- OUTPUT FORMAT -->
  <div class="report-excel-selected__format">

    <span
      class="report-excel-selected__format-icon"
      aria-hidden="true">

      <svg
        viewBox="0 0 24 24"
        fill="none">

        <path
          d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5A1.5 1.5 0 0 1 7.5 3.5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M14 3.5V8h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"/>

        <path
          d="M9 12h6M9 15h6M9 18h4"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"/>

      </svg>

    </span>

    <div class="report-excel-selected__format-content">

      <span>
        Formato de salida
      </span>

      <strong>
        Excel (.xlsx)
      </strong>

    </div>

  </div>

</section>
