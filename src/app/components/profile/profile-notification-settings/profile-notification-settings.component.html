<section
  class="notification-settings"
  [class.notification-settings--active]="
    meetingsAlert
  "
  [class.notification-settings--inactive]="
    !meetingsAlert
  "
  aria-labelledby="notification-settings-title"
>
  <div class="notification-settings__content">
    <span
      class="notification-settings__icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="M10 21h4"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <div class="notification-settings__text">
      <h2
        id="notification-settings-title"
        class="notification-settings__title"
      >
        {{ title }}
      </h2>

      <p class="notification-settings__description">
        {{ description }}
      </p>
    </div>
  </div>

  <button
    type="button"
    class="notification-settings__button"
    (click)="manageNotifications()"
  >
    <span>
      {{ buttonLabel }}
    </span>

    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="m9 18 6-6-6-6"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</section>
