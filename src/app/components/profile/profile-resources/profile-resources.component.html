<section
  class="profile-resources-card"
  aria-labelledby="profile-resources-title"
>
  <header class="profile-resources-card__header">
    <div class="profile-resources-card__heading">
      <span
        class="profile-resources-card__heading-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <h2
        id="profile-resources-title"
        class="profile-resources-card__title"
      >
        Recursos y materiales
      </h2>
    </div>
  </header>

  <!-- INFORMACIÓN PARA ROLES NO ESTUDIANTES -->
  <div
    *ngIf="!isStudent; else studentResources"
    class="profile-resources-card__information"
  >
    <span
      class="profile-resources-card__information-icon"
      aria-hidden="true"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
      >
        <circle
          cx="12"
          cy="12"
          r="9"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M12 11v5"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <path
          d="M12 8h.01"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        />
      </svg>
    </span>

    <div class="profile-resources-card__information-content">
      <strong class="profile-resources-card__information-title">
        {{ resourcesMessage }}
      </strong>

      <p class="profile-resources-card__information-description">
        {{ resourcesDescription }}
      </p>
    </div>
  </div>

  <!-- CONTENIDO PARA ESTUDIANTES -->
  <ng-template #studentResources>
    <ng-container *ngIf="hasResources; else emptyState">
      <div class="profile-resources-card__list">
        <article
          *ngFor="
            let resource of visibleResources;
            let resourceIndex = index;
            trackBy: trackByResourceId
          "
          class="profile-resource"
        >
          <div class="profile-resource__thumbnail">
            <span class="profile-resource__stage">
              STAGE
            </span>

            <strong class="profile-resource__number">
              {{
                getResourceNumber(
                  resource,
                  resourceIndex
                )
              }}
            </strong>

            <span
              class="profile-resource__play"
              aria-hidden="true"
            >
              <svg
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="m9 7 8 5-8 5V7Z"
                />
              </svg>
            </span>
          </div>

          <div class="profile-resource__content">
            <h3 class="profile-resource__title">
              {{ resource.title }}
            </h3>

            <p class="profile-resource__description">
              {{
                getResourceDescription(
                  resource
                )
              }}
            </p>
          </div>

          <button
            type="button"
            class="profile-resource__button"
            [disabled]="!resource.link"
            (click)="openResource(resource)"
          >
            <span>
              Ver recurso
            </span>

            <svg
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M14 5h5v5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />

              <path
                d="m19 5-8 8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />

              <path
                d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </article>
      </div>

      <button
        type="button"
        class="profile-resources-card__view-all"
        *ngIf="hasMoreResources"
        (click)="openAllResources()"
      >
        <span>
          Ver todos los recursos
        </span>

        <svg
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M5 12h14"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

          <path
            d="m14 7 5 5-5 5"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </ng-container>
  </ng-template>

  <!-- ESTUDIANTE SIN RECURSOS -->
  <ng-template #emptyState>
    <div class="profile-resources-card__empty">
      <span
        class="profile-resources-card__empty-icon"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />

          <path
            d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
      </span>

      <h3>
        {{ resourcesMessage }}
      </h3>

      <p>
        {{ resourcesDescription }}
      </p>
    </div>
  </ng-template>
</section>
