<section
  class="profile-overview"
  aria-label="Resumen académico del estudiante"
>
  <div class="profile-overview__grid">

    <!-- ROL -->
    <article class="profile-overview__item">
      <div
        class="
          profile-overview__icon
          profile-overview__icon--role
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="9"
            cy="7"
            r="4"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M22 21v-2a4 4 0 0 0-3-3.87"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M16 3.13a4 4 0 0 1 0 7.75"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="profile-overview__content">
        <span class="profile-overview__label">
          Rol
        </span>

        <strong class="profile-overview__value">
          {{ roleLabel }}
        </strong>
      </div>
    </article>

    <!-- MODALIDAD -->
    <article class="profile-overview__item">
      <div
        class="
          profile-overview__icon
          profile-overview__icon--mode
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <rect
            x="3"
            y="4"
            width="18"
            height="13"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M8 21h8M12 17v4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="profile-overview__content">
        <span class="profile-overview__label">
          Modo de estudio
        </span>

        <strong class="profile-overview__value">
          {{ studyModeLabel }}
        </strong>
      </div>
    </article>

    <!-- STAGE -->
    <article class="profile-overview__item">
      <div
        class="
          profile-overview__icon
          profile-overview__icon--stage
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="m12 2 2.15 3.2 3.75.4.4 3.75L21.5 12l-3.2 2.65-.4 3.75-3.75.4L12 22l-2.15-3.2-3.75-.4-.4-3.75L2.5 12l3.2-2.65.4-3.75 3.75-.4L12 2Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />

          <circle
            cx="12"
            cy="12"
            r="3"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
      </div>

      <div class="profile-overview__content">
        <span class="profile-overview__label">
          Stage actual
        </span>

        <strong class="profile-overview__value">
          {{ stageNumber }}
        </strong>

        <span class="profile-overview__caption">
          {{ stageDescription }}
        </span>
      </div>
    </article>

    <!-- CLASIFICACIÓN -->
    <article class="profile-overview__item">
      <div
        class="
          profile-overview__icon
          profile-overview__icon--classification
        "
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <circle
            cx="9"
            cy="7"
            r="4"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M22 21v-2a4 4 0 0 0-3-3.87"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M16 3.13a4 4 0 0 1 0 7.75"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="profile-overview__content">
        <span class="profile-overview__label">
          Clasificación
        </span>

        <strong class="profile-overview__value">
          {{ classificationLabel }}
        </strong>
      </div>
    </article>

  </div>
</section>
