<article
  class="profile-summary"
  *ngIf="user"
  aria-labelledby="profile-summary-name"
>
  <div class="profile-summary__content">

    <!-- AVATAR -->
    <div class="profile-summary__avatar-column">
      <div class="profile-summary__avatar">
        <span aria-hidden="true">
          {{ initials }}
        </span>

        <button
          type="button"
          class="profile-summary__edit-avatar"
          aria-label="Editar información del perfil"
          title="Editar perfil"
          (click)="onEditProfile()"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M14.5 6.5 13.2 4.8a2 2 0 0 0-1.6-.8H8.4a2 2 0 0 0-1.6.8L5.5 6.5H4a2 2 0 0 0-2 2V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8.5a2 2 0 0 0-2-2h-5.5Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <circle
              cx="12"
              cy="13"
              r="3.5"
              stroke="currentColor"
              stroke-width="1.7"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- IDENTIDAD -->
    <div class="profile-summary__identity">
      <div class="profile-summary__identity-header">
        <h2
          id="profile-summary-name"
          class="profile-summary__name"
        >
          {{ fullName }}
        </h2>

        <span class="profile-summary__role">
          {{ roleLabel }}
        </span>
      </div>

      <div class="profile-summary__contact-list">
        <div class="profile-summary__contact-item">
          <span
            class="profile-summary__contact-icon"
            aria-hidden="true"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M4 4h16v16H4V4Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />

              <path
                d="m4 6 8 6 8-6"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span class="profile-summary__contact-value">
            {{ username }}
          </span>
        </div>

        <div class="profile-summary__contact-item">
          <span
            class="profile-summary__contact-icon"
            aria-hidden="true"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M4 4h16v16H4V4Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linejoin="round"
              />

              <path
                d="m4 6 8 6 8-6"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span class="profile-summary__contact-value">
            {{ emailAddress }}
          </span>
        </div>

        <div class="profile-summary__contact-item">
          <span
            class="profile-summary__contact-icon"
            aria-hidden="true"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M7.5 3.5 10 8 8.2 9.8a14.1 14.1 0 0 0 6 6L16 14l4.5 2.5-.8 3a2 2 0 0 1-2 1.5C9.6 20.5 3.5 14.4 3 6.3a2 2 0 0 1 1.5-2l3-.8Z"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span class="profile-summary__contact-value">
            {{ contact }}
          </span>
        </div>
      </div>
    </div>

    <!-- SEPARADOR -->
    <span
      class="profile-summary__divider"
      aria-hidden="true"
    ></span>

    <!-- ESTADO -->
    <div class="profile-summary__metadata">
      <div class="profile-summary__metadata-block">
        <span class="profile-summary__metadata-label">
          Estado
        </span>

        <span
          class="profile-summary__status"
          [ngClass]="statusClass"
        >
          <span
            class="profile-summary__status-dot"
            aria-hidden="true"
          ></span>

          {{ statusLabel }}
        </span>
      </div>

      <div class="profile-summary__metadata-block">
        <span class="profile-summary__metadata-label">
          Miembro desde
        </span>

        <div class="profile-summary__member-date">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="2"
              stroke="currentColor"
              stroke-width="1.7"
            />

            <path
              d="M8 3v4M16 3v4M3 10h18"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>

          <span>
            {{ memberSince }}
          </span>
        </div>
      </div>
    </div>

    <!-- MARCA DECORATIVA -->
    <div
      class="profile-summary__watermark"
      aria-hidden="true"
    >
      <img
        src="assets/logo imagen alce.png"
        alt=""
      />
    </div>
  </div>
</article>
