<section class="assessment-resources">

  <!-- =========================
       TITLE
  ========================== -->

  <h2 class="assessment-resources__title">
    Recursos de refuerzo disponibles
  </h2>


  <!-- =========================
       LIST
  ========================== -->

  <div
    *ngIf="hasResources; else emptyResources"
    class="assessment-resources__list"
  >

    <button
      *ngFor="
        let resource of resources;
        trackBy: trackByResourceId
      "
      type="button"
      class="assessment-resources__item"
      (click)="openResource(resource)"
    >

      <!-- ICON -->
      <span
        class="assessment-resources__icon"
        aria-hidden="true"
        >
        <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
        >
            <rect
            x="3.5"
            y="6"
            width="12.5"
            height="12"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
            />

            <path
            d="M16 10l4-2.5v9L16 14"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            />

            <path
            d="m8.5 9.5 4 2.5-4 2.5v-5Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
            />
        </svg>
        </span>


      <!-- INFORMATION -->
      <span class="assessment-resources__information">

        <strong class="assessment-resources__name">
          {{ getResourceTitle(resource) }}
        </strong>

        <span class="assessment-resources__description">
          {{ getResourceDescription(resource) }}
        </span>

      </span>


      <!-- EXTERNAL LINK -->
      <span
        class="assessment-resources__external"
        aria-hidden="true"
      >
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M13 5h6v6"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <path
            d="m19 5-8 8"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />

          <path
            d="M11 6H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </span>

    </button>

  </div>


  <!-- =========================
       FOOTER
  ========================== -->

  <button
    *ngIf="hasResources"
    type="button"
    class="assessment-resources__view-all"
  >
    <span>
      Ver todos los recursos
    </span>

    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M5 12h14M14 7l5 5-5 5"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>


  <!-- =========================
       EMPTY
  ========================== -->

  <ng-template #emptyResources>

    <div class="assessment-resources__empty">

      <div
        class="assessment-resources__empty-icon"
        aria-hidden="true"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M6 3.5h8l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1-1.5Z"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M14 3.5V8h4M9 12h6M9 15h4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <strong>
        No hay recursos disponibles
      </strong>

      <span>
        Los recursos de refuerzo aparecerán aquí.
      </span>

    </div>

  </ng-template>

</section>
