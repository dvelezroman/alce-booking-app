<article class="assessment-item">

  <!-- =========================
       TYPE
  ========================== -->

  <div class="assessment-item__type">

    <div
      class="assessment-item__type-icon"
      [ngClass]="'assessment-item__type-icon--' + typeClass"
      aria-hidden="true"
    >

      <!-- SPEAKING -->
      <svg
        *ngIf="typeClass === 'speaking'"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M5 10H3.8A1.8 1.8 0 0 0 2 11.8v.4A1.8 1.8 0 0 0 3.8 14H5l4 4V6l-4 4Z"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
        />

        <path
          d="M13 9.5a4 4 0 0 1 0 5M16 7a7 7 0 0 1 0 10"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>


      <!-- GRAMMAR -->
      <svg
        *ngIf="typeClass === 'grammar'"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M5 4h8a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M15 8h4v12h-4M8 8h4M8 12h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>


      <!-- WRITING -->
      <svg
        *ngIf="typeClass === 'writing'"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="m5 17-.8 3.8L8 20l10.2-10.2a2 2 0 0 0 0-2.8L17 5.8a2 2 0 0 0-2.8 0L5 15v2Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="m13.5 6.5 4 4M4 21h16"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>


      <!-- LISTENING -->
      <svg
        *ngIf="typeClass === 'listening'"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M5 13v-2a7 7 0 0 1 14 0v2"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />

        <rect
          x="3"
          y="12"
          width="4"
          height="7"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />

        <rect
          x="17"
          y="12"
          width="4"
          height="7"
          rx="2"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>


      <!-- READING -->
      <svg
        *ngIf="typeClass === 'reading'"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <path
          d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />

        <path
          d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5a2.5 2.5 0 0 1 2.5 2.5v-16Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
      </svg>


      <!-- DEFAULT -->
      <svg
        *ngIf="
          typeClass !== 'speaking' &&
          typeClass !== 'grammar' &&
          typeClass !== 'writing' &&
          typeClass !== 'listening' &&
          typeClass !== 'reading'
        "
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
      >
        <rect
          x="5"
          y="4"
          width="14"
          height="16"
          rx="2"
          stroke="currentColor"
          stroke-width="1.7"
        />

        <path
          d="M8.5 9h7M8.5 13h7M8.5 17h4"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </svg>

    </div>


    <div class="assessment-item__type-content">

        <div class="assessment-item__type-header">

            <strong class="assessment-item__type-name">
            {{ assessmentTypeLabel }}
            </strong>

            <span class="assessment-item__stage-badge">
            Stage {{ assessment.stageId }}
            </span>

        </div>

        <span class="assessment-item__type-description">
            {{ assessmentTypeDescription }}
        </span>

        </div>

  </div>


  <!-- =========================
       SCORE
  ========================== -->

  <div class="assessment-item__score">

    <div
      class="assessment-item__score-circle"
      [class.assessment-item__score-circle--approved]="isApproved"
      [class.assessment-item__score-circle--failed]="!isApproved"
      [style.--score]="pointsPercentage"
    >

      <div class="assessment-item__score-inner">

        <strong>
          {{ points }}
        </strong>

        <span>
          /100
        </span>

      </div>

    </div>

  </div>


  <!-- =========================
       STATUS
  ========================== -->

  <div class="assessment-item__status">

    <span
      class="assessment-item__status-badge"
      [class.assessment-item__status-badge--approved]="isApproved"
      [class.assessment-item__status-badge--failed]="!isApproved"
    >

      <span
        class="assessment-item__status-icon"
        aria-hidden="true"
      >

        <svg
          *ngIf="isApproved"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m8 12 2.5 2.5L16 9"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>


        <svg
          *ngIf="!isApproved"
          width="13"
          height="13"
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="12"
            r="9"
            stroke="currentColor"
            stroke-width="1.8"
          />

          <path
            d="m9 9 6 6M15 9l-6 6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>

      </span>

      {{ statusLabel }}

    </span>

  </div>


    <!-- =========================
        DATE
    ========================== -->

    <div class="assessment-item__date">

    <span
        class="assessment-item__date-icon"
        aria-hidden="true"
    >
        <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        >
        <rect
            x="3.5"
            y="5.5"
            width="17"
            height="15"
            rx="2.2"
            stroke="currentColor"
            stroke-width="1.7"
        />

        <path
            d="M7 3.5v4M17 3.5v4M3.5 9.5h17"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
        />

        <path
            d="M8 13h3M13 13h3M8 16.5h3"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
        />
        </svg>
    </span>


    <div class="assessment-item__date-content">

        <span class="assessment-item__weekday">
        {{ formattedWeekday || '--' }}
        </span>

        <span class="assessment-item__date-value">
        {{ formattedDate || '--' }}
        </span>

        <span
        *ngIf="formattedHour"
        class="assessment-item__hour-value"
        >
        {{ formattedHour }}
        </span>

    </div>

    </div>


    <!-- =========================
        INSTRUCTOR
    ========================== -->

    <div class="assessment-item__instructor">

    <div
        class="assessment-item__instructor-avatar"
        aria-hidden="true"
    >
        {{ instructorInitials }}
    </div>


    <div class="assessment-item__instructor-info">

        <strong
        [title]="instructorName"
        >
        {{ instructorName }}
        </strong>

        <span>
        Instructor
        </span>

    </div>

    </div>

</article>
