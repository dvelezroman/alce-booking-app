<div class="meeting-row" [class.meeting-row--today]="isMeetingToday">
  <!-- FECHA -->
  <div class="meeting-row__cell meeting-row__cell--date" data-label="Fecha">
    <span class="meeting-row__date-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3.5" y="5.5" width="17" height="15" rx="2.2" stroke="currentColor" stroke-width="1.7" />
        <path d="M7 3.5v4M17 3.5v4M3.5 9.5h17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <path d="M8 13h3M13 13h3M8 16.5h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </span>

    <div class="meeting-row__date-content">
      <span class="meeting-row__weekday">{{ formattedWeekday }}</span>
      <span class="meeting-row__date-value">{{ formattedDate }}</span>
    </div>
  </div>

  <!-- HORA -->
  <div class="meeting-row__cell meeting-row__cell--hour" data-label="Hora">
    <span class="meeting-row__hour-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
        <path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>

    <span class="meeting-row__hour-value">{{ formattedHour }}</span>
  </div>

  <!-- ESTUDIANTE -->
  <div class="meeting-row__cell meeting-row__cell--student" data-label="Estudiante">
    <button
      type="button"
      class="meeting-row__student-trigger"
      title="Ver historial de contenidos"
      [attr.aria-label]="'Ver historial de contenidos de ' + studentName"
      (click)="onStudentContentHistory()"
    >
      <span class="meeting-row__avatar" aria-hidden="true">{{ studentInitials }}</span>

      <span class="meeting-row__student-information">
        <span class="meeting-row__student-name">{{ studentName }}</span>

        <span class="meeting-row__student-meta">
          ID: {{ meeting.studentId }}
          <ng-container *ngIf="studentCategory"> • {{ studentCategory }}</ng-container>
        </span>
      </span>
    </button>
  </div>

  <!-- STAGE -->
  <div class="meeting-row__cell meeting-row__cell--stage" data-label="Stage">
    <span class="meeting-row__stage-badge" *ngIf="stageNumber">Stage {{ stageNumber }}</span>
    <span class="meeting-row__stage-description">{{ stageDescription || 'Sin stage' }}</span>
  </div>

  <!-- PROGRESO -->
  <div class="meeting-row__cell meeting-row__cell--progress" data-label="Progreso">
    <div class="meeting-row__progress">
      <span class="meeting-row__progress-value" [ngClass]="studentProgressClass">
        {{ formattedStudentProgress }}
      </span>

      <div class="meeting-row__progress-track" aria-hidden="true">
        <div
          class="meeting-row__progress-bar"
          [ngClass]="studentProgressClass"
          [style.width.%]="studentProgress"
        ></div>
      </div>
    </div>
  </div>

  <!-- MODALIDAD -->
  <div class="meeting-row__cell meeting-row__cell--mode" data-label="Modalidad">
    <span class="meeting-row__mode-icon" aria-hidden="true">
      <svg *ngIf="isOnline" width="17" height="17" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4.5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.7" />
        <path d="M8 20h8M12 17.5V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>

      <svg *ngIf="isPresential" width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M8.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM15.5 10a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.6" />
        <path d="M3.5 19v-1.5A4.5 4.5 0 0 1 8 13h1a4.5 4.5 0 0 1 4.5 4.5V19M14.5 13.5a4 4 0 0 1 6 3.5v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
    </span>

    <span class="meeting-row__mode-label">{{ modalityLabel }}</span>
  </div>

  <!-- CONTENIDO -->
  <div class="meeting-row__cell meeting-row__cell--content" data-label="Contenido">
    <ng-container *ngIf="hasStudyContent; else noContent">
      <ul class="meeting-row__content-list">
        <li *ngFor="let content of visibleStudyContent">{{ content.title }}</li>
      </ul>

      <button type="button" class="meeting-row__text-action" (click)="onContentView()">
        Ver más
        <span *ngIf="remainingStudyContentCount > 0">({{ remainingStudyContentCount }})</span>
      </button>
    </ng-container>

    <ng-template #noContent>
      <span class="meeting-row__empty-value">Sin contenido</span>
    </ng-template>
  </div>

  <!-- ASISTENCIA -->
  <div class="meeting-row__cell meeting-row__cell--assistance" data-label="Asistencia">
    <button
      type="button"
      class="meeting-row__attendance"
      [class.meeting-row__attendance--present]="assistanceState === 'present'"
      [class.meeting-row__attendance--absent]="assistanceState === 'absent'"
      [class.meeting-row__attendance--pending]="assistanceState === 'pending'"
      [class.meeting-row__attendance--disabled]="!canMarkAssistance"
      [attr.aria-disabled]="!canMarkAssistance"
      (click)="canMarkAssistance && onAssistanceClick($event)"
    >
      <span class="meeting-row__attendance-box" aria-hidden="true">
        <svg *ngIf="assistanceState === 'present'" width="12" height="12" viewBox="0 0 24 24" fill="none">
          <path d="m5 12 4 4 10-10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>

        <svg *ngIf="assistanceState === 'absent'" width="12" height="12" viewBox="0 0 24 24" fill="none">
          <path d="M7 7l10 10M17 7 7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </span>

      <span>{{ assistanceLabel }}</span>
    </button>
  </div>

  <!-- REFUERZOS -->
  <div class="meeting-row__cell meeting-row__cell--reinforcement" data-label="Refuerzos">
    <button *ngIf="hasReinforcement; else reinforcementActions" type="button" class="meeting-row__reinforcement meeting-row__reinforcement--active" (click)="onCommentView()">
      <span class="meeting-row__reinforcement-icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
          <path d="m8.5 12 2.2 2.2 4.8-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>

      <span>Con refuerzos</span>
    </button>

    <ng-template #reinforcementActions>
      <button type="button" class="meeting-row__reinforcement" (click)="onCommentView()">
        <span class="meeting-row__reinforcement-icon meeting-row__reinforcement-icon--comments" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.6 8.6 0 0 1-3-.55L4 20l1.5-4.1A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          </svg>
        </span>

        <span>Ver comentarios</span>
      </button>
    </ng-template>
  </div>

  <!-- NOTAS -->
  <div class="meeting-row__cell meeting-row__cell--notes" data-label="Notas">
    <button *ngIf="hasInstructorNote; else noInstructorNote" type="button" class="meeting-row__note" (click)="onTemporaryCommentView()">
      <span class="meeting-row__note-icon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M6 3.5h9l3 3V20H6V3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <path d="M15 3.5V7h3M9 11h6M9 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>

      <span>Ver nota</span>
    </button>

    <ng-template #noInstructorNote>
      <span class="meeting-row__empty-inline">
        <span class="meeting-row__dash">—</span>
        <span>Sin nota</span>
      </span>
    </ng-template>
  </div>

  <!-- ACCIONES -->
  <div class="meeting-row__cell meeting-row__cell--actions" data-label="Acciones">
    <div class="meeting-row__actions">
      <button type="button" class="meeting-row__action-button" title="Historial de contenidos" aria-label="Ver historial de contenidos" (click)="onStudentContentHistory()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M5 4h14v16H5V4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>

      <button type="button" class="meeting-row__action-button" title="Historial de evaluaciones" aria-label="Evaluaciones del estudiante" (click)="onEvaluation()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="m12 3 2.5 5.1 5.6.8-4.1 4 1 5.6-5-2.6-5 2.6 1-5.6-4.1-4 5.6-.8L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        </svg>
      </button>

      <button *ngIf="hasTemporaryComment" type="button" class="meeting-row__action-button" title="Comentario temporal" aria-label="Ver comentario temporal" (click)="onTemporaryCommentView()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.6 8.6 0 0 1-3-.55L4 20l1.5-4.1A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- <button type="button" class="meeting-row__more-button" title="Más acciones" aria-label="Más acciones">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.6" />
          <circle cx="12" cy="12" r="1.6" />
          <circle cx="12" cy="19" r="1.6" />
        </svg>
      </button> -->
    </div>
  </div>
</div>
