<section class="meetings-icon-guide">
  <h2 class="meetings-icon-guide__title">Guía de íconos</h2>

  <div class="meetings-icon-guide__grid">

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--present" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
          <path d="m7.5 12 3 3 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Presente</strong>
        <span>Asistencia marcada</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--absent" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Ausente</strong>
        <span>No asistió</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--pending" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Sin marcar</strong>
        <span>Pendiente</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--reinforcement" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.8" />
          <path d="m8.5 12 2.3 2.3 4.7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Con refuerzos</strong>
        <span>Evaluaciones / recursos</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--comments" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.6 8.6 0 0 1-3-.55L4 20l1.5-4.1A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Ver Comentarios</strong>
        <span>Notas y recursos</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--note" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M6 3.5h9l3 3V20H6V3.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
          <path d="M15 3.5V7h3M9 11h6M9 14h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Ver Nota</strong>
        <span>Nota del instructor</span>
      </div>
    </div>

    <div class="meetings-icon-guide__item">
      <span class="meetings-icon-guide__icon meetings-icon-guide__icon--more" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.5" />
          <circle cx="12" cy="12" r="1.5" />
          <circle cx="12" cy="19" r="1.5" />
        </svg>
      </span>

      <div class="meetings-icon-guide__text">
        <strong>Más opciones</strong>
        <span>Acciones adicionales</span>
      </div>
    </div>

  </div>
</section>
