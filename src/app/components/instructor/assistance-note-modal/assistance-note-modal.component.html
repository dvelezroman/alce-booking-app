<div *ngIf="show" class="modal-overlay">
  <div class="modal-box">

    <h3 class="modal-title">
      {{ title }} <span *ngIf="optionalLabel">({{ optionalLabel }})</span>
    </h3>

    <textarea
      [(ngModel)]="note"
      [placeholder]="placeholder"
      rows="4">
    </textarea>

    <div class="actions">
      <button class="btn-cancel" (click)="onCancel()">
        Cancelar
      </button>

      <button 
        class="btn-save" 
        [disabled]="!allowEmpty && !note.trim()"
        (click)="onSave()">
        Guardar
      </button>
    </div>

  </div>
</div>
